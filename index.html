<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* Splash Screen - Locked to your PNG */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            transition: opacity 1s ease;
        }
        .splash-overlay { position: absolute; bottom: 50px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; z-index: 5001; gap: 30px; }
        .counter-panel { background: rgba(0, 0, 0, 0.7); border: 2px solid #d4af37; padding: 12px 20px; border-radius: 8px; color: #d4af37; font-family: 'Courier New', monospace; font-size: 1.1em; font-weight: bold; }

        /* Main Dashboard Organization */
        #main-ui { display:none; text-align: center; padding-top: 5px; }
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.9); border-bottom: 3px solid #3e2723; margin-bottom: 20px; }

        /* Side-by-Side Controls */
        .control-row {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto 40px auto; gap: 40px; padding: 0 40px;
        }
        .music-panel-small { flex: 0 0 300px; background: #211510; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; }
        .search-panel-long { flex: 1; display: flex; flex-direction: column; }
        
        input[type="text"] { 
            padding: 22px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #d4af37; border-radius: 8px; font-size: 22px; 
            box-shadow: inset 0 0 15px #000;
        }

        /* Surname Grid - Widely Spaced */
        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.6fr 1fr; align-items: start; 
            max-width: 1600px; margin: auto; gap: 60px; padding: 20px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 60px; } /* Maximum spreading */
        .family-btn-group { display: flex; align-items: center; gap: 30px; justify-content: center; }
        
        .family-thumb { width: 140px; height: 140px; border-radius: 12px; border: 3px solid #d4af37; object-fit: cover; box-shadow: 0 0 25px rgba(212,175,55,0.4); }
        
        .central-container { position: relative; margin-top: -60px; } /* Lifted higher */
        .destiny-caption { color: #d4af37; font-weight: bold; font-size: 2.5em; margin-bottom: 25px; text-shadow: 3px 3px 6px #000; letter-spacing: 4px; }

        .wood-btn { 
            padding:20px 40px; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:8px; cursor:pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em; min-width: 200px;
        }
        .wood-btn:hover { border-color: #fff; box-shadow: 0 0 20px #d4af37; }

        .central-portrait { border: 6px solid #d4af37; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }

        /* THE HISTORY VAULT - BUILT FOR PAGES OF TEXT */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:50px; }
        .vault-content { background:#0a0a0a; border:2px solid #d4af37; padding:50px; border-radius:12px; text-align: left; max-width: 1200px; margin: auto; box-shadow: 0 0 60px #000; }
        .history-section { border-bottom: 1px solid #3e2723; padding: 30px 0; color: #fbe9e7; line-height: 2.0; font-size: 1.25em; white-space: pre-wrap; }
        .history-section h3 { color: #d4af37; font-size: 1.8em; margin-top: 0; text-decoration: underline; }
    </style>
</head>
