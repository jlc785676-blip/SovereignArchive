<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Archive</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; text-align: center; padding: 20px; }
        .vault { border: 2px solid #d4af37; padding: 30px; background: #111; max-width: 800px; margin: auto; border-radius: 8px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        h1 { letter-spacing: 4px; border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        input { padding: 12px; width: 85%; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 15px; }
        button { padding: 15px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; width: 90%; text-transform: uppercase; border-radius: 4px; }
        .btn-link { display: inline-block; padding: 15px; background: #222; color: #d4af37; text-decoration: none; border: 1px solid #d4af37; border-radius: 4px; margin-top: 40px; width: 85%; font-weight: bold; }
        .btn-link:hover { background: #d4af37; color: #000; }
    </style>
</head>
<body>
    <div class="vault">
        <h1>SOVEREIGN ARCHIVE</h1>
        <p><i>The Chaney, Vance, & Perry Master Portal</i></p>
        
        <input type="text" id="nameIn" placeholder="Enter Ancestor Name">
        <button onclick="window.open('https://www.google.com/search?q=' + document.getElementById('nameIn').value + ' genealogy census records')">
            EXECUTE GLOBAL SEARCH
        </button>

        <br>
        <a href="Gedcom.txt" target="_blank" class="btn-link">OPEN MASTER DATA FILE (GEDCOM.TXT)</a>
    </div>
</body>
</html>
