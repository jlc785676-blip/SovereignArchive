            width: 100%;
            height: 450px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(10,10,10,1)),

        /* The Tree of Life Visual Branching */
        #output { 
            width: 95%; max-width: 1400px; padding: 50px 0; 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 30px;
        }

        .branch-node { 
            background: rgba(20, 20, 20, 0.9); 
            border: 1px solid #333;
            border-top: 4px solid #d4af37;
            padding: 30px; width: 400px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            transition: 0.3s;
        }
        .branch-node:hover { transform: scale(1.02); border-color: #fff; }

        /* Tree Branch Connectors */
        .branch-node::before {
            content: ""; position: absolute; top: -34px; left: 50%;
            width: 2px; height: 30px; background: #d4af37;
        }
