<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; min-height: 100%; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.4s ease;
        }
        .splash-art-frame { width: 90%; max-width: 900px; border: 4px solid #d4af37; box-shadow: 0 0 40px #000; margin-bottom: 25px; }
        .splash-image { width: 100%; height: auto; display: block; }

        .gate-btn { 
            padding: 18px 40px; background: linear-gradient(#8b0000, #4a0000); color: #ffffff; 
            border: 2px solid #d4af37; font-weight: bold; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em;
        }

        #main-ui { 
            display:none; text-align: center; max-width: 1200px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.5s ease; padding: 10px;
        }
        
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.95); border-bottom: 3px solid #ff0000; margin-bottom: 20px; }
        .main-title { color: #ffffff; margin: 0; font-size: 1.8em; letter-spacing: 2px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 800px; margin: 0 auto 25px auto; }
        input[type="text"] { 
            padding: 15px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; 
            box-sizing: border-box;
        }
        .red-btn {
            padding: 12px 30px; background: #ff0000; color: #ffffff; margin-top: 10px;
            border: 1px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media (min-width: 1000px) { .archive-grid { grid-template-columns: 300px 1fr 300px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 30px; align-items: center; }
