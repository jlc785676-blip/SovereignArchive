<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Global Maritime & Fellowship Chronicle</title>
    <style>
        :root {
            --primary-gold: #c5a059;
            --deep-blue: #0a192f;
            --parchment: #f4ece1;
            --text-dark: #2c2c2c;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: var(--deep-blue);
            color: var(--parchment);
            scroll-behavior: smooth;
        }

        /* --- Splash Page --- */
        #splash-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a3a5f 0%, #0a192f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            transition: opacity 1s ease-out;
        }

        #splash-page h1 {
            font-size: 3rem;
            color: var(--primary-gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .enter-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: var(--primary-gold);
            color: var(--deep-blue);
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
        }

        /* --- Main Content --- */
        #main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 2px solid var(--primary-gold);
        }

        /* --- Video Player Section --- */
        .video-container {
            margin: 40px auto;
            max-width: 800px;
            border: 5px solid var(--primary-gold);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        /* --- Button Controls --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .control-btn {
            background-color: #162a4a;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background-color: var(--primary-gold);
            color: var(--deep-blue);
        }

        /* --- Encyclopedia Display Area --- */
        #encyclopedia-viewer {
            background-color: var(--parchment);
            color: var(--text-dark);
            padding: 40px;
            border-radius: 8px;
            line-height: 1.6;
            min-height: 400px;
        }

        .ledger-entry {
            margin-bottom: 40px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 20px;
        }

        .ledger-entry h2 {
            color: #8b0000;
            border-bottom: 2px solid #8b0000;
            display: inline-block;
        }

        .detail-label {
            font-weight: bold;
            color: #444;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="splash-page">
        <h1>THE GLOBAL MARITIME & FELLOWSHIP CHRONICLE</h1>
        <p>1135 – 1750: FROM EUROPE TO THE AMERICAN COLONIES</p>
        <button class="enter-btn" onclick="enterSite()">Enter Encyclopedia</button>
    </div>

    <div id="main-content">
        <header>
            <h1>Encyclopedia Main Ledger</h1>
        </header>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/2pCv7k_7j6c" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="nav-grid">
            <button class="control-btn" onclick="showSection('shipbuilding')">SHIPBUILDING & ARRIVALS</button>
            <button class="control-btn" onclick="showSection('knight-service')">KNIGHTLY SERVICE</button>
            <button class="control-btn" onclick="showSection('old-world')">OLD WORLD
