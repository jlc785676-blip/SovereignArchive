<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* THE CLEANED SPLASH SCREEN */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; 
            background-position: center -20px; /* LIFTED HIGHER TO CLEAR THE FLOOR */
            background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: opacity 1s ease;
        }

        .splash-overlay { 
            display: flex; justify-content: center; align-items: center; z-index: 5001; 
            gap: 30px; flex-wrap: wrap; padding: 40px 10px;
            width: 100%; box-sizing: border-box;
            background: none; /* REMOVED THE WEIRD BAR */
        }

        .counter-panel { 
            background: rgba(0, 0, 0, 0.7); border: 2px solid #d4af37; 
            padding: 10px 20px; border-radius: 8px; color: #d4af37; 
            font-family: 'Courier New', monospace; font-size: 1.1em; font-weight: bold; 
        }

        /* MAIN UI */
        #main-ui { display:none; text-align: center; padding-top: 5px; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 3px solid #d4af37; margin-bottom: 20px; }

        .control-row {
            display: flex; flex-direction: column; align-items: center;
            max-width: 1400px; margin: 0 auto 30px auto; gap: 20px; padding: 0 20px;
        }
        .music-panel-small { width: 100%; max-width: 500px; background: #211510; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; }
        
        .destiny-btn { 
            padding:20px 60px; background:linear-gradient(#5d4037, #1a0f00); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:4px; cursor:pointer; 
            text-transform: uppercase; letter-spacing: 4px; font-size: 1.5em; width: 100%; max-width: 600px;
            box-shadow: 0 0 20px #000;
        }

        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.8fr 1fr; align-items: start; 
            max-width: 1600px; margin: auto; gap: 40px; padding: 10px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 60px; }
        .family-btn-group { display: flex; align-items: center; gap: 30px; justify-content: center; }
        .family-thumb { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #d4af37; object-fit: cover; background: #111; }
        
        .central-container { position: relative; margin-top: 10px; } 

        .wood-btn { 
            padding:18px 35px; background:linear-gradient(#5d4037, #1a0f00); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:4px; cursor:pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em; min-width: 180px;
        }
        .wood-btn:hover { border-color: #fff; box-shadow: 0 0 20px #d4af37; }
        .central-portrait { border: 5px solid #d4af37; border-radius: 15px; width: 100%; max-width: 600px; }

        /* VAULT */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#0a0a0a; border:3px solid #d4af37; padding:40px; border-radius:10px; text-align: left; max-width: 1200px; margin: 40px auto; color: #fff; }
        .history-entry { border-bottom: 1px solid #3e2723; padding: 30px 0; line-height: 2.2; font-size: 1.3em; white-space: pre-wrap; }
        .history-section-title { color: #d4af37; border-bottom: 2px solid #d4af37; margin-top: 40px; font-size: 1.8em; text-transform: uppercase; }

        @media (max-width: 900px) {
            #splash { background-position: center 0%; }
            .archive-grid { grid-template-columns: 1fr; }
            .central-container { order: -1; margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay">
            <button class="wood-btn" style="font-size: 1.5em; padding: 25px 50px;" onclick="enterArchive()">ENTER THE SAGA</button>
            <div class="counter-panel">VISITORS: <span id="v-count">0</span></div>
        </div>
        <div style="color: #d4af37; margin-bottom: 15px; font-style: italic; z-index: 5001;">By Josh Chaney</div>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 3px;">THE SOVEREIGN ARCHIVE</h1>
        </div>

        <div class="control-row">
            <button class="destiny-btn">CHOOSE YOUR DESTINY</button>
            <div class="music-panel-small">
                <iframe width="100%" height="150" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-column">
                <div class="family-btn-group">
                    <img src="william_surname.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('CHANEY')">CHANEY</button>
                </div>
                <div class="family-btn-group">
                    <img src="raymond_surname.jpeg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('VANCE')">VANCE</button>
                </div>
                <div class="family-btn-group">
                    <img src="sellards.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('SELLARDS')">SELLARDS</button>
                </div>
            </div>

            <div class="central-container">
                <img src="jenny_wiley_portrait.jpg" class="central-portrait">
            </div>

            <div class="side-column">
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('PERRY')">PERRY</button>
                    <img src="perry.jpg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('CLAY')">CLAY</button>
                    <img src="clay.jpg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON</button>
                    <img src="williamson.jpg" class="family-thumb">
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 40px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const familyData = {
            'CHANEY': {
                title: "CHANEY: THE ANCIENT KNIGHTS",
                content: `<div class="history-section-title">ORIGINS</div><div class="history-entry">Tracing from Rollo of Normandy to William the Conqueror. The de Quesnay family was knighted in Yorkshire for their valor in the 1066 invasion. Over 20 famous ancestors including Templars and cinematic legends like Lon Chaney.</div>`
            },
            'VANCE': {
                title: "VANCE: THE FRONTIER GIANTS",
                content: `<div class="history-section-title">CRUSADES & BEYOND</div><div class="history-entry">From Raymond Vance in the Holy Land to President Andrew Jackson's ties. This line includes governors, generals, and the rugged pioneers of the Appalachian pass.</div>`
            },
            'SELLARDS': {
                title: "SELLARDS: THE BIG SANDY LINE",
                content: `<div class="history-section-title">THE SURVIVORS</div><div class="history-entry">The blood of Hezekiah Sellards. This line carries the iron-will of Jenny Wiley and the defenders of the Kentucky frontier.</div>`
            },
            'PERRY': {
                title: "PERRY: BACON'S REBELLION",
                content: `<div class="history-section-title">THE REBELS</div><div class="history-entry">Deep British heritage. From the fires of Bacon's Rebellion to the famous story of the Indian-adopted boy that merged bloodlines in the colonial woods.</div>`
            },
            'CLAY': {
                title: "CLAY: THE STATESMEN",
                content: `<div class="history-section-title">ALDEN CLAY & THE FRONTIER</div><div class="history-entry">The story of Alden Clay and his vital role in the Jenny Wiley saga. From Yorkshire estates to the Great Compromiser Henry Clay.</div>`
            },
            'WILLIAMSON': {
                title: "WILLIAMSON: THE PIONEER SCROLL",
                content: `<div class="history-section-title">VIRGINIA ROOTS</div><div class="history-entry">The Williamson family provided the scouts and land-holders that carved the path from Virginia into the heart of the Ohio Territory.</div>`
            }
        };

        function updateCounter() {
            let count = localStorage.getItem('visitorCount') || 15248;
            count = parseInt(count) + 1;
            localStorage.setItem('visitorCount', count);
            document.getElementById('v-count').innerText = count.toLocaleString();
        }
        window.onload = updateCounter;

        function enterArchive() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 1000);
        }

        function openArchive(key) {
            const data = familyData[key];
            if (data) {
                document.getElementById('v-title').innerText = data.title;
                document.getElementById('v-body').innerHTML = data.content;
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }
    </script>
</body>
</html>
