<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CHANEY ANCESTRY ARCHIVE</title>
    <style>
        body { 
            background-color: #050505; 
            color: #e0c097; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
        }
        
        .heritage-banner {
            width: 100%;
            height: 600px;
            background: linear-gradient(rgba(5,5,5,0.4), rgba(5,5,5,1)), url('1000043712.jpg'); 
            background-size: cover;
            background-position: center 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 8px; font-size: 3.5em; margin: 0; text-shadow: 3px 3px 15px #000; }
        .tagline { color: #fff; font-style: italic; margin-top: 15px; letter-spacing: 3px; font-size: 1.3em; text-shadow: 2px 2px 10px #000; }

        .search-container { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: rgba(10,10,10,0.98); 
            padding: 30px 0; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            backdrop-filter: blur(10px); 
        }
        
        input { 
            padding: 20px 30px; 
            width: 500px; 
            background: #000; 
            border: 1px solid #555; 
            color: #fff; 
            border-radius: 5px; 
            font-size: 1.2em; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        
        button { 
            padding: 20px 40px; 
            background: #d4af37; 
            color: #000; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 1.1em; 
            text-transform: uppercase; 
            transition: 0.3s; 
        }
        button:hover { background: #fff; box-shadow: 0 0 25px #d4af37; }

        #output-area { width: 95%; max-width: 1200px; margin: 50px auto; text-align: left; }
        
        /* Main Record Node */
        .tree-node { background: #111; border-left: 12px solid #d4af37; padding: 40px; margin-bottom: 40px; border-radius: 0 10px 10px 0; box-shadow: 10px 10px 40px rgba(0,0,0,0.9); }
        .name-banner { font-size: 2.6em; color: #fff; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .story-box { color: #ccc; font-size: 1.4em; line-height: 1.9; white-space: pre-wrap; }
        .story-box strong { color: #d4af37; font-size: 1.1em; }

        /* Kinship Engine / Relatives Section */
        .kinship-network { margin-top: 35px; padding-top: 25px; border-top: 2px dashed #d4af37; }
        .kinship-title { color: #d4af37; font-size: 1.4em; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; }
        .kinship-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .kin-node { background: #1a1a1a; border-left: 6px solid #888; padding: 25px; border-radius: 5px; box-shadow: 3px 3px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .kin-node:hover { border-color: #d4af37; }
        .kin-name { font-size: 1.6em; color: #fff; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; }
        .kin-story { font-size: 1.1em; color: #bbb; line-height: 1.7; white-space: pre-wrap; }
        .kin-story strong { color: #d4af37; }

        /* Mobile Adjustments for Grid */
        @media (max-width: 800px) {
            .kinship-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="heritage-banner">
        <h1>THE CHANEY ARCHIVE</h1>
        <div class="tagline">Chaney • Vance • Perry • Clay • Watts • Dyer • Davis</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search a Name (e.g., Erma Perry)...">
        <button onclick="searchVault()">Search Tree</button>
    </div>

    <div id="output-area">
        <p style="text-align: center; font-size: 1.5em; font-style: italic; color: #888; margin-top: 50px;">
            Search an ancestor to view their records and connected family network.
        </p>
    </div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;
            
            output.innerHTML = "<p style='color:#d4af37; font-size:2em; text-align:center;'>Mapping Family Connections...</p>";
            
            try {
                // The ?v= forces the browser to get the newest file, fixing the "No records found" glitch
                const response = await fetch('Gedcom.txt?v=' + new Date().getTime());
                const text = await response.text();
                const rawItems = text.split('0 @').filter(item => item.trim().length > 0);
                
                // Parse all items into a smart list
                const database = rawItems.map(item => {
                    const nameMatch = item.match(/1 NAME (.*)/);
                    const cleanName = nameMatch ? nameMatch[1].replace(/\//g, '').trim() : "Unknown Record";
                    let notes = [...item.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                    return { name: cleanName, rawText: item, rawLower: item.toLowerCase(), notes: notes };
                });

                let foundHtml = "";
                const searchTerms = query.split(' ').filter(term => term.length > 0);

                // 1. Find the Main Search Targets
                let primaryMatches = database.filter(record => {
                    return searchTerms.every(term => record.rawLower.includes(term));
                });

                if (primaryMatches.length === 0) {
                    output.innerHTML = `<p style='font-size:1.8em; text-align:center;'>No records found for "${query}". Ensure Gedcom.txt is updated.</p>`;
                    return;
                }

                // 2. Build the output with Kinship Connections
                primaryMatches.forEach(mainRecord => {
                    
                    // Find Relatives: Anyone mentioned in this record, OR anyone who mentions this record
                    let relatives = database.filter(otherRecord => {
                        if (otherRecord.name === mainRecord.name) return false; // Skip self
                        
                        const mainMentionsOther = mainRecord.rawText.includes(otherRecord.name);
                        const otherMentionsMain = otherRecord.rawText.includes(mainRecord.name);
                        
                        return mainMentionsOther || otherMentionsMain;
                    });

                    // Format the bold text tags
                    const highlightRegex = /(SUBJECT:|FATHER:|MOTHER:|THE NAVIGATOR:|PATERNAL GRANDFATHER:|PATERNAL GRANDMOTHER:|MATERNAL GRANDFATHER:|MATERNAL GRANDMOTHER:|GREAT-GRANDFATHER:|GREAT-GRANDMOTHER:|GREAT-GRANDPARENT FIGURE:|GREAT-GRANDMOTHER FIGURE:|FAMILY:|HISTORY:|YORKSHIRE LINEAGE:|THE WEAVER:|DOCUMENTATION:|MILITARY RECORDS:)/g;
                    
                    let mainNotesHtml = mainRecord.notes.replace(highlightRegex, "<strong>$1</strong>");

                    // Build Main Node
                    foundHtml += `<div class="tree-node">
                                    <div class="name-banner">${mainRecord.name}</div>
                                    <div class="story-box">${mainNotesHtml}</div>`;
                    
                    // Build Relatives Grid if connections exist
                    if (relatives.length > 0) {
                        foundHtml += `<div class="kinship-network">
                                        <div class="kinship-title">Connected Family Records</div>
                                        <div class="kinship-grid">`;
                        
                        relatives.forEach(rel => {
                            let relNotesHtml = rel.notes.replace(highlightRegex, "<strong>$1</strong>");
                            foundHtml += `<div class="kin-node">
                                            <div class="kin-name">${rel.name}</div>
                                            <div class="kin-story">${relNotesHtml}</div>
                                          </div>`;
                        });
                        
                        foundHtml += `</div></div>`; // Close Grid and Network
                    }

                    foundHtml += `</div>`; // Close Main Node
                });
                
                output.innerHTML = foundHtml;
                
            } catch (err) { 
                output.innerHTML = "<p style='text-align:center; font-size:1.5em; color:red;'>Error connecting to Gedcom.txt. Ensure files are saved together on GitHub.</p>"; 
            }
        }
    </script>
</body>
</html>
