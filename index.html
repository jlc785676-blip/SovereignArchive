<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinLink: Sovereign Archive</title>
    <style>
        body { background-color: #121212; color: #e0c097; font-family: 'Georgia', serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #d4af37; padding: 30px; display: inline-block; background: #1c1c1c; border-radius: 8px; max-width: 95%; }
        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 2px; font-size: 1.4em; }
        input { padding: 12px; width: 85%; background: #333; border: 1px solid #d4af37; color: white; margin-bottom: 10px; border-radius: 4px; }
        button { padding: 12px 24px; background: #d4af37; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; width: 90%; }
        .hidden { display: none; }
        .info { text-align: left; margin-top: 20px; font-size: 0.9em; border-left: 2px solid #d4af37; padding-left: 10px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="gate" class="box">
        <h1>Sovereign Heritage</h1>
        <p><i>"The truth shall set you free."</i></p>
        <input type="text" id="code" placeholder="Enter Heritage Code">
        <br>
        <button onclick="unlock()">Unlock Records</button>
    </div>

    <div id="content" class="hidden box">
        <h1>Access Granted</h1>
        <div class="info">
            <strong>The Perry Lineage:</strong> Frontier Alliances (1700s) verified.<br>
            <strong>The Vance Lineage:</strong> Migration path archived.<br>
            <strong>Legacy:</strong> Mary Wiley's legacy documented.
        </div>
        <p>Current Status: <b>Secure</b></p>
    </div>

    <script>
        function unlock() {
            const val = document.getElementById('code').value.toUpperCase();
            if(val === "FAMILY1978") {
                document.getElementById('gate').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } else {
                alert("Incorrect Code.");
            }
        }
    </script>
</body>
</html>
