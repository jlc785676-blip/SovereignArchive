<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive: The Tree of Life</title>
    <style>
        /* Immersive Background & 70s Soft Tones */
        body { 
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.8)), 
                        url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80'); /* Representative Tree of Life Background */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #d4af37;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Cinematic Header */
        .header-section { 
            text-align: center; 
            padding: 100px 20px; 
            width: 100%; 
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #d4af37;
            backdrop-filter: blur(5px);
        }
        h1 { font-size: 3.5em; letter-spacing: 12px; text-transform: uppercase; margin: 0; text-shadow: 3px 3px 10px #000; }
        .tagline { font-size: 1.2em; color: #aaa; font-style: italic; margin-top: 20px; letter-spacing: 4px; }

        /* Widescreen Search Area */
        .search-container { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            width: 100%; 
            background: rgba(5, 5, 5, 0.9); 
            padding: 30px 0; 
            border-bottom: 1px solid #d4af37; 
            display: flex; 
            justify-content: center; 
            gap: 20px;
            backdrop-filter: blur(10px);
        }
        input { 
            padding: 20px 30px; 
            width: 600px; /* Wider search bar */
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 5px; 
            font-size: 1.3em; 
            outline: none; 
            transition: 0.3s;
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        button { 
            padding: 20px 50px; 
            background: #d4af37; 
            color: #000; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            border-radius: 5px; 
            font-size: 1.1em;
            transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 25px #d4af37; }

        /* Expanded Information Display */
        #output { 
            width: 95%; 
            max-width: 1400px; /* Significant expansion for data display */
            padding: 60px 0; 
        }

        .heritage-node { 
            background: rgba(15, 15, 15, 0.9); 
            border-left: 10px solid #d4af37; 
            padding: 50px; 
            margin-bottom: 40px; 
            border-radius: 0 15px 15px 0; 
            box-shadow: 20px 20px 50px rgba(0,0,0,0.8);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .name-banner { font-size: 2.5em; color: #fff; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; }
        .story-content { 
            color: #ccc; 
            font-size: 1.4em; 
            line-height: 2.0; 
            border-top: 1px solid #333; 
            margin-top: 30px; 
            padding-top: 25px; 
            font-style: italic; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div class="tagline">The Unified Heritage of the Chaney, Perry, Vance, & Clay Bloodlines</div>
    </div>

    <div class="search-container">
        <input type="text" id="nameIn" placeholder="Search Ancestors, History, or 'Jenny Wiley'...">
        <button onclick="smartSearch()">Unlock the Ledger</button>
    </div>

    <div id="output"></div>

    <script>
        async function smartSearch() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center; color:#d4af37; font-size:1.8em;'>Consulting the Master Records...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let html = "";
                let count = 0;

                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        count++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Historical Context";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        html += `<div class="heritage-node">
                                    <div class="name-banner">${name}</div>
                                    <div class="story-content">${notes}</div>
                                 </div>`;
                    }
                });

                output.innerHTML = count > 0 ? html : `<p style='text-align:center; font-size:1.5em;'>No record found for "${query}".</p>`;
            } catch (err) { output.innerHTML = "Error: System cannot reach Gedcom.txt."; }
        }
    </script>
</body>
</html>
