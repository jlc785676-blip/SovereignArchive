<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 35px; background: #111; width: 95%; max-width: 650px; text-align: center; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); border-radius: 12px; }
        h1 { letter-spacing: 5px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 15px; margin-bottom: 25px; }
        .search-area { margin-bottom: 30px; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1.1em; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 15px 30px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
        
        #output { text-align: left; background: #050505; padding: 25px; border-left: 5px solid #d4af37; border-radius: 4px; display: none; }
        .report-header { font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .data-line { margin-bottom: 12px; line-height: 1.6; color: #ccc; }
        .data-line b { color: #fff; }
        .raw-snippet { margin-top: 20px; font-family: monospace; font-size: 0.75em; color: #444; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>Sovereign Archive</h1>
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Enter Ancestor Name">
            <button onclick="translateGedcom()">Query</button>
        </div>

        <div id="output">
            <div class="report-header">Heritage Record Unlocked</div>
            <div id="dataContent"></div>
            <div class="raw-snippet" id="rawPreview"></div>
        </div>
    </div>

    <script>
        async function translateGedcom() {
            const searchName = document.getElementById('nameIn').value.trim();
            const output = document.getElementById('output');
            const content = document.getElementById('dataContent');
            const raw = document.getElementById('rawPreview');

            if (!searchName) return;
            output.style.display = 'block';
            content.innerHTML = "Accessing vaults...";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const lines = text.split('\n');
                
                let foundIndex = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].toLowerCase().includes(searchName.toLowerCase())) {
                        foundIndex = i;
                        break;
                    }
                }

                if (foundIndex !== -1) {
                    // Grab 30 lines for context
                    const start = Math.max(0, foundIndex - 30);
                    const snippetLines = lines.slice(start, foundIndex + 1);
                    
                    // Filter the 30 lines for readable info
                    let readableData = "";
                    snippetLines.forEach(line => {
                        if (line.includes('1 NAME')) readableData += `<b>Relative:</b> ${line.split('1 NAME ')[1].replace(/\//g, '')}<br>`;
                        if (line.includes('2 DATE')) readableData += `<b>Vital Date:</b> ${line.split('2 DATE ')[1]}<br>`;
                        if (line.includes('2 PLAC')) readableData += `<b>Location:</b> ${line.split('2 PLAC ')[1]}<br>`;
                    });

                    content.innerHTML = readableData || "Name found, but specific dates/locations are further up in the file.";
                    raw.innerHTML = "<i>Showing last 30 lines of source data context for trace verification.</i>";
                } else {
                    content.innerHTML = "No record found for '" + searchName + "' in the Gedcom.txt file.";
                    raw.innerHTML = "";
                }
            } catch (err) {
                content.innerHTML = "System Error: Ensure Gedcom.txt is uploaded to the same folder on GitHub.";
            }
        }
    </script>
</body>
</html>
