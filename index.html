<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BLOODLINE ARCHIVE</title>
    <style>
        body { background-color: #050505; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 0; text-align: center; }
        
        .heritage-banner {
            width: 100%; height: 500px;
            background: linear-gradient(rgba(5,5,5,0.4), rgba(5,5,5,1)), url('1000043712.jpg'); 
            background-size: cover; background-position: center 20%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 8px; font-size: 3.5em; margin: 0; text-shadow: 3px 3px 15px #000; }
        .tagline { color: #fff; font-style: italic; margin-top: 15px; letter-spacing: 3px; font-size: 1.3em; text-shadow: 2px 2px 10px #000; max-width: 90%; line-height: 1.6; }

        .search-container { position: sticky; top: 0; z-index: 1000; background: rgba(10,10,10,0.98); padding: 30px 0; border-bottom: 1px solid #333; display: flex; justify-content: center; gap: 15px; backdrop-filter: blur(10px); }
        input { padding: 18px 30px; width: 500px; background: #000; border: 1px solid #555; color: #fff; border-radius: 5px; font-size: 1.2em; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 18px 40px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.1em; text-transform: uppercase; }

        #output-area { width: 95%; max-width: 1200px; margin: 50px auto; text-align: left; }
        
        /* Main Record Box */
        .tree-node { background: #111; border-left: 12px solid #d4af37; padding: 40px; margin-bottom: 20px; border-radius: 0 10px 10px 0; box-shadow: 10px 10px 40px rgba(0,0,0,0.9); }
        .name-banner { font-size: 2.6em; color: #fff; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .story-box { color: #ccc; font-size: 1.4em; line-height: 1.9; white-space: pre-wrap; }
        .story-box strong { color: #d4af37; font-size: 1.1em; }

        /* Ancestors Section */
        .ancestor-section { margin-top: 40px; padding-top: 30px; border-top: 3px solid #333; }
        .ancestor-title { color: #d4af37; font-size: 1.8em; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; text-align: center; }
        .ancestor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .anc-node { background: #1a1a1a; border-left: 6px solid #888; padding: 25px; border-radius: 5px; box-shadow: 3px 3px 15px rgba(0,0,0,0.5); }
        .anc-name { font-size: 1.6em; color: #fff; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; }
        .anc-story { font-size: 1.1em; color: #bbb; line-height: 1.7; white-space: pre-wrap; }
        .anc-story strong { color: #d4af37; }

        @media (max-width: 800px) { .ancestor-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="heritage-banner">
        <h1>THE BLOODLINE ARCHIVE</h1>
        <div class="tagline">Chaney • Perry • Vance • Dyer • Watts • Davis • Clay • Williamson • Adkins</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search a Name (e.g., Alisa, Oshel, Erma)...">
        <button onclick="searchVault()">Trace Bloodline</button>
    </div>

    <div id="output-area">
        <p style="text-align: center; font-size: 1.5em; font-style: italic; color: #888; margin-top: 50px;">
            Enter a family name to trace their direct ancestors.
        </p>
    </div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;
            
            output.innerHTML = "<p style='color:#d4af37; font-size:2em; text-align:center;'>Tracing the Bloodline...</p>";
            
            try {
                const response = await fetch('Gedcom.txt?v=' + new Date().getTime());
                const text = await response.text();
                const rawItems = text.split('0 @').filter(item => item.trim().length > 0);
                
                // Parse DB
                const database = rawItems.map(item => {
                    const nameMatch = item.match(/1 NAME (.*)/);
                    const cleanName = nameMatch ? nameMatch[1].replace(/\//g, '').trim() : "Unknown Record";
                    let notes = [...item.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                    return { name: cleanName, rawText: item, rawLower: item.toLowerCase(), notes: notes };
                });

                const searchTerms = query.split(' ').filter(term => term.length > 0);

                // Find the Person Searched For
                let primaryMatches = database.filter(record => {
                    return searchTerms.every(term => record.rawLower.includes(term));
                });

                if (primaryMatches.length === 0) {
                    output.innerHTML = `<p style='font-size:1.8em; text-align:center;'>No records found for "${query}".</p>`;
                    return;
                }

                let foundHtml = "";
                const highlightRegex = /(GENERATION 1 \(SUBJECT\):|GENERATION 1 \(SISTER\):|GENERATION 2 \(FATHER\):|GENERATION 2 \(MOTHER\):|GENERATION 3 \(PATERNAL GRANDFATHER\):|GENERATION 3 \(PATERNAL GRANDMOTHER\):|GENERATION 3 \(MATERNAL GRANDFATHER\):|GENERATION 3 \(MATERNAL GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDFATHER\):|GENERATION 4 \(GREAT-GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDPARENT FIGURE\):|GENERATION 4 \(GREAT-GRANDMOTHER FIGURE\):|FAMILY:|PARENTS:|HISTORY:|YORKSHIRE LINEAGE:|THE WEAVER:|DOCUMENTATION:|MILITARY RECORDS:)/g;

                primaryMatches.forEach(mainRecord => {
                    let mainNotesHtml = mainRecord.notes.replace(highlightRegex, "<strong>$1</strong>");
                    
                    // Display Main Person
                    foundHtml += `<div class="tree-node">
                                    <div class="name-banner">${mainRecord.name}</div>
                                    <div class="story-box">${mainNotesHtml}</div>
                                  </div>`;
                    
                    // RECURSIVE ANCESTOR TRACE
                    let ancestors = new Set();
                    let queue = [mainRecord];

                    while(queue.length > 0) {
                        let current = queue.shift();
                        // Look for "PARENTS: [Names]"
                        let parentMatch = current.notes.match(/PARENTS:\s*([^\n<]+)/);
                        
                        if (parentMatch) {
                            let parentNames = parentMatch[1].split(',').map(n => n.trim());
                            parentNames.forEach(pName => {
                                // Find parent in DB
                                let pRecord = database.find(r => r.name === pName);
                                if (pRecord && !ancestors.has(pRecord)) {
                                    ancestors.add(pRecord);
                                    queue.push(pRecord); // Queue the parent to find the grandparents
                                }
                            });
                        }
                    }

                    // Display the Ancestors Below the Main Person
                    if (ancestors.size > 0) {
                        foundHtml += `<div class="ancestor-section">
                                        <div class="ancestor-title">Ancestors of ${mainRecord.name}</div>
                                        <div class="ancestor-grid">`;
                        
                        ancestors.forEach(anc => {
                            let ancNotesHtml = anc.notes.replace(highlightRegex, "<strong>$1</strong>");
                            foundHtml += `<div class="anc-node">
                                            <div class="anc-name">${anc.name}</div>
                                            <div class="anc-story">${ancNotesHtml}</div>
                                          </div>`;
                        });
                        
                        foundHtml += `</div></div>`;
                    }
                });
                
                output.innerHTML = foundHtml;
                
            } catch (err) { 
                output.innerHTML = "<p style='text-align:center; font-size:1.5em; color:red;'>Error connecting to Gedcom.txt.</p>"; 
            }
        }
    </script>
</body>
</html>
