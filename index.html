<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color: #050505; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 0; overflow-x: hidden; font-size: 13px; }
        .header-fixed { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(10,10,10,0.98); border-bottom: 2px solid #d4af37; padding: 8px 0; }
        .search-container { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        input { padding: 8px; width: 88%; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .main-btn { padding: 8px; width: 92%; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .indian-btn { background: #8b0000; color: #fff; border: 1px solid #ff4500; }
        #content-wrapper { margin-top: 175px; margin-bottom: 150px; padding: 10px; }
        .tree-node { background: #111; border-left: 5px solid #d4af37; padding: 15px; margin-bottom: 15px; text-align: left; }
        .name-banner { font-size: 1.1em; color: #fff; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #333; margin-bottom: 8px; }
        .footer-fixed { position: fixed; bottom: 0; width: 100%; z-index: 2000; background: #1a1a1a; border-top: 2px solid #d4af37; padding: 10px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .nav-btn { background: #222; color: #d4af37; border: 1px solid #d4af37; padding: 8px 12px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; }
        #vault-overlay { display:none; position: fixed; top: 5%; left: 5%; width: 90%; height: 85%; background: #0c0c0c; border: 2px solid #d4af37; z-index: 3000; overflow-y: auto; padding: 15px; }
    </style>
</head>
<body>
    <div class="header-fixed">
        <div class="search-container">
            <input type="text" id="nameSearch" placeholder="Search Names (Cheney, Rollo, William)...">
            <button class="main-btn" onclick="executeSearch('name')">Trace Bloodline</button>
            <input type="text" id="indianSearch" placeholder="Search Indian History/Keywords...">
            <button class="main-btn indian-btn" onclick="executeSearch('indian')">Explore Heritage</button>
        </div>
    </div>

    <div id="content-wrapper"><div id="output-area"></div></div>

    <div id="vault-overlay"><h2 id="v-title" style="color:#d4af37; text-align:center;"></h2><div id="v-body"></div><button onclick="document.getElementById('vault-overlay').style.display='none'" style="width:100%; margin-top:20px; background:#d4af37; padding:15px; border:none; font-weight:bold;">CLOSE VAULT</button></div>

    <div class="footer-fixed">
        <button class="nav-btn" onclick="openMaster('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="openMaster('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="openMaster('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="openMaster('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="openMaster('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="openMaster('WILLIAMSON')">WILLIAMSON</button>
    </div>

    <audio id="mohicansPlayer" loop><source src="The Last of the Mohicans - Promontory (Main Theme).mp3" type="audio/mpeg"></audio>

    <script>
        let db = [];
        async function init() {
            const res = await fetch('Gedcom.txt?v=' + new Date().getTime());
            const data = await res.text();
            const items = data.split('0 @').filter(i => i.trim().length > 0);
            db = items.map(i => {
                const n = i.match(/1 NAME (.*)/);
                const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
            });
        }

        function format(t) {
            let f = t.replace(/IMAGE_REF: (.*?)\n/g, "<img src='$1' style='width:100%; border: 1px solid #d4af37; margin: 15px 0; border-radius: 5px;'>");
            f = f.replace(/(INDIAN HISTORY:.*?)(?=\n|$)/g, "<div style='background:rgba(139,0,0,0.2); border-left:3px solid #ff4500; padding:10px; margin:10px 0;'>$1</div>");
            return f.replace(/(SECTION.*?|GENERATION.*?|HISTORY:|MOTTO:|I\.|II\.|III\.|IV\.|V\.|VI\.|Viking|Conqueror|Rollo|Ragnar)/g, "<strong>$1</strong>");
        }

        function openMaster(s) {
            const r = db.find(i => i.raw.includes("hist_" + s.toLowerCase() + "_full"));
            if (r) {
                document.getElementById('v-title').innerText = s + " MASTER RECORD";
                document.getElementById('v-body').innerHTML = format(r.notes);
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }

        function executeSearch(m) {
            startMusic();
            const q = (m === 'name' ? document.getElementById('nameSearch') : document.getElementById('indianSearch')).value.toLowerCase();
            const results = db.filter(r => r.raw.includes(q));
            let h = "";
            results.forEach(r => { h += `<div class="tree-node"><div class="name-banner">${r.name}</div><div class="story-box">${format(r.notes)}</div></div>`; });
            document.getElementById('output-area').innerHTML = h || "<p style='text-align:center;'>Searching...</p>";
        }

        function startMusic() {
            const m = document.getElementById('mohicansPlayer');
            if (m.paused) { m.volume = 0; m.play();
                let vol = 0;
                let fade = setInterval(() => { if (vol < 0.4) { vol += 0.01; m.volume = vol; } else { clearInterval(fade); } }, 400);
            }
        }
        window.onload = init;
        document.addEventListener('click', startMusic, { once: true });
    </script>
</body>
</html>
