<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN HERITAGE ARCHIVE</title>
    <style>
        body { background-color: #0a0a0a; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 0; text-align: center; }
        
        /* Widescreen Banner with Heritage Picture */
        .heritage-banner {
            width: 100%;
            height: 500px;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(10,10,10,1)), 
                        url('https://raw.githubusercontent.com/jlc785676-blip/SovereignArchive/main/heritage_photo.jpg'); /* Ensure your photo is named heritage_photo.jpg in GitHub */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 8px; font-size: 3.2em; margin: 0; text-shadow: 2px 2px 15px #000; }
        .tagline { color: #fff; font-style: italic; margin-top: 15px; letter-spacing: 3px; font-size: 1.2em; text-shadow: 1px 1px 5px #000; }

        .search-container { position: sticky; top: 0; z-index: 1000; background: rgba(10,10,10,0.95); padding: 30px 0; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 15px; backdrop-filter: blur(10px); }
        input { padding: 18px 30px; width: 550px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 1.2em; outline: none; transition: 0.3s; }
        button { padding: 18px 45px; background: #d4af37; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.1em; text-transform: uppercase; }

        #output-area { width: 95%; max-width: 1500px; margin: 40px auto; text-align: left; }
        .tree-node { background: #151515; border-left: 12px solid #d4af37; padding: 45px; margin-bottom: 35px; border-radius: 0 15px 15px 0; box-shadow: 15px 15px 45px rgba(0,0,0,0.8); }
        .name-banner { font-size: 2.2em; color: #fff; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .story-box { color: #ccc; font-size: 1.4em; line-height: 2.0; margin-top: 25px; border-top: 1px solid #333; padding-top: 25px; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="heritage-banner">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div class="tagline">The Tree of Life: Chaney • Perry • Vance • Wiley</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search First or Last Names...">
        <button onclick="searchVault()">Unlock History</button>
    </div>

    <div id="output-area"></div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;
            output.innerHTML = "<p style='color:#d4af37; font-size:1.8em;'>Consulting the Master Bloodlines...</p>";
            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const items = text.split('0 @');
                let foundHtml = "";
                items.forEach(item => {
                    if (item.toLowerCase().includes(query)) {
                        const name = item.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Ancestor Record";
                        const notes = [...item.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        foundHtml += `<div class="tree-node"><div class="name-banner">${name}</div><div class="story-box">${notes}</div></div>`;
                    }
                });
                output.innerHTML = foundHtml || `<p style='font-size:1.5em;'>No records found for "${query}".</p>`;
            } catch (err) { output.innerHTML = "Error loading Gedcom.txt."; }
        }
    </script>
</body>
</html>
