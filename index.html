<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER LIBRARY</title>
    
    <style>
        /* CORE THEME - DARK WOOD & GOLD */
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; width: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* DUAL-MODE SPLASH GATE */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            z-index: 9999999999; background-color: #050505; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        .splash-image { 
            width: 100%; max-width: 400px; height: auto; max-height: 25vh; 
            object-fit: contain; border: 2px solid #d4af37; box-shadow: 0 0 30px #000; margin-bottom: 15px;
        }
        .splash-text { color: #e0c097; padding: 0 10px 15px 10px; font-size: 0.95em; max-width: 500px; line-height: 1.3; font-style: italic; font-weight: bold; }
        
        /* LEDGER REGISTRY FIELDS */
        .registry-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 8px; }
        .reg-group { border: 1px solid #d4af37; padding: 10px; border-radius: 5px; background: rgba(20,0,0,0.5); margin-bottom: 5px; }
        .group-label { font-size: 0.8em; text-transform: uppercase; color: #ff0000; margin-bottom: 5px; display: block; font-weight: bold; }
        
        .reg-field {
            padding: 10px; width: 100%; background: #000; color: #fff; 
            border: 1px solid #444; border-radius: 3px; font-size: 0.9em; text-align: center; 
            box-sizing: border-box; outline: none;
        }
        .reg-field:focus { border-color: #d4af37; }

        .gate-btn { 
            padding: 15px 0; width: 100%; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); 
            color: #ffffff; border: 2px solid #d4af37; font-weight: 900; border-radius: 8px; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em; 
            box-shadow: 0 0 20px #ff0000; margin-top: 10px;
        }

        /* MAIN ARCHIVE INTERFACE */
        #main-ui { display:none; text-align: center; max-width: 850px; margin: 0 auto; padding: 15px; overflow-y: auto; height: 100vh; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; font-size: 1.8em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        
        .search-zone { width: 100%; max-width: 550px; padding: 20px; background: rgba(20, 20, 20, 0.9); border: 2px solid #d4af37; border-radius: 12px; margin: 0 auto 30px auto; }
        input[type="text"].main-search { padding: 15px; width: 100%; background: #000; color: #fff; border: 2px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; box-sizing: border-box; }
        .red-btn { padding: 15px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1em; margin-top: 10px; }
        
        /* VISITOR LOG */
        .log-container { background: rgba(0,0,0,0.9); border: 2px solid #d4af37; margin-top: 60px; padding: 20px; border-radius: 10px; color: #fff; text-align: left; }
        .log-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85em; }
        .log-table th, .log-table td { border: 1px solid #444; padding: 10px; }
        .log-table th { background: #1a0101; color: #d4af37; text-transform: uppercase; }

        /* ENCYCLOPEDIA PAGE */
        #encyclopedia-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000000000; overflow-y:auto; padding: 15px; box-sizing: border-box;}
        .encyclopedia-page { background:#fff; color:#000; max-width: 900px; margin: 20px auto; padding: 40px; border: 8px double #d4af37; border-radius: 5px; text-align: left; }
        .page-title { font-size: 2.2em; border-bottom: 4px solid #a00000; margin-bottom: 20px; color: #a00000; text-transform: uppercase; font-weight: 900; }
        .history-block { font-size: 1.15em; line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; font-family: 'Times New Roman', serif; text-align: justify; }

        .archive-item { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 35px; }
        .family-thumb { width: 100%; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="movie_splash2.png" class="splash-image" alt="Bloodline Saga Gate">
        <div class="splash-text">Follow along with the saga of an amazing adventure and save, follow the bloodline.</div>
        
        <div id="registration-form" class="registry-container">
            <div class="reg-group">
                <span class="group-label">Your Identity</span>
                <input type="text" id="regFirst" class="reg-field" placeholder="FIRST NAME">
                <input type="text" id="regLast" class="reg-field" placeholder="LAST NAME">
                <input type="text" id="regBirth" class="reg-field" placeholder="BIRTH DATE (MM/DD/YYYY)">

                <input type="text" id="fDeath" class="reg-field" placeholder="DEATH DATE (OR 'LIVING')">
            </div>

            <div class="reg-group">

                <input type="text" id="mDeath" class="reg-field" placeholder="DEATH DATE (OR 'LIVING')">
            </div>
        </div>

        <div id="login-form" class="registry-container" style="display:none;">
            <p style="color:#d4af37; margin-bottom: 10px;">Welcome Back, Fellow Traveler.</p>
        </div>

        <input type="password" id="gateKey" class="reg-field" style="max-width:350px; margin-top: 10px;" placeholder="FELLOWSHIP PASSWORD">
        <button class="gate-btn" onclick="processEntrance()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE MASTER CHRONICLE LIBRARY</h1></div>
        
        <div class="search-zone">
            <input type="text" id="libSearch" class="main-search" placeholder="SEARCH ALL RECORDS & NAMES...">
            <button class="red-btn" onclick="runDeepSearch()">CONSULT THE ENCYCLOPEDIA</button>
        </div>
