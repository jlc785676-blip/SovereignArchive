<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMA PERRY ANCESTORS</title> 
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 30px; background: #111; width: 95%; max-width: 850px; text-align: center; box-shadow: 0 0 60px rgba(212, 175, 55, 0.25); border-radius: 12px; }
        h1 { letter-spacing: 4px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 15px; margin-bottom: 10px; font-size: 1.8em; }
        .subtitle { color: #888; font-style: italic; font-size: 0.9em; margin-bottom: 30px; }
        .search-area { margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; }
        input { padding: 15px; width: 65%; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1.1em; outline: none; }
        button { padding: 15px 30px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
        #output { text-align: left; max-height: 750px; overflow-y: auto; padding-right: 15px; }
        
        /* The Story Card Style */
        .story-card { background: #1a1a1a; border: 1px solid #d4af37; padding: 25px; margin-bottom: 20px; border-radius: 8px; position: relative; overflow: hidden; }
        .story-card::before { content: "HERITAGE STORY"; position: absolute; top: 10px; right: 15px; font-size: 0.6em; color: #d4af37; opacity: 0.5; letter-spacing: 2px; }
        .person-name { color: #fff; font-size: 1.4em; font-weight: bold; display: block; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .story-text { color: #ccc; font-size: 1.05em; line-height: 1.7; font-style: italic; }
        
        .ancestor-card { background: #161616; border-left: 3px solid #333; padding: 15px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>ERMA PERRY ANCESTORS</h1> 
        <div class="subtitle">Preserving the Bloodline & Frontier Legacy</div>
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Search Names, Tribes, or History...">
            <button onclick="traceLineage()">Trace Vault</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        async function traceLineage() {
            const searchName = document.getElementById('nameIn').value.trim();
            const output = document.getElementById('output');
            if (!searchName) return;
            output.innerHTML = "<p style='text-align:center;'>Consulting the Elders' Records...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                
                let results = "";
                records.forEach(record => {
                    if (record.toLowerCase().includes(searchName.toLowerCase())) {
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Heritage Entry";
                        const notes = [...record.matchAll(/2 NOTE (.*)/g)].map(m => m[1]).join(' ');
                        
                        // If it contains Indian/Tribal keywords, use the Story Card style
                        if (record.toLowerCase().match(/indian|shawnee|tribe|cherokee|cornstalk|toral|allian/)) {
                            results += `<div class="story-card">
                                            <span class="person-name">${name}</span>
                                            <div class="story-text">${notes}</div>
                                        </div>`;
                        } else {
                            results += `<div class="ancestor-card">
                                            <span class="person-name" style="font-size:1.1em;">${name}</span>
                                            <div style="color:#888; font-size:0.9em;">${notes}</div>
                                        </div>`;
                        }
                    }
                });

                output.innerHTML = results || "<p style='text-align:center;'>The vault is silent on that name. Try 'Indian' or 'Vance'.</p>";
            } catch (err) { output.innerHTML = "Access Denied: Gedcom.txt not found."; }
        }
    </script>
</body>
</html>
