<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        .header-fixed { position:sticky; top:0; width:100%; z-index:2000; background:#1a0f00; border-bottom:3px solid #3e2723; padding:10px 0; }
        .wood-btn { padding:14px; width:92%; background:linear-gradient(rgba(255,255,255,0.15), rgba(0,0,0,0.5)), url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #5d4037; color:#fbe9e7; border:2px solid #211510; font-weight:bold; border-radius:8px; box-shadow:0 6px 0 #211510; text-shadow:1px 1px 2px #000; transition:all 0.1s; margin-bottom:8px; }
        .wood-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #211510; }
        .music-btn { background:linear-gradient(145deg, #2e7d32, #1b5e20); color:#fff; border:2px solid #0a2f0c; }
        
        #main-display { margin:40px 15px 180px 15px; text-align: center; }
        .archive-seal { font-size: 2em; border: 2px solid #d4af37; padding: 20px; display: inline-block; border-radius: 50%; margin-bottom: 20px; }
        
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,5,0.99); z-index:3000; overflow-y:auto; padding:10px; box-sizing:border-box; }
        .vault-content { max-width:95%; margin:15px auto; background:#111; border:3px solid #d4af37; padding:20px; border-radius:8px; }
        
        .footer-fixed { position:fixed; bottom:0; width:100%; z-index:2000; background:#1a0f00; border-top:3px solid #3e2723; padding:8px 0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
        .nav-btn { background:linear-gradient(145deg, #5d4037, #3e2723); color:#d4af37; border:1px solid #211510; padding:10px; font-size:10px; font-weight:bold; border-radius:4px; width:30%; }
        
        .history-block { margin-bottom:50px; border-bottom:3px solid #3e2723; padding-bottom:30px; white-space: pre-wrap; line-height:1.8; text-align: left; }
        .ancestor-header { font-size:1.4em; color:#fff; font-weight:bold; border-left:6px solid #d4af37; padding-left:12px; margin-bottom:15px; text-transform:uppercase; }
    </style>
</head>
<body>
    <div class="header-fixed"><center>
        <input type="text" id="nameSearch" style="padding:12px; width:88%; background:#000; color:#fff; border:2px solid #5d4037; border-radius:6px; margin-bottom:8px;" placeholder="Search Surname or Ancestor...">
        <button class="wood-btn" onclick="executeDeepTrace(document.getElementById('nameSearch').value)">EXECUTE DEEP TRACE</button>
    </center></div>

    <div id="main-display">
        <div class="archive-seal">⚔️</div>
        <h1 style="color:#d4af37; letter-spacing: 4px;">THE SOVEREIGN ARCHIVE</h1>
        <p style="font-style: italic; color: #888;">"Blood remembers what the mind forgets."</p>
    </div>

    <div id="vault-overlay"><div class="vault-content">
        <h2 id="v-title" style="color:#d4af37; text-align:center; border-bottom:2px solid #d4af37; padding-bottom:10px; margin-bottom:20px;"></h2>
        <div id="v-body"></div>
        <button class="wood-btn" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
    </div></div>

    <div class="footer-fixed">
        <button id="mBtn" class="wood-btn music-btn" onclick="toggleMusic()" style="width:92%; margin-bottom:5px;">LAST OF THE MOHICANS</button>
        <button class="nav-btn" onclick="executeDeepTrace('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="executeDeepTrace('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="executeDeepTrace('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="executeDeepTrace('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="executeDeepTrace('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="executeDeepTrace('WILEY')">WILEY</button>
    </div>

    <audio id="mohicansPlayer" loop><source src="Mohicans.mp4" type="audio/mp4"></audio>

    <script>
        let db = [];
        const music = document.getElementById('mohicansPlayer');
        const mBtn = document.getElementById('mBtn');

        async function init() {
            try {
                const res = await fetch('Gedcom.txt?v=' + new Date().getTime());
                const data = await res.text();
                db = data.split('0 @').filter(i => i.trim().length > 0).map(i => {
                    const n = i.match(/1 NAME (.*)/);
                    const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                    return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
                });
            } catch(e) { console.log("Load error"); }
        }

        function toggleMusic() { 
            if (music.paused) { music.play(); mBtn.innerText = "MUSIC: PLAYING"; } 
            else { music.pause(); mBtn.innerText = "LAST OF THE MOHICANS"; } 
        }

        function executeDeepTrace(query) {
            if (!query) return;
            const q = query.toLowerCase();
            const results = db.filter(r => r.raw.includes(q));
            let h = "";
            results.forEach(r => {
                // Video player remains, but image logic is removed
                let notes = r.notes.replace(/YOUTUBE_REF: (.*?)(?=\n|$|\r)/g, (m, v) => `<iframe width="100%" height="250" src="https://www.youtube.com/embed/${v.trim()}" frameborder="0" allowfullscreen style="border:2px solid #5d4037; margin:15px 0;"></iframe>`);
                h += `<div class="history-block"><div class="ancestor-header">${r.name}</div><div>${notes}</div></div>`;
            });
            document.getElementById('v-title').innerText = query.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "<p>No records found.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }
        window.onload = init;
    </script>
</body>
</html>
