<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* Splash Screen */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            display:flex; flex-direction:column; justify-content:center; align-items:center; 
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('movie_splash.jpg');
            background-size: cover; background-position: center; transition: opacity 1s ease;
        }

        .wood-btn { 
            padding:15px; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:8px; cursor:pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 2px;
        }

        /* Main Archive UI */
        #main-ui { display:none; text-align: center; padding-top: 20px; }
        
        .header-box { padding: 20px; background: rgba(26, 15, 0, 0.9); border-bottom: 3px solid #3e2723; margin-bottom: 20px; }
        
        /* Music Player Styling */
        .music-control { 
            background: #211510; border: 1px solid #d4af37; padding: 10px; 
            border-radius: 8px; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }

        /* Layout: Buttons around Mary Wiley */
        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; 
            max-width: 1000px; margin: auto; gap: 20px; padding: 20px;
        }
        .side-buttons { display: flex; flex-direction: column; gap: 20px; }
        
        .central-portrait { 
            border: 4px solid #d4af37; border-radius: 10px; width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 400px;
        }

        .v-img { max-width:350px; width: 90%; border:2px solid #d4af37; margin:20px auto; display:block; border-radius: 4px; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#111; border:2px solid #d4af37; padding:35px; border-radius:8px; text-align: left; max-width: 900px; margin: auto; }
        
        input[type="text"] { padding:15px; width:60%; background:#000; color:#fff; border:1px solid #d4af37; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="splash">
        <button class="wood-btn" style="font-size: 2em; padding: 20px 60px;" onclick="enterArchive()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 4px;">THE SOVEREIGN ARCHIVE</h1>
            <p style="color:#888; font-style: italic;">"Amos Keener: Slow Speaking, Heart on Fire"</p>
            <p style="font-size: 14px; color:#e0c097;">Follow along with the saga of an amazing adventure with the bloodline of Erma Perry Keener</p>
            
            <div class="music-control">
                <span style="font-size: 12px; color: #d4af37;">THE LAST OF THE MOHICANS</span>
                <audio id="mohican-audio" src="music_mohicans.mp4" loop></audio>
                <input type="range" min="0" max="1" step="0.1" value="0.5" onchange="document.getElementById('mohican-audio').volume = this.value">
                <button class="wood-btn" style="padding:5px 10px; font-size: 10px;" onclick="toggleMusic()">PLAY/PAUSE</button>
            </div>
            
            <div style="margin-top:10px;">
                <input type="text" id="nameSearch" placeholder="Trace lineage...">
                <button class="wood-btn" style="padding:13px 30px;" onclick="trace()">TRACE</button>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-buttons">
                <button class="wood-btn" onclick="quick('CHANEY')">CHANEY</button>
                <button class="wood-btn" onclick="quick('VANCE')">VANCE</button>
            </div>
            
            <img src="jenny_wiley_portrait.jpg" class="central-portrait" alt="Mary Wiley">
            
            <div class="side-buttons">
                <button class="wood-btn" onclick="quick('PERRY')">PERRY</button>
                <button class="wood-btn" onclick="quick('CLAY')">CLAY</button>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37; border-bottom:1px solid #d4af37; padding-bottom:15px;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 20px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        let db = [];
        const audio = document.getElementById('mohican-audio');

        function toggleMusic() {
            if (audio.paused) audio.play();
            else audio.pause();
        }

        function enterArchive() {
            audio.play().catch(e => console.log("User interaction required for audio."));
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                load();
            }, 1000);
        }

        async function load() {
            const r = await fetch('Gedcom.txt?v=' + Date.now());
            const t = await r.text();
            db = t.split('0 @').filter(x => x.trim()).map(x => {
                const n = x.match(/1 NAME (.*)/);
                const notes = [...x.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: x.toLowerCase(), notes: notes };
            });
        }

        function quick(n) { document.getElementById('nameSearch').value = n; trace(); }

        function trace() {
            const q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = db.filter(x => x.raw.includes(q));
            let h = "";
            res.forEach(x => {
                let d = x.notes.replace(/IMAGE_REF: (.*?)(?=\n|$|\r)/g, (m, f) => `<img src="${f.trim()}" class="v-img">`);
                d = d.replace(/YOUTUBE_REF: (.*?)(?=\n|$|\r)/g, (m, id) => `<iframe width="100%" height="450" src="https://www.youtube.com/embed/${id.trim()}" frameborder="0" allowfullscreen style="margin-top:15px; border: 1px solid #d4af37;"></iframe>`);
                d = d.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#d4af37;">$1</a>');
                h += `<div style="border: 1px solid #d4af37; padding: 25px; background: #0a0a0a; margin-bottom: 25px;"><div style="font-size:1.4em; color:#fff; border-left:5px solid #d4af37; padding-left:15px; margin-bottom:15px;">${x.name}</div><div style="white-space:pre-wrap; line-height: 1.8;">${d}</div></div>`;
            });
            document.getElementById('v-title').innerText = "DEEP TRACE: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "No records found.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
