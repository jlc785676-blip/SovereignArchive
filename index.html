<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* TIGHT SPLASH GATE - ZERO BORDERS */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:10000; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .splash-art-frame { width: 100%; max-width: 1100px; }
        .splash-image { width: 100%; height: auto; display: block; }

        /* EXCITING RED BUTTON */
        .gate-btn { 
            position: absolute; bottom: 80px; 
            padding: 22px 60px; 
            background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);
            color: #ffffff; border: 4px solid #ffffff; 
            font-weight: 900; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 4px; font-size: 1.6em;
            box-shadow: 0 5px 30px #ff0000; text-shadow: 2px 2px #ff0000;
        }

        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px;
            overflow-y: auto; height: 100vh;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        input[type="text"] { 
            padding: 18px; width: 100%; background: #000; color: #fff; 
            border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; 
            box-sizing: border-box;
        }
        .red-btn {
            padding: 15px 40px; background: #ff0000; color: #ffffff; margin-top: 10px;
            border: 2px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        /* VIDEO CONTAINERS */
        .video-panel { 
            width: 100%; background: #111; border: 3px solid #d4af37; 
            padding: 5px; margin: 20px 0; box-shadow: 0 10px 30px #000;
        }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:11000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1000px; margin: 30px auto; color: #e0c097; }
        .history-p { margin-bottom: 25px; line-height: 1.8; font-size: 1.25em; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ERMA, ROLLO, ALDEN, JAMESTOWN...">
                    <button class="red-btn" onclick="trace('main')">SEARCH ANCESTRY REPORT</button>
                </div>

                <div class="video-panel">
                    <div style="color:#ff0000; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">THE STORY OF JENNY WILEY</div>
                    <iframe width="100%" height="350" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="search-group" style="margin-top: 30px;">
                    <div style="border: 3px solid #d4af37; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.7);">
                        <img src="Indians_search.png" style="width:100%; height:auto;">
                    </div>
                    <input type="text" id="indianSearch" placeholder="SEARCH SHAWNEE, CHEROKEE, TREATY...">
                    <button class="red-btn" onclick="trace('indian')">GENERATE INDIGENOUS REPORT</button>
                </div>

                <div class="video-panel" style="border-color:#ff0000;">
                    <div style="color:#ffffff; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">LAST OF THE MOHICANS</div>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <div><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
                <div><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
                <div><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#ff0000; border-bottom: 3px solid #ff0000; padding-bottom: 10px;"></h2>
            <div id="v-body"></div>
            <button class="red-btn" style="width: 100%; margin-top: 20px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-09.mp3');
        function playGateAction() {
            clickSound.play().catch(() => {});
            const splash = document.getElementById('splash');
            const ui = document.getElementById('main-ui');
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; ui.style.display = 'block'; setTimeout(() => { ui.style.opacity = '1'; document.body.style.overflow = 'auto'; }, 50); }, 500);
        }

        const ancestryRecords = [
            { name: "Erma Perry", info: "Matriarch of the Florida branch. Daughter of the Perry line; central navigator of the family's migration legacy. Mother to Joshua Lee Chaney. Her ancestry connects directly to the Isle of Wight colonial settlers and the 1700s Tug River pioneers." },
            { name: "Joshua Lee Chaney", info: "Born 1978. Technical Lead. Architect of the Sovereign Archive. Son of Erma Perry & Oshel Chaney. Descendant of Rollo the Viking and the Jamestown Clays." },
            { name: "Alden Williamson", info: "Revolutionary War Scout (1750-1816). Pioneer navigator of the Tug River Valley. Legend of the frontier defense and rescue of Jenny Wiley." },
            { name: "Rollo (Duke of Normandy)", info: "Viking chieftain who founded Normandy. Ancient root of the Vance (de Vaux) lineage." },
            { name: "John Clay (1613)", info: "Arrived at Jamestown on 'The Treasurer.' One of the first permanent English settlers in America." }
        ];

        const indianRecords = [
            { name: "Jenny Wiley Saga", info: "Full account of Jenny Sellards Wiley's 1789 capture. Taken by Shawnee and Cherokee warriors, her 11-month journey documented the tribal migration paths across the Big Sandy region." },
            { name: "Shawnee/Cherokee Kinship", info: "Records of the cultural and diplomatic intersections between the Perry, Vance, and Sellards lines and the indigenous nations of Appalachia." }
        ];

        function trace(type) {
            let q = (type === 'main') ? document.getElementById('nameSearch').value.toLowerCase().trim() : document.getElementById('indianSearch').value.toLowerCase().trim();
            let records = (type === 'main') ? ancestryRecords : indianRecords;
            if (!q) return;
            const res = records.filter(r => r.name.toLowerCase().includes(q) || r.info.toLowerCase().includes(q));
            let html = "";
            res.forEach(r => { html += `<div style="border-bottom:1px solid #ff0000; padding:15px;"><div style="color:#ff0000; font-size:1.5em; font-weight:bold;">${r.name}</div><p>${r.info}</p></div>`; });
            document.getElementById('v-title').innerText = "REPORT: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = html || "<p>No records found.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function openArchive(key) {
            const h = { 
                'VANCE': "Origins in Norman-French nobility (de Vaux). Traces from Rollo the Viking through the 1066 Conquest and the Plantation of Ulster to the American frontier.",
                'CLAY': "Arrived in Jamestown in 1613 via John Clay. Produced legendary statesman Henry Clay and various Kentucky pioneers.",
                'CHANEY': "Norman roots to the technical builders of the Big Sandy. Line of engineers and guardians of family history.",
                'PERRY': "Colonial navigators of Virginia. Deeply linked to frontier exploration and indigenous adoptions.",
                'WILLIAMSON': "Alden Williamson was a premier Revolutionary Scout and hero of the Tug River Valley settlement.",
                'SELLARDS': "Patriarchs of the Big Sandy; line of Jenny Wiley and frontier survival legends."
            };
            document.getElementById('v-title').innerText = key + " HISTORY";
            document.getElementById('v-body').innerHTML = `<p class="history-p">${h[key]}</p>`;
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
