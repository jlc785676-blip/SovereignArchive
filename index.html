<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMA PERRY ANCESTORS: MASTER VAULT</title> 
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 40px; background: #111; width: 95%; max-width: 950px; text-align: center; box-shadow: 0 0 70px rgba(212, 175, 55, 0.35); border-radius: 12px; }
        h1 { letter-spacing: 5px; text-transform: uppercase; border-bottom: 2px solid #d4af37; padding-bottom: 15px; margin-bottom: 10px; font-size: 2.2em; color: #d4af37; }
        .subtitle { color: #888; font-style: italic; font-size: 1em; margin-bottom: 35px; }
        .search-area { margin-bottom: 40px; display: flex; gap: 12px; justify-content: center; }
        input { padding: 18px; width: 70%; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1.1em; outline: none; }
        button { padding: 18px 35px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #d4af37; }
        #output { text-align: left; max-height: 750px; overflow-y: auto; padding-right: 20px; }
        .heritage-card { background: #161616; border-left: 8px solid #d4af37; padding: 35px; border-radius: 4px; margin-bottom: 30px; box-shadow: 10px 10px 30px rgba(0,0,0,0.7); }
        .heritage-head { color: #fff; font-size: 1.8em; font-weight: bold; display: block; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .heritage-text { color: #ccc; font-size: 1.2em; line-height: 1.9; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>ERMA PERRY ANCESTORS</h1> 
        <div class="subtitle">The Unified Chaney, Perry, Vance, & Sellards Master Records</div>
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Search: Indians, Templar, Chaney, Oshel, Wiley...">
            <button onclick="queryVault()">Query History</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        async function queryVault() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;
            output.innerHTML = "<p style='text-align:center; color:#d4af37;'>Opening the Sovereign Archives...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let htmlData = "";
                let matches = 0;

                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        matches++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Heritage";
                        const story = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        const vital = record.match(/2 DATE (.*)/)?.[1] || "";
                        htmlData += `<div class="heritage-card"><span class="heritage-head">${name}</span><div class="heritage-text">${vital ? '<b>Vital:</b> ' + vital + '<br><br>' : ''}${story}</div></div>`;
                    }
                });

                output.innerHTML = matches > 0 ? htmlData : `<p style='text-align:center; color:#666;'>No matches for "${query}" found. Try a partial word like "Indi".</p>`;
            } catch (err) { output.innerHTML = "Error: Cannot find Gedcom.txt."; }
        }
    </script>
</body>
</html>
