<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        .header-fixed { position:sticky; top:0; width:100%; z-index:2000; background:#1a0f00; border-bottom:3px solid #3e2723; padding:10px 0; }
        .wood-btn { padding:14px; width:92%; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; border:2px solid #211510; font-weight:bold; border-radius:8px; margin-bottom:8px; cursor: pointer; }
        #main-display { margin:60px 15px 180px 15px; text-align: center; }
        .seal { font-size: 3em; border: 2px solid #d4af37; padding: 25px; display: inline-block; border-radius: 50%; margin-bottom: 20px; }
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,5,0.98); z-index:3000; overflow-y:auto; padding:10px; }
        .vault-content { max-width:95%; margin:15px auto; background:#111; border:3px solid #d4af37; padding:20px; border-radius:8px; }
        .footer-fixed { position:fixed; bottom:0; width:100%; z-index:2000; background:#1a0f00; border-top:3px solid #3e2723; padding:8px 0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
        .nav-btn { background:#3e2723; color:#d4af37; border:1px solid #211510; padding:10px; font-size:10px; font-weight:bold; width:30%; border-radius:4px; cursor: pointer; }
        .history-block { margin-bottom:30px; border-bottom:1px solid #3e2723; padding-bottom:20px; text-align: left; }
        .ancestor-header { font-size:1.2em; color:#fff; border-left:4px solid #d4af37; padding-left:10px; margin-bottom:10px; text-transform: uppercase; }
        #status { color: #5d4037; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header-fixed"><center>
        <div id="status">ARCHIVE LOADING...</div>
        <input type="text" id="nameSearch" style="padding:12px; width:85%; background:#000; color:#fff; border:1px solid #5d4037;" placeholder="Enter Name (e.g. Chaney)...">
        <button class="wood-btn" id="traceBtn" onclick="executeDeepTrace()">EXECUTE DEEP TRACE</button>
    </center></div>

    <div id="main-display">
        <div class="seal">⚔️</div>
        <h1 style="color:#d4af37; letter-spacing: 5px; margin: 10px 0;">THE SOVEREIGN ARCHIVE</h1>
        <p style="font-style: italic; color: #888;">"Amos Keener: Slow Speaking, Heart on Fire"</p>
        <p style="color: #d4af37; margin-top: 30px; font-size: 0.9em;">SEARCH THE BLOODLINES ABOVE</p>
    </div>

    <div id="vault-overlay"><div class="vault-content">
        <h2 id="v-title" style="color:#d4af37; text-align:center; border-bottom:1px solid #d4af37; padding-bottom: 10px;"></h2>
        <div id="v-body"></div>
        <button class="wood-btn" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN TO ARCHIVE</button>
    </div></div>

    <div class="footer-fixed">
        <button class="nav-btn" onclick="quickSearch('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="quickSearch('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="quickSearch('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="quickSearch('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="quickSearch('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="quickSearch('WILEY')">WILEY</button>
    </div>

    <script>
        let db = [];
        let archiveReady = false;

        async function loadArchive() {
            try {
                const res = await fetch('Gedcom.txt?v=' + Date.now());
                const text = await res.text();
                db = text.split('0 @').filter(i => i.trim().length > 0).map(i => {
                    const nameMatch = i.match(/1 NAME (.*)/);
                    const noteLines = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                    return {
                        displayName: nameMatch ? nameMatch[1].replace(/\//g, '').trim() : "Record",
                        searchTerms: i.toLowerCase(),
                        details: noteLines
                    };
                });
                archiveReady = true;
                document.getElementById('status').innerText = "ARCHIVE SECURE";
                document.getElementById('status').style.color = "#d4af37";
            } catch (err) { 
                document.getElementById('status').innerText = "ARCHIVE ERROR";
                console.error("Archive fetch failed."); 
            }
        }

        function quickSearch(name) {
            document.getElementById('nameSearch').value = name;
            executeDeepTrace();
        }

        function executeDeepTrace() {
            const query = document.getElementById('nameSearch').value;
            if (!query) return;
            if (!archiveReady) {
                alert("Please wait for the archive to load.");
                return;
            }

            const q = query.toLowerCase().trim();
            const results = db.filter(item => item.searchTerms.includes(q));
            let htmlContent = "";
            
            results.forEach(item => {
                let formattedNotes = item.details.replace(/YOUTUBE_REF: (.*?)(?=\n|$|\r)/g, (match, id) => {
                    return `<iframe width="100%" height="220" src="https://www.youtube.com/embed/${id.trim()}" frameborder="0" allowfullscreen style="margin-top:15px; border: 1px solid #d4af37;"></iframe>`;
                });
                htmlContent += `<div class="history-block"><div class="ancestor-header">${item.displayName}</div><div style="white-space:pre-wrap; line-height: 1.6;">${formattedNotes}</div></div>`;
            });

            document.getElementById('v-title').innerText = "TRACE RESULTS: " + query.toUpperCase();
            document.getElementById('v-body').innerHTML = htmlContent || "<p>No matching bloodline records found.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }
        window.onload = loadArchive;
    </script>
</body>
</html>
