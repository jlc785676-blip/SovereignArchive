<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Master Archive</title>
    <style>
        :root {
            --primary: #3e2723;
            --accent: #c0b283;
            --bg: #f4f1ea;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', serif;
            display: flex;
            flex-direction: column;
        }

        #splash {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            background-color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .splash-card {
            max-width: 550px;
            width: 100%;
        }

        .splash-card img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h1.title { color: var(--primary); font-size: 32px; text-transform: uppercase; margin-bottom: 25px; }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            border: 2px solid var(--primary);
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
            background: #fafafa;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #main-archive {
            display: none;
            padding: 40px 20px;
            max-width: 1200px;
            margin: auto;
            width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        .profile-card { background: white; border: 1px solid #d7ccc8; padding: 35px; border-radius: 10px; }
        
        /* Hidden Audio Container */
        #audio-container {
            display: none;
        }
    </style>
</head>
<body onclick="playMusic()">

<div id="audio-container">
    <iframe id="youtube-player"
        width="0" height="0" 
        src="https://www.youtube.com/embed/4jFLQX5WjoU?enablejsapi=1&loop=1&playlist=4jFLQX5WjoU" 
        frameborder="0" 
        allow="autoplay">
    </iframe>
</div>

<div id="splash">
    <div class="splash-card">
        <img src="knights_templar.jpg" alt="Knights Templar Beach">
        <h1 class="title">Master Ancestry Archive</h1>
        <input type="password" id="passInput" autofocus placeholder="Enter Code" onfocus="playMusic()">
        <button class="btn" onclick="enterArchive()">Enter Fellowship</button>
    </div>
</div>

<div id="main-archive">
    <h1 style="text-align:center; color: var(--primary);">The Sovereign Encyclopedia</h1>
    <div class="archive-grid">
        <div class="profile-card">
            <h3>Encyclopedia Entry: Historical Record</h3>
            <p>Access Granted. The archive is now open.</p>
        </div>
    </div>
</div>

<script>
    var musicStarted = false;

    // This function starts the music when the user clicks or clicks into the password box
    function playMusic() {
        if (!musicStarted) {
            var player = document.getElementById('youtube-player');
            // Send command to the YouTube API to play the video
            player.src += "&autoplay=1";
            musicStarted = true;
        }
    }

    function enterArchive() {
        var pw = document.getElementById("passInput").value;
        if (pw.toLowerCase() === "jesus") {
            document.getElementById("splash").style.display = "none";
            document.getElementById("main-archive").style.display = "block";
            document.body.style.display = "block";
        } else {
            alert("The Fellowship has not recognized this code.");
        }
    }
</script>

</body>
</html>
