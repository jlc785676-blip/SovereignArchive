        function playGateAction() {
            var splash = document.getElementById('splash');
            var ui = document.getElementById('main-ui');
            if (splash) {
                splash.style.opacity = '0';
                splash.style.pointerEvents = 'none';
                setTimeout(function() { 
                    splash.style.display = 'none'; 
                    if (ui) {
                        ui.style.display = 'block'; 
                        setTimeout(function() { 
                            ui.style.opacity = '1'; 
                            document.body.style.overflow = 'auto'; 
                        }, 50);
                    }
                }, 500);
            }
        }

                        <li><strong>Knightly Service (1135):</strong> Simon Wathes served King Stephen of England as a Knight of the Kingdom.</li>
                        <li><strong>Ships:</strong> London Supply Ships (c. 1640) carrying Edward Watts I.</li>
                        <li><strong>Detail:</strong> Land granted in Stafford County specifically to defend the Rappahannock frontier.</li>
                      </ul>

                            <ul>
                                <li><strong>1774:</strong> Alden Williamson at Point Pleasant.</li>

                          <ul>

                            <li><strong>Ordeal:</strong> Jenny Sellards Wiley’s survival defines the line.</li>

        function openArchive(key) {
            document.getElementById('v-title').innerText = key.replace(/_/g, ' ') + " LEDGER";
            document.getElementById('v-body').innerHTML = archiveData[key];
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function trace(type) {
            let q = (type === 'indian') ? document.getElementById('indianSearch').value.toLowerCase().trim() : document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            let results = "";
            for (let key in archiveData) {
                if (archiveData[key].toLowerCase().includes(q)) {
                    results += "<div style='margin-bottom:20px; border-bottom:1px solid #ddd; padding-bottom:10px;'>" + archiveData[key] + "</div>";
                }
            }
            document.getElementById('v-title').innerText = "SEARCH RESULTS: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = results || "No match found for '" + q + "'.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
