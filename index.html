<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive: Master Lineage</title> 
    <style>
        /* Modernized for a professional, wide-webpage feel */
        body { background-color: #050505; color: #d4af37; font-family: 'Times New Roman', serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header-section { text-align: center; margin-bottom: 30px; width: 100%; max-width: 1200px; border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        h1 { font-size: 1.8em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        .tagline { font-size: 0.9em; color: #888; font-style: italic; margin-top: 5px; }

        .search-bar { 
            display: flex; gap: 10px; justify-content: center; margin-bottom: 40px; 
            position: sticky; top: 10px; z-index: 100; background: rgba(5,5,5,0.9); padding: 10px; border-radius: 8px;
        }
        input { padding: 12px; width: 300px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; }
        button { padding: 12px 25px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
        
        #output { width: 100%; max-width: 1000px; }

        /* The "Legacy Scroll" Style */
        .generation-card { 
            border-left: 2px solid #222; margin-left: 20px; padding: 15px 25px; 
            margin-bottom: 5px; background: rgba(20,20,20,0.5); position: relative;
        }
        .generation-card::before {
            content: ""; position: absolute; left: -7px; top: 22px; 
            width: 12px; height: 12px; background: #333; border-radius: 50%;
        }
        .generation-card:hover { border-left-color: #d4af37; background: #111; }
        .generation-card:hover::before { background: #d4af37; }

        .gen-label { font-size: 0.65em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .name { font-size: 1.1em; color: #eee; font-weight: bold; }
        .vitals { font-size: 0.85em; color: #888; }

        /* The Main Search Result */
        .primary-target { 
            background: #111; border: 2px solid #d4af37; padding: 30px; 
            margin-top: 20px; border-radius: 8px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); 
        }
        .primary-target .name { font-size: 2em; color: #d4af37; }
        .story-box { margin-top: 20px; color: #ccc; line-height: 1.8; font-style: italic; border-top: 1px solid #222; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="header-section">
        <h1>ERMA PERRY ANCESTORS</h1>
        <div class="tagline">Chaney • Perry • Vance • Sellards Master Archive</div>
    </div>

    <div class="search-bar">
        <input type="text" id="nameIn" placeholder="Enter Name (e.g. Josh, Oshel, Erma)">
        <button onclick="unlockLineage()">Query Archive</button>
    </div>

    <div id="output"></div>

    <script>
        async function unlockLineage() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center;'>Consulting the Master Ledger...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                
                let matchIdx = -1;
                for (let i = 0; i < records.length; i++) {
                    if (records[i].toLowerCase().includes(query) && records[i].includes('1 NAME')) {
                        matchIdx = i;
                        break;
                    }
                }

                if (matchIdx !== -1) {
                    let html = "";
                    
                    // Display up to 30 generations behind the target
                    const start = Math.max(1, matchIdx - 30);
                    for (let j = start; j < matchIdx; j++) {
                        const name = records[j].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Ancestor";
                        const date = records[j].match(/2 DATE (.*)/)?.[1] || "";
                        const place = records[j].match(/2 PLAC (.*)/)?.[1] || "";
                        
                        html += `
                            <div class="generation-card">
                                <span class="gen-label">Preceding Generation</span><br>
                                <span class="name">${name}</span><br>
                                <span class="vitals">${date} ${place ? ' — ' + place : ''}</span>
                            </div>`;
                    }

                    // The Big Search Result
                    const targetName = records[matchIdx].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || query;
                    const targetDate = records[matchIdx].match(/2 DATE (.*)/)?.[1] || "";
                    const targetPlace = records[matchIdx].match(/2 PLAC (.*)/)?.[1] || "";
                    const targetNotes = [...records[matchIdx].matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('<br><br>');

                    html += `
                        <div class="primary-target">
                            <span class="gen-label" style="color:#d4af37">Primary Lineage Discovery</span>
                            <div class="name">${targetName.toUpperCase()}</div>
                            <div class="vitals" style="font-size:1.1em; color:#fff;">${targetDate}</div>
                            <div style="color:#888;">${targetPlace}</div>
                            <div class="story-box">${targetNotes || "Lineage context available in master GEDCOM."}</div>
                        </div>`;

                    output.innerHTML = html;
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    output.innerHTML = "<p style='text-align:center;'>No record found. Check spelling or ensure name is in Gedcom.txt.</p>";
                }
            } catch (err) {
                output.innerHTML = "<p style='text-align:center;'>Error loading archive.</p>";
            }
        }
    </script>
</body>
</html>
