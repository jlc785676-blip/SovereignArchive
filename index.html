    <script>
        let db = [];
        async function init() {
            try {
                const res = await fetch('Gedcom.txt?v=' + new Date().getTime());
                const data = await res.text();
                // Splitting records correctly
                const items = data.split('0 @').filter(i => i.trim().length > 0);
                db = items.map(i => {
                    const n = i.match(/1 NAME (.*)/);
                    const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                    return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
                });
            } catch (e) { console.error("Archive failed to load."); }
        }

        function format(t) {
            // FIXED IMAGE LOGIC: Handles spaces and different line endings
            let f = t.replace(/IMAGE_REF: (.*?)(?=\n|$|\r)/g, "<img src='$1' style='width:100%; border: 1px solid #d4af37; margin: 15px 0; border-radius: 5px; display:block;'>");
            
            // Indian History Highlight
            f = f.replace(/(INDIAN HISTORY:.*?)(?=\n|$|\r)/g, "<div style='background:rgba(139,0,0,0.2); border-left:3px solid #ff4500; padding:10px; margin:10px 0;'>$1</div>");
            
            // Bold Key Terms
            const bolds = /(SECTION.*?|GENERATION.*?|HISTORY:|MOTTO:|I\.|II\.|III\.|IV\.|V\.|VI\.|Viking|Conqueror|Rollo|Ragnar)/g;
            return f.replace(bolds, "<strong>$1</strong>");
        }

        function openMaster(s) {
            startMusic();
            const r = db.find(i => i.raw.includes("hist_" + s.toLowerCase() + "_full"));
            if (r) {
                document.getElementById('v-title').innerText = s + " MASTER RECORD";
                document.getElementById('v-body').innerHTML = format(r.notes);
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }

        function executeSearch(m) {
            startMusic();
            const q = (m === 'name' ? document.getElementById('nameSearch') : document.getElementById('indianSearch')).value.toLowerCase();
            const results = db.filter(r => r.raw.includes(q));
            let h = "";
            results.forEach(r => { h += `<div class="tree-node"><div class="name-banner">${r.name}</div><div class="story-box">${format(r.notes)}</div></div>`; });
            document.getElementById('output-area').innerHTML = h || "<p style='text-align:center;'>Searching...</p>";
        }

        function startMusic() {
            const m = document.getElementById('mohicansPlayer');
            // Check if audio exists and is actually paused
            if (m && m.paused) { 
                m.volume = 0;
                m.play().then(() => {
                    let vol = 0;
                    let fade = setInterval(() => { 
                        if (vol < 0.4) { 
                            vol += 0.02; 
                            m.volume = Math.min(vol, 0.4); 
                        } else { 
                            clearInterval(fade); 
                        } 
                    }, 300);
                }).catch(e => console.log("Music waiting for tap..."));
            }
        }
        window.onload = init;
        // Listen for any interaction to unlock music
        document.addEventListener('touchstart', startMusic, { once: true });
        document.addEventListener('click', startMusic, { once: true });
    </script>
