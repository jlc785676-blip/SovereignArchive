<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN HERITAGE ARCHIVE</title>
    <style>
        body { background-color: #0a0a0a; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 20px; text-align: center; }
        .box { border: 2px solid #d4af37; padding: 40px; display: inline-block; background: #1c1c1c; border-radius: 8px; max-width: 90%; margin-top: 50px; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 4px; font-size: 2.2em; }
        input { padding: 15px; width: 80%; background: #333; border: 1px solid #d4af37; color: white; margin-bottom: 15px; border-radius: 4px; font-size: 1.1em; }
        button { padding: 15px 30px; background: #d4af37; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; width: 85%; font-size: 1.1em; text-transform: uppercase; }
        .hidden { display: none; }
        
        /* The Widescreen Archive Area */
        #archive-ui { width: 95%; max-width: 1500px; margin: 30px auto; text-align: left; }
        .tree-node { background: rgba(25, 25, 25, 0.95); border-left: 10px solid #d4af37; padding: 40px; margin-bottom: 30px; border-radius: 0 15px 15px 0; box-shadow: 10px 10px 40px rgba(0,0,0,0.7); }
        .name-banner { font-size: 2em; color: #fff; font-weight: bold; letter-spacing: 2px; }
        .story-box { color: #ccc; font-size: 1.3em; line-height: 1.9; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="gate" class="box">
        <h1>Sovereign Heritage</h1>
        <p><i>"The truth shall set you free."</i></p>
        <input type="password" id="code" placeholder="Enter Heritage Code">
        <br>
        <button onclick="unlock()">Unlock Records</button>
    </div>

    <div id="vault" class="hidden">
        <h1>Vault Access Granted</h1>
        <div style="margin-bottom: 30px;">
            <input type="text" id="searchIn" placeholder="Search a Name (e.g., Perry, Weaver, Indian, Vance)..." style="width: 50%; display: inline-block;">
            <button onclick="searchVault()" style="width: 200px; display: inline-block;">Search Tree</button>
        </div>
        <div id="output-area"></div>
    </div>

    <script>
        function unlock() {
            const val = document.getElementById('code').value.toUpperCase();
            if(val === "FAMILY1978") {
                document.getElementById('gate').classList.add('hidden');
                document.getElementById('vault').classList.remove('hidden');
            } else {
                alert("Incorrect Code.");
            }
        }

        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;

            output.innerHTML = "<p style='color:#d4af37; font-size:1.5em;'>Scanning the Bloodlines...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let html = "";
                let count = 0;

                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        count++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Ancestor";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        html += `<div class="tree-node">
                                    <div class="name-banner">${name}</div>
                                    <div class="story-box">${notes}</div>
                                 </div>`;
                    }
                });

                output.innerHTML = count > 0 ? html : `<p>No records found for "${query}".</p>`;
            } catch (err) { output.innerHTML = "Error: Gedcom.txt not found on server."; }
        }
    </script>
</body>
</html>
