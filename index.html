<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Master Archive</title>
    <style>
        :root {
            --primary: #3e2723;
            --accent: #c0b283;
            --bg: #f4f1ea;
        }

        /* Essential Reset */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', serif;
        }

        /* Splash Layout: Locked to Center */
        #splash {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            text-align: center;
        }

        .splash-card {
            max-width: 500px;
            width: 90%;
            padding: 20px;
        }

        .splash-card img {
            width: 100%;
            border-radius: 8px;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h1.title { color: var(--primary); margin-bottom: 20px; text-transform: uppercase; }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            border: 2px solid var(--primary);
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hidden Main Content */
        #main-archive {
            display: none;
            padding: 50px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
        .profile-card { background: white; border: 1px solid #d7ccc8; padding: 30px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="music-player" style="position: absolute; left: -9999px;">
    <div id="youtube-frame"></div>
</div>

<div id="splash">
    <div class="splash-card">
        <img src="knights_templar.jpg" alt="Knights Templar Beach">
        <h1 class="title">Sovereign Archive</h1>
        <input type="password" id="passInput" placeholder="Type Here..." onfocus="startMusic()">
        <button class="btn" onclick="checkPass()">Enter Fellowship</button>
    </div>
</div>

<div id="main-archive">
    <h1 style="text-align: center; color: var(--primary); font-size: 40px;">The Sovereign Encyclopedia</h1>
    <hr style="border: 1px solid var(--accent); margin-bottom: 40px;">
    
    <div class="archive-grid">
        <div class="profile-card">
            <h3>Historical Fellowship Entry</h3>
            <p>Welcome to the Master Archive. The lineage records, military fellowships, and frontier scouting logs are being assembled here.</p>
        </div>
    </div>
</div>

<script>
    var musicLoaded = false;

    // This function starts the music when the user clicks the password box
    function startMusic() {
        if (!musicLoaded) {
            document.getElementById('youtube-frame').innerHTML = 
                '<iframe width="0" height="0" src="https://www.youtube.com/embed/4jFLQX5WjoU?autoplay=1&loop=1&playlist=4jFLQX5WjoU" frameborder="0" allow="autoplay"></iframe>';
            musicLoaded = true;
        }
    }

    function checkPass() {
        var pw = document.getElementById("passInput").value;
        // Password set to jesus
        if (pw.toLowerCase() === "jesus") {
            // Hide the splash and show the archive
            document.getElementById("splash").style.display = "none";
            document.getElementById("main-archive").style.display = "block";
            
            // Fix page layout for scrolling
            document.body.style.display = "block";
            document.body.style.overflow = "auto";
        } else {
            alert("The Fellowship has not recognized this code.");
        }
    }
</script>

</body>
</html>
