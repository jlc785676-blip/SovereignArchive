<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color: #050505; color: #d4af37; font-family: 'Georgia', serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .header-section { text-align: center; padding: 60px 20px; width: 100%; background: #0a0a0a; border-bottom: 2px solid #d4af37; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        h1 { font-size: 2.8em; letter-spacing: 6px; text-transform: uppercase; margin: 0; color: #d4af37; }
        .search-container { position: sticky; top: 0; z-index: 1000; width: 100%; background: rgba(5,5,5,0.95); padding: 25px 0; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 15px; }
        input { padding: 15px 30px; width: 450px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 1.2em; outline: none; }
        button { padding: 15px 35px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #d4af37; }
        #output { width: 95%; max-width: 1200px; padding: 50px 0; }
        .heritage-node { background: #0f0f0f; border-left: 8px solid #d4af37; padding: 40px; margin-bottom: 30px; border-radius: 0 10px 10px 0; box-shadow: 10px 10px 30px rgba(0,0,0,0.6); }
        .name-banner { font-size: 2em; color: #fff; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .story-content { color: #ccc; font-size: 1.3em; line-height: 1.9; border-top: 1px solid #222; margin-top: 25px; padding-top: 20px; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header-section">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div style="color:#888; font-style:italic; margin-top:15px; letter-spacing: 2px;">Adkins • Williamson • Clay • Perry • Vance • Chaney</div>
    </div>
    <div class="search-container">
        <input type="text" id="nameIn" placeholder="Type a Name or History (e.g. adkins, williamson, boy, bacon)...">
        <button onclick="smartSearch()">Unlock Vault</button>
    </div>
    <div id="output"></div>

    <script>
        async function smartSearch() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center; color:#d4af37; font-size:1.5em;'>Scanning the Master Bloodlines...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let html = "";
                let count = 0;

                records.forEach(record => {
                    // This forces a "fuzzy match" regardless of case or spelling
                    if (record.toLowerCase().includes(query)) {
                        count++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Historical Context";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        html += `<div class="heritage-node">
                                    <div class="name-banner">${name}</div>
                                    <div class="story-content">${notes || "Direct lineage connection found in archive."}</div>
                                 </div>`;
                    }
                });

                output.innerHTML = count > 0 ? html : `<p style='text-align:center; font-size:1.2em;'>No match found for "${query}". Ensure the name is in Gedcom.txt.</p>`;
            } catch (err) { output.innerHTML = "Error: System cannot reach Gedcom.txt on GitHub."; }
        }
    </script>
</body>
</html>
