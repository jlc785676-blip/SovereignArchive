<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .vault-container { border: 2px solid #d4af37; padding: 40px; background: #111; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 0 40px rgba(212, 175, 55, 0.15); border-radius: 12px; }
        h1 { letter-spacing: 6px; text-transform: uppercase; margin-bottom: 5px; font-size: 1.8em; }
        p.subtitle { color: #888; font-style: italic; margin-bottom: 30px; font-size: 0.9em; }
        .search-area { margin-bottom: 20px; }
        input { padding: 15px; width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 1em; margin-bottom: 10px; }
        button { padding: 15px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; border-radius: 6px; transition: 0.3s; }
        button:hover { background: #fff; }
        .footer-links { margin-top: 40px; border-top: 1px solid #222; padding-top: 20px; }
        .btn-raw { color: #888; text-decoration: none; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; }
        .btn-raw:hover { color: #d4af37; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>Sovereign Archive</h1>
        <p class="subtitle">The Chaney, Vance, & Perry Heritage Portal</p>
        
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Enter Ancestor Name...">
            <button onclick="executeSearch()">Unlock Records</button>
        </div>

        <div class="footer-links">
            <a href="Gedcom.txt" target="_blank" class="btn-raw">Access Master Data Log</a>
        </div>
    </div>

    <script>
        function executeSearch() {
            const name = document.getElementById('nameIn').value.trim();
            if (!name) return;
            // This triggers a precision Google search for that specific person
            const query = encodeURIComponent(name + " genealogy census family records");
            window.open('https://www.google.com/search?q=' + query, '_blank');
        }
    </script>
</body>
</html>
