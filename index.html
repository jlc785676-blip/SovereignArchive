<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* THE GATE - SPLASH SCREEN */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999999; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .splash-image { width: 95%; max-width: 1400px; height: auto; border: 2px solid #d4af37; box-shadow: 0 0 50px #000; }
        .gate-btn { 
            margin-top: 25px; padding: 20px 60px; 
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 3px solid #d4af37; font-weight: 900; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 4px; font-size: 1.4em; box-shadow: 0 0 20px #ff0000;
        }

        /* MAIN ARCHIVE UI */
        #main-ui { display:none; text-align: center; max-width: 800px; margin: 0 auto; opacity: 0; padding: 15px; overflow-y: auto; height: 100vh; transition: opacity 0.5s ease; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        .section-container { display: flex; flex-direction: column; gap: 30px; align-items: center; padding-bottom: 100px; }
        .archive-item { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .family-thumb { width: 100%; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; box-sizing: border-box; margin-bottom: 10px; }
        .red-btn { padding: 15px 30px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; }
        
        /* DATA VAULT OVERLAY */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#ffffff; border:6px solid #d4af37; padding:25px; border-radius:10px; text-align: left; max-width: 900px; margin: 20px auto; color: #000000; }
        .ledger-text { font-size: 1.1em; line-height: 1.7; color: #000; white-space: pre-wrap; }
        .video-panel { width: 100%; max-width: 500px; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="movie_splash.png" class="splash-image">
        <button class="gate-btn" onclick="unlockGate()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>
        
        <div class="section-container">
            <input type="text" id="mainSearch" placeholder="SEARCH ALL ANCESTORS...">
            <button class="red-btn" onclick="runSearch()">TRACE LINEAGE</button>

            <div class="archive-item">
                <img src="ship_arrival.jpg" class="family-thumb">
                <button class="red-btn" onclick="openVault('SHIPS')">Ancestors; SailingShip to the Americas (1135-1750)</button>
            </div>

            <div class="archive-item">
                <h2 style="color:#ff0000;">INDIAN HERITAGE RESEARCH</h2>
                <div style="border: 3px solid #d4af37; padding: 10px;"><img src="Indians_search.png" style="width:100%;"></div>
                <button class="red-btn" style="margin-top:10px;" onclick="openVault('INDIAN_CHRONO')">INDIAN CHRONOLOGICAL REPORT</button>
            </div>

            <div class="archive-item"><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openVault('CHANEY')">CHANEY HISTORY</button></div>
            <div class="archive-item"><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openVault('VANCE')">VANCE HISTORY</button></div>
            <div class="archive-item"><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openVault('PERRY')">PERRY HISTORY</button></div>
            <div class="archive-item"><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openVault('CLAY')">CLAY HISTORY</button></div>
            <div class="archive-item"><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openVault('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            
            <div class="video-panel"><iframe width="100%" height="300" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe></div>
        </div>
    </div>

    <div id="vault-overlay">
        <div class="vault-content">
            <div id="v-title" style="color:#ff0000; font-size: 1.8em; border-bottom: 3px solid #ff0000; margin-bottom: 20px; text-transform: uppercase; font-weight: 900;"></div>
            <div id="v-body" class="ledger-text"></div>
            <button class="red-btn" style="margin-top: 30px; border: 3px solid #000;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN TO ARCHIVE</button>
        </div>
    </div>

    <script>
        const vaultData = {
            'SHIPS': `<strong>THE GLOBAL MARITIME & FELLOWSHIP CHRONICLE: 1135–1750</strong>\n\n` +
                     `<strong>WATTS / WATHES (1135-1640):</strong> Simon Wathes served King Stephen as a Knight. Edward Watts I arrived c.1640 on London Supply Ships to defend the Rappahannock frontier.\n\n` +
                     `<strong>PERRY (1611-1619):</strong> Capt. William Perry arrived on the <em>Starr</em> (1611); John Perry arrived on the <em>Bona Nova</em> (1619).\n\n` +
                     `<strong>CLAY (1613-1620):</strong> John Clay ("The Immigrant") arrived on the <em>Treasurer</em> (1613); Anne Clay on the <em>Falcon</em> (1620).\n\n` +
                     `<strong>BOYCE/CHANEY (1617-1621):</strong> Cheney Boyce arrived on the <em>George</em> (1617); Sarah Boyce on the <em>Sea Flower</em> (1621); Richard Cheyney on the <em>Charles</em> (1621).\n\n` +
                     `<strong>ADKINS (1635):</strong> Thomas Adkins arrived on the <em>Assurance</em>; Richard Adkins on the <em>Globe</em>.\n\n` +
                     `<strong>SELLARDS (1732):</strong> Hezekiah Sellards arrived on Ulster Brigantines from Ireland.\n\n` +
                     `<strong>VANCE (1739):</strong> Charles Vance arrived on Ulster Merchant Transports (1739). Lineage includes the Lords of Barnbarroch and Sinclair/Rosslyn ties.\n\n` +
                     `<strong>AKERS (c.1750):</strong> Valentine, Solomon, and Augustine Akers arrived on Frontier Coastal Schooners.\n\n` +
                     `<strong>WILLIAMSON:</strong> Arrived on Chesapeake Tobacco Merchantmen as skilled navigators.`,
            
            'CHANEY': `<strong>CHANEY HISTORY:</strong> 1617 George arrival. Sarah Boyce's 1622 survival. Newman Chaney legacy.`,
            'VANCE': `<strong>VANCE HISTORY:</strong> Lords of Barnbarroch. Sinclair/Templar ties. Abner Vance (Indian Spy).`,
            'PERRY': `<strong>PERRY HISTORY:</strong> 1611 Capt. William Perry. The 1622 Blood Covenant with Chanko.`,
            'CLAY': `<strong>CLAY HISTORY:</strong> 1613 John Clay. Clover Bottom (1783). Henry Clay (Grand Master).`,
            'WILLIAMSON': `<strong>WILLIAMSON HISTORY:</strong> 1774 Point Pleasant. Jenny Wiley (1789).`,
            'INDIAN_CHRONO': `<strong>INDIAN CHRONOLOGICAL REPORT:</strong> 1611-1930. Covering the Tribal Bonds of the Vance, Perry, and Clay lines.`
        };

        function unlockGate() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                setTimeout(() => { document.getElementById('main-ui').style.opacity = '1'; document.body.style.overflow = 'auto'; }, 50);
            }, 500);
        }

        function openVault(key) {
            document.getElementById('v-title').innerText = key.replace('_', ' ') + " LEDGER";
            document.getElementById('v-body').innerHTML = vaultData[key];
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function runSearch() {
            let q = document.getElementById('mainSearch').value.toLowerCase().trim();
            if (!q) return;
            let results = "";
            for (let k in vaultData) { if (vaultData[k].toLowerCase().includes(q)) results += vaultData[k] + "<hr>"; }
            document.getElementById('v-title').innerText = "SEARCH RESULTS";
            document.getElementById('v-body').innerHTML = results || "No records found.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
