<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        .header-fixed { position:sticky; top:0; width:100%; z-index:2000; background:#1a0f00; border-bottom:3px solid #3e2723; padding:10px 0; }
        .wood-btn { padding:14px; width:92%; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; border:2px solid #211510; font-weight:bold; border-radius:8px; margin-bottom:8px; }
        #main-display { margin:40px 15px 180px 15px; text-align: center; }
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,5,0.99); z-index:3000; overflow-y:auto; padding:10px; }
        .vault-content { max-width:95%; margin:15px auto; background:#111; border:3px solid #d4af37; padding:20px; border-radius:8px; }
        .footer-fixed { position:fixed; bottom:0; width:100%; z-index:2000; background:#1a0f00; border-top:3px solid #3e2723; padding:8px 0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
        .nav-btn { background:#3e2723; color:#d4af37; border:1px solid #211510; padding:10px; font-size:10px; font-weight:bold; width:30%; }
        .history-block { margin-bottom:40px; border-bottom:1px solid #3e2723; padding-bottom:20px; text-align: left; }
        .ancestor-header { font-size:1.3em; color:#fff; border-left:4px solid #d4af37; padding-left:10px; margin-bottom:10px; }
    </style>
</head>
<body>
    <div class="header-fixed"><center>
        <input type="text" id="nameSearch" style="padding:12px; width:85%; background:#000; color:#fff; border:1px solid #5d4037;" placeholder="Enter Surname...">
        <button class="wood-btn" onclick="executeDeepTrace(document.getElementById('nameSearch').value)">EXECUTE DEEP TRACE</button>
    </center></div>

    <div id="main-display">
        <h1 style="color:#d4af37;">THE SOVEREIGN ARCHIVE</h1>
        <p>"Blood remembers what the mind forgets."</p>
    </div>

    <div id="vault-overlay"><div class="vault-content">
        <h2 id="v-title" style="color:#d4af37; text-align:center; border-bottom:1px solid #d4af37;"></h2>
        <div id="v-body"></div>
        <button class="wood-btn" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
    </div></div>

    <div class="footer-fixed">
        <button class="nav-btn" onclick="executeDeepTrace('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="executeDeepTrace('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="executeDeepTrace('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="executeDeepTrace('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="executeDeepTrace('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="executeDeepTrace('WILEY')">WILEY</button>
    </div>

    <script>
        let db = [];
        async function init() {
            const res = await fetch('Gedcom.txt?v=' + Date.now());
            const data = await res.text();
            db = data.split('0 @').filter(i => i.trim().length > 0).map(i => {
                const n = i.match(/1 NAME (.*)/);
                const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
            });
        }
        function executeDeepTrace(q) {
            if (!q) return;
            const results = db.filter(r => r.raw.includes(q.toLowerCase()));
            let h = "";
            results.forEach(r => {
                let n = r.notes.replace(/YOUTUBE_REF: (.*?)(?=\n|$|\r)/g, (m, v) => `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${v.trim()}" frameborder="0" allowfullscreen style="margin-top:10px;"></iframe>`);
                h += `<div class="history-block"><div class="ancestor-header">${r.name}</div><div style="white-space:pre-wrap;">${n}</div></div>`;
            });
            document.getElementById('v-title').innerText = "RESULTS FOR: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "<p>No matching bloodlines found.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }
        window.onload = init;
    </script>
</body>
</html>
