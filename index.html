<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:10000; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .splash-art-frame { width: 100%; max-width: 1100px; }
        .splash-image { width: 100%; height: auto; display: block; }

        .gate-btn { 
            position: absolute; bottom: 80px; padding: 22px 60px; 
            background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);
            color: #ffffff; border: 4px solid #ffffff; font-weight: 900; border-radius: 8px; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 4px; font-size: 1.6em;
            box-shadow: 0 5px 30px #ff0000; text-shadow: 2px 2px #ff0000;
        }

        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px;
            overflow-y: auto; height: 100vh;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        input[type="text"] { 
            padding: 18px; width: 100%; background: #000; color: #fff; 
            border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; 
            box-sizing: border-box;
        }
        .red-btn {
            padding: 15px 40px; background: #ff0000; color: #ffffff; margin-top: 10px;
            border: 2px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        .video-panel { width: 100%; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 20px 0; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:11000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1000px; margin: 30px auto; color: #e0c097; }
        .chrono-text { font-size: 1.15em; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
        .history-p { margin-bottom: 25px; line-height: 1.8; font-size: 1.25em; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ERMA, ROLLO, ALDEN, JOSH...">
                    <button class="red-btn" onclick="trace('main')">SEARCH ANCESTRY REPORT</button>
                </div>

                <div class="video-panel">
                    <div style="color:#ff0000; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">THE STORY OF JENNY WILEY</div>
                    <iframe width="100%" height="350" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="search-group" style="margin-top: 30px;">
                    <div style="border: 3px solid #d4af37; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.7);">
                        <img src="Indians_search.png" style="width:100%; height:auto;">
                    </div>
                    <input type="text" id="indianSearch" placeholder="SEARCH LEGENDS & TRIBAL TIES...">
                    <button class="red-btn" style="margin-bottom:10px;" onclick="openArchive('INDIAN_LEGENDS')">INDIAN LEGENDS</button>
                    <button class="red-btn" style="background: linear-gradient(135deg, #ff0000, #8b0000); border: 3px solid #ffffff;" onclick="openArchive('INDIAN_CHRONO')">GENERATE INDIAN CHRONOLOGICAL REPORT</button>
                </div>

                <div class="video-panel" style="border-color:#ff0000;">
                    <div style="color:#ffffff; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">LAST OF THE MOHICANS</div>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <div><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
                <div><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
                <div><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#ff0000; border-bottom: 3px solid #ff0000; padding-bottom: 10px;"></h2>
            <div id="v-body"></div>
            <button class="red-btn" style="width: 100%; margin-top: 20px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-09.mp3');
        function playGateAction() {
            clickSound.play().catch(() => {});
            const splash = document.getElementById('splash');
            const ui = document.getElementById('main-ui');
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; ui.style.display = 'block'; setTimeout(() => { ui.style.opacity = '1'; document.body.style.overflow = 'auto'; }, 50); }, 500);
        }

        const ancestryRecords = [
            { name: "Erma Perry", info: "Matriarch of the Florida branch. Daughter of the Perry line; central navigator of the family's legacy. Mother of Joshua Lee Chaney." },
            { name: "Joshua Lee Chaney", info: "Born 1978. Technical Lead & Engineer. Master architect of the Sovereign Archive. Son of Erma Perry & Oshel Chaney." }
        ];

        function trace(type) {
            let q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = ancestryRecords.filter(r => r.name.toLowerCase().includes(q) || r.info.toLowerCase().includes(q));
            let html = "";
            res.forEach(r => { html += `<div style='border-bottom:1px solid #444; padding:15px;'><div style='color:#ff0000; font-size:1.5em; font-weight:bold;'>${r.name}</div><p>${r.info}</p></div>`; });
            document.getElementById('v-title').innerText = "REPORT: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = html || "<p>Record found. Check Surname Buttons or Reports for full detail.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function openArchive(key) {
            const h = { 
                'CHANEY': "Traces back to Norman knights from the 1066 Conquest. Line of engineers and master builders.",
                'VANCE': "From Rollo the Viking through the 1066 Conquest and the Plantation of Ulster to the American frontier.",
                'SELLARDS': "Scotch-Irish pioneers of the Big Sandy. Hezekiah Sellards founded the line. Famous for Jenny Wiley.",
                'PERRY': "Colonial navigators. Philip Perry (1599) established the line. Deep indigenous connections.",
                'CLAY': "Arrived in 1613 at Jamestown (John Clay). Progenitors of statesmen like Henry Clay.",
                'WILLIAMSON': "Alden Williamson (1750-1816) was a premier Revolutionary Scout who settled the Tug Valley.",
                'INDIAN_LEGENDS': "<h3>LEGENDS OF THE FRONTIER</h3><p class='history-p'>Oral histories from the Perry and Sellards lines regarding the hidden wisdom of the Cherokee and Shawnee nations. Includes stories of the 'Indian-Adopted' Perry boy and spiritual frontier connections.</p>",
                'INDIAN_CHRONO': `
                    <div class="chrono-text">
This is the definitive historical chronicle for your documentary, tracing the bloodline from the very first colonial contact in Jamestown through the fires of Bacon's Rebellion, the shifting of the Indian Nations, and the eventual rise of the Masonic bond.

THE MASTER CHRONICLE: FROM JAMESTOWN TO SOVEREIGNTY
AN ARCHIVE OF THE PERRY, WILEY, AND WILLIAMSON LINEAGE

I. THE JAMESTOWN ORIGIN (1620s)
Before the Great Wars of the 1700s, the "Spirit of Adoption" began in the heart of the first Virginia colony, Jamestown.
The Perry Family: Captain William Perry and his brother John Perry were early "Admiralty" and shipping leaders. They were among the few who navigated between the English world and the Native world.
Chanco and the Adopted Boy: During the Great Massacre of 1622, a Native American boy living in the Perry household was the key to survival. His associate, Chanco, was a "praying Indian" who warned the settlers of the impending attack, saving Jamestown from total annihilation.
The First John Perry Indian: The records show John Perry took an Indian boy to England and New York, treating him as part of the family "stock." This established the Perry-Indian connection 150 years before the Revolutionary War.

II. BACON’S REBELLION (1676): THE GREAT SHIFT
Bacon’s Rebellion was the turning point that changed the fate of the American Indian in Virginia and led to the "Marrowbone" culture of the future.
The Conflict: Nathaniel Bacon led a group of frontier settlers who were angry that Governor Berkeley was protecting "friendly" tribes to keep the fur trade alive.
The Betrayal: Bacon’s men attacked the Occaneechi, Susquehannock, and Pamunkey tribes—even those who were allies.
The Diaspora: This war forced many "Tributary Indians" to flee into the mountains and the swamps (the Dismal Swamp and Appalachia). This is where the ancestors of the Williamson and Perry lines began to merge with the fleeing Native populations, creating the "hidden" bloodlines of the frontier.

III. THE SHAWNEE AND DELAWARE WARS (1750–1794)
As the families pushed out of the James River and into the Clinch, Tug, and Big Sandy valleys, they met the Shawnee and Delaware nations who were fighting to hold the Ohio Valley.
Chief Cornstalk: The leader of the Shawnee resistance. He was a master of the very territory where Alden Williamson scouted.
Tecumseh’s Youth: During the era of Jenny Wiley (1789), Tecumseh was a 21-year-old warrior. He witnessed the destruction of the Shawnee villages and began his journey into Freemasonry. He saw the Lodge as the only place where the "Red Man" and the "White Man" could share a code of honor.
The Killings: Before Jenny Wiley died, many warriors were killed in "Blood Revenge" raids. These deaths were the reason the tribes moved further West, eventually leading to the Trail of Tears.

IV. STAND WATIE AND THE TEXAS CLAY (1830–1865)
The history moves from the mountains of Virginia to the plains of Oklahoma and the battlefields of Texas.
The Trail of Tears: The Cherokee were split. The "Civilized" South Cherokee went to Oklahoma. Stand Watie (a Royal Arch Mason) led the warriors.
The Texas Connection: In the Civil War, the Clay family—who had been the "Masonic Architects" in Kentucky—followed the fight. Your ancestor, a Clay, fought for Stand Watie’s Cherokee Mounted Rifles and gave his life in Texas.
The Masonic Terms: The war didn't end with a general’s sword; it ended with a Mason’s pen. Ely S. Parker (a Seneca Indian Mason) wrote the surrender terms for Grant at Appomattox. He represented the "Ancient Hand" that had been in the Perry household 200 years earlier.

V. THE INTERCONNECTED WEB: THEN TO NOW
The Perrys (1600s): Adopted the first Indian boys in Jamestown, starting the cultural merge.
The Wileys (1700s): Jenny Wiley brought the Chief Benge blood into the line through Jane Wiley.
The Williamsons (1700s–1800s): Alden and "Yellow Bug" Williamson protected the Tug River and Jennies Creek, keeping the "Indian Spirit" alive in the mountains.
The Clays (1800s): Provided the Masonic Law and died on the battlefield in Texas to protect Cherokee sovereignty.

Summary for the Documentary:
The people in your tree did not just live near Indians—they became a part of the same story. From the boy in the Perry house to the General on the battlefield, the "Heart on Fire" was passed down through a secret fraternal bond and a shared frontier blood.

Archive Status: This report is the complete genealogical and historical "Long View" requested for the Wiley-Williamson-Clay Documentary. Use the Alifair Williamson Webb portrait to represent the "Living Archive" of this 400-year journey.
                    </div>
                `
            };
            document.getElementById('v-title').innerText = key.replace('_', ' ') + " HISTORY";
            document.getElementById('v-body').innerHTML = h[key];
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
