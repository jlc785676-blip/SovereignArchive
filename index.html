<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 30px; background: #111; width: 95%; max-width: 700px; text-align: center; box-shadow: 0 0 40px rgba(212, 175, 55, 0.15); border-radius: 12px; }
        h1 { letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        input { padding: 15px; width: 65%; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        button { padding: 15px 25px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-left: 5px; }
        #output { margin-top: 30px; text-align: left; }
        .ancestor-card { background: #1a1a1a; border-left: 3px solid #444; padding: 10px 15px; margin-bottom: 8px; font-size: 0.9em; opacity: 0.7; }
        .match-card { background: #222; border-left: 5px solid #d4af37; padding: 20px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .label { color: #888; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>Sovereign Archive</h1>
        <div class="search-area">
            <input type="text" id="nameInput" placeholder="Enter Name (e.g. Oshel Chaney)">
            <button onclick="queryLineage()">TRACE</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        async function queryLineage() {
            const nameInput = document.getElementById('nameInput').value.trim();
            const output = document.getElementById('output');
            if (!nameInput) return;

            output.innerHTML = "Tracing the lineage...";

            try {
                const response = await fetch('Gedcom.txt');
                const data = await response.text();
                const records = data.split('0 @');
                
                let matchIndex = -1;
                for (let i = 0; i < records.length; i++) {
                    if (records[i].toLowerCase().includes(nameInput.toLowerCase()) && records[i].includes('1 NAME')) {
                        matchIndex = i;
                        break;
                    }
                }

                if (matchIndex !== -1) {
                    let html = '<div class="label">Ancestors Recorded Before Match:</div>';
                    
                    // Grab up to 10 records before the match
                    const start = Math.max(1, matchIndex - 10);
                    for (let j = start; j < matchIndex; j++) {
                        const ancName = records[j].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Unknown Ancestor";
                        const ancBirth = records[j].match(/2 DATE (.*)/)?.[1] || "";
                        html += `<div class="ancestor-card">${ancName} <span style="color:#666; float:right;">${ancBirth}</span></div>`;
                    }

                    // Display the main match
                    const mainName = records[matchIndex].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || nameInput;
                    const mainBirth = records[matchIndex].match(/2 DATE (.*)/)?.[1] || "No date listed";
                    html += `
                        <div class="match-card">
                            <div class="label">Target Record Unlocked:</div>
                            <h2 style="color:#fff; margin: 5px 0;">${mainName}</h2>
                            <p><strong>Vital Date:</strong> ${mainBirth}</p>
                        </div>
                    `;
                    output.innerHTML = html;
                } else {
                    output.innerHTML = "No record found. Check spelling or the master Gedcom.txt file.";
                }
            } catch (error) {
                output.innerHTML = "Error accessing Gedcom.txt. Ensure the file is correctly named and uploaded.";
            }
        }
    </script>
</body>
</html>
