<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; background-position: center 15%; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: opacity 1s ease;
        }

        .splash-overlay { 
            display: flex; justify-content: center; align-items: center; z-index: 5001; 
            gap: 20px; flex-wrap: wrap; padding: 25px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            width: 100%; box-sizing: border-box; margin-bottom: 0;
        }

        .counter-panel { background: rgba(0, 0, 0, 0.85); border: 2px solid #d4af37; padding: 10px 15px; border-radius: 8px; color: #d4af37; font-family: 'Courier New', monospace; font-size: 1em; font-weight: bold; min-width: 160px; text-align: center; }
        .signature-box { background: #000; width: 100%; text-align: center; padding: 10px 0; color: #e0c097; font-size: 0.9em; font-style: italic; z-index: 5001; border-top: 1px solid #333; }

        #main-ui { display:none; text-align: center; padding-top: 5px; }
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.9); border-bottom: 3px solid #3e2723; margin-bottom: 15px; }

        .control-row { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto 25px auto; gap: 40px; padding: 0 20px; }
        .music-panel-small { flex: 0 0 280px; background: #211510; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; }
        .search-panel-long { flex: 1; display: flex; flex-direction: column; }
        
        input[type="text"] { padding: 20px; width: 100%; background: #000; color: #fff; border: 2px solid #d4af37; border-radius: 8px; font-size: 20px; box-sizing: border-box; }

        .archive-grid { display: grid; grid-template-columns: 1fr 1.8fr 1fr; align-items: start; max-width: 1500px; margin: auto; gap: 30px; padding: 10px; }
        .side-column { display: flex; flex-direction: column; gap: 50px; }
        .family-btn-group { display: flex; align-items: center; gap: 25px; justify-content: center; }
        .family-thumb { width: 140px; height: 140px; border-radius: 8px; border: 3px solid #d4af37; object-fit: cover; }
        .central-container { position: relative; margin-top: -120px; } 
        .destiny-caption { color: #d4af37; font-weight: bold; font-size: 2.2em; margin-bottom: 25px; text-shadow: 3px 3px 6px #000; text-transform: uppercase; letter-spacing: 3px; }

        .wood-btn { padding:18px 30px; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; border:2px solid #d4af37; font-weight:bold; border-radius:8px; cursor:pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em; min-width: 180px; }
        .central-portrait { border: 5px solid #d4af37; border-radius: 12px; width: 100%; max-width: 550px; }

        @media (max-width: 900px) {
            #splash { background-size: contain; background-position: center top; }
            .splash-overlay { flex-direction: column; gap: 10px; padding: 15px; background: rgba(0,0,0,0.9); }
            .archive-grid { grid-template-columns: 1fr; }
            .central-container { order: -1; margin-top: 10px; margin-bottom: 40px; }
        }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#0a0a0a; border:2px solid #d4af37; padding:40px; border-radius:10px; text-align: left; max-width: 1100px; margin: 40px auto; }
        .history-entry { border-bottom: 1px solid #333; padding: 25px 0; color: #fff; line-height: 2.0; font-size: 1.2em; white-space: pre-wrap; }
        .history-section-title { color: #d4af37; border-bottom: 1px solid #d4af37; margin-top: 40px; margin-bottom: 15px; padding-bottom: 5px; font-size: 1.6em; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay">
            <button class="wood-btn" onclick="enterArchive()">ENTER THE SAGA</button>
            <div class="counter-panel">VISITORS: <span id="v-count">0</span></div>
        </div>
        <div class="signature-box">By Josh Chaney</div>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 2px; font-size: 2.2em;">THE SOVEREIGN ARCHIVE</h1>
        </div>

        <div class="control-row">
            <div class="music-panel-small">
                <iframe width="100%" height="150" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="search-panel-long">
                <input type="text" id="nameSearch" placeholder="Trace the bloodline history...">
                <button class="wood-btn" style="margin-top: 15px; align-self: flex-end;" onclick="trace()">TRACE FULL HISTORY</button>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-column">
                <div class="family-btn-group">
                    <img src="william_surname.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('CHANEY')">CHANEY</button>
                </div>
                <div class="family-btn-group">
                    <img src="raymond_surname.jpeg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('VANCE')">VANCE</button>
                </div>
                <div class="family-btn-group">
                    <img src="sellards.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('SELLARDS')">SELLARDS</button>
                </div>
            </div>

            <div class="central-container">
                <div class="destiny-caption">CHOOSE YOUR DESTINY</div>
                <img src="jenny_wiley_portrait.jpg" class="central-portrait">
            </div>

            <div class="side-column">
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('PERRY')">PERRY</button>
                    <img src="Jenny_wiley_ surname.jpeg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('CLAY')">CLAY</button>
                    <img src="clay.jpg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON</button>
                    <img src="williamson.jpg" class="family-thumb">
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37; border-bottom: 2px solid #d4af37; padding-bottom: 15px;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 30px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const familyData = {
            'CHANEY': {
                title: "CHANEY: THE CONQUEROR'S BLOODLINE",
                content: `<div class="history-section-title">VIKING ORIGINS</div><div class="history-entry">The line begins with Rollo of Normandy, the Viking chieftain. Through William the Conqueror, the de Quesnay (Chesney) knights entered Yorkshire in 1066.</div><div class="history-section-title">MODERN SAGA</div><div class="history-entry">From the artistry of Lon Chaney to the foundation laid by Leonard Chaney (1895–1975) and Newman Chaney (d. 2017).</div>`
            },
            'VANCE': {
                title: "VANCE: THE FRONTIER LINE",
                content: `<div class="history-section-title">SCOTCH-IRISH ROOTS</div><div class="history-entry">Originating in the lowlands and Northern Ireland, the Vance family became stalwarts of the Virginia frontier.</div><div class="history-section-title">LINEAGE</div><div class="history-entry">John Hobert Vance (1897–1968) and Arminda Vance (b. 1935) represent the bridge between the old wilderness and the modern world.</div>`
            },
            'SELLARDS': {
                title: "SELLARDS: THE SURVIVORS",
                content: `<div class="history-section-title">COLONIAL PIONEERS</div><div class="history-entry">Tracing back to Hezekiah Sellards, the family was foundational to the settlement of the Big Sandy Valley.</div><div class="history-section-title">JENNY WILEY</div><div class="history-entry">This line carries the legend of Jenny Wiley (née Sellards), a testament to the resilience and fire of the bloodline.</div>`
            },
            'PERRY': {
                title: "PERRY: THE ANCIENT CLAN",
                content: `<div class="history-section-title">BRITISH ISLES TO APPALACHIA</div><div class="history-entry">One of the longest documented maternal lines, starting with Ira Perry (1884–1974) and Sarah Perry.</div><div class="history-section-title">INDIGENOUS CONNECTION</div><div class="history-entry">Family research indicates deep ties to Indigenous heritage within the Perry bloodline, confirmed through oral histories.</div>`
            },
            'CLAY': {
                title: "CLAY: YORKSHIRE TO COLONIAL VIRGINIA",
                content: `<div class="history-section-title">ENGLISH ORIGINS</div><div class="history-entry">The Clay lineage traces back to Yorkshire estates, migrating through the Colonial Virginia land patents of the 1700s.</div><div class="history-section-title">PIONEERS</div><div class="history-entry">Thomas John Clay and Clara Davis (1887–1974) carried the line westward into the Ohio valley.</div>`
            },
            'WILLIAMSON': {
                title: "WILLIAMSON: THE MASTER SCROLL",
                content: `<div class="history-section-title">WESTWARD MIGRATION</div><div class="history-entry">The Williamsons were key figures in the migration patterns from Virginia through Kentucky.</div><div class="history-section-title">HISTORICAL CONTEXT</div><div class="history-entry">Linked through marriage to the Perry and Clay branches, completing the Sovereign Archive's master grid.</div>`
            }
        };

        function updateCounter() {
            let count = localStorage.getItem('visitorCount') || 15248;
            count = parseInt(count) + 1;
            localStorage.setItem('visitorCount', count);
            document.getElementById('v-count').innerText = count.toLocaleString();
        }
        window.onload = updateCounter;

        function enterArchive() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 1000);
        }

        function openArchive(key) {
            const data = familyData[key];
            document.getElementById('v-title').innerText = data.title;
            document.getElementById('v-body').innerHTML = data.content;
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function trace() {
            const q = document.getElementById('nameSearch').value.toUpperCase().trim();
            if (familyData[q]) { openArchive(q); }
            else { alert("Surname not found in current Master Archive."); }
        }
    </script>
</body>
</html>
