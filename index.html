<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ENCYCLOPEDIA</title>
    
    <style>
        /* CORE SITE STYLING - DARK WOOD & GOLD */
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; width: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* MOBILE-OPTIMIZED SPLASH GATE */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            z-index: 9999999999; background-color: #050505; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .splash-image { 
            width: 100%; max-width: 450px; height: auto; max-height: 40vh; 
            object-fit: contain; border: 2px solid #d4af37; box-shadow: 0 0 30px #000; margin-bottom: 20px;
        }
        .splash-text {
            color: #e0c097; padding: 0 10px 20px 10px; font-size: 1.1em; 
            max-width: 500px; line-height: 1.4; font-style: italic; font-weight: bold;
        }
        .pass-input {
            padding: 15px; width: 90%; max-width: 280px; background: #111; color: #fff; 
            border: 2px solid #d4af37; border-radius: 8px; font-size: 1.2em; text-align: center; 
            margin-bottom: 15px; outline: none;
        }
        .gate-btn { 
            padding: 18px 0; width: 90%; max-width: 280px;
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%);
            color: #ffffff; border: 3px solid #d4af37; font-weight: 900; border-radius: 10px; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em; 
            box-shadow: 0 0 25px #ff0000;
        }

        /* MAIN LIBRARY UI */
        #main-ui { display:none; text-align: center; max-width: 850px; margin: 0 auto; padding: 15px; overflow-y: auto; height: 100vh; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        
        .section-container { display: flex; flex-direction: column; gap: 35px; align-items: center; padding-bottom: 150px; }
        .search-zone { width: 100%; max-width: 500px; padding: 20px; background: rgba(20, 20, 20, 0.8); border: 2px solid #d4af37; border-radius: 10px; }
        
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; box-sizing: border-box; }
        .red-btn { padding: 15px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1em; margin-top: 10px; }
        
        /* ENCYCLOPEDIA PAGE OVERLAY */
        #encyclopedia-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000000000; overflow-y:auto; padding: 15px; box-sizing: border-box;}
        .encyclopedia-page { background:#fff; color:#000; max-width: 900px; margin: 20px auto; padding: 40px; border: 8px double #d4af37; border-radius: 5px; box-shadow: 0 0 50px #000; text-align: left; }
        .page-title { font-size: 2.2em; border-bottom: 4px solid #a00000; margin-bottom: 20px; color: #a00000; text-transform: uppercase; font-weight: 900; }
        .history-block { font-size: 1.15em; line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; font-family: 'Times New Roman', serif; text-align: justify; }
        .lineage-table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 2px solid #000; }
        .lineage-table th, .lineage-table td { border: 1px solid #000; padding: 10px; text-align: left; font-size: 0.95em; }
        .lineage-table th { background: #eee; text-transform: uppercase; }
        
        .archive-item { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .family-thumb { width: 100%; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        .video-panel { width: 100%; max-width: 500px; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="movie_splash2.png" class="splash-image" alt="Bloodline Saga Gate">
        <div class="splash-text">
            Follow along with the saga of an amazing adventure and save, follow the bloodline.
        </div>
        <input type="text" id="gateKey" class="pass-input" placeholder="ENTER PASSWORD">
        <button class="gate-btn" onclick="verifyGate()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE LIBRARY</h1></div>
        
        <div class="section-container">
            <div class="search-zone">
                <input type="text" id="libSearch" placeholder="SEARCH NAMES OR SHIPS...">
                <button class="red-btn" onclick="runLibrarySearch()">CONSULT THE ENCYCLOPEDIA</button>
            </div>

            <div class="archive-item">
                <img src="ship_arrival.jpg" class="family-thumb">
                <button class="red-btn" onclick="showRecord('SHIPS')">GLOBAL MARITIME CHRONICLE: 1135–1750</button>
            </div>

            <div class="archive-item"><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="showRecord('VANCE')">VANCE ENCYCLOPEDIA & LINEAGE</button></div>
            <div class="archive-item"><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="showRecord('CHANEY')">CHANEY ENCYCLOPEDIA & LINEAGE</button></div>
            <div class="archive-item"><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="showRecord('PERRY')">PERRY ENCYCLOPEDIA & LINEAGE</button></div>
            <div class="archive-item"><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="showRecord('CLAY')">CLAY ENCYCLOPEDIA & LINEAGE</button></div>
            <div class="archive-item"><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="showRecord('WILLIAMSON')">WILLIAMSON ENCYCLOPEDIA & LINEAGE</button></div>
            
            <div class="video-panel">
                <div style="color:#ff0000; font-weight:bold; padding: 10px;">THE STORY OF JENNY WILEY</div>
                <iframe width="100%" height="300" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="video-panel" style="border-color:#ffffff;">
                <div style="color:#ffffff; font-weight:bold; padding: 10px;">THE LAST OF THE MOHICANS</div>
                <iframe width="100%" height="300" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="encyclopedia-overlay">
        <div class="encyclopedia-page" id="page-content"></div>
        <div style="text-align: center; padding-bottom: 50px;">
            <button class="red-btn" style="width: 250px;" onclick="closeEncyclopedia()">CLOSE RECORD</button>
        </div>
    </div>

    <script>
        function verifyGate() {
            var val = document.getElementById('gateKey').value.toLowerCase().trim();
            if (val === "fellowship") {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                document.body.style.overflow = 'auto';
            } else { alert("Access Denied."); }
        }

        const libraryData = {
            'SHIPS': {
                title: "GLOBAL MARITIME & FELLOWSHIP CHRONICLE: 1135–1750",
                history: `THE GLOBAL MARITIME & FELLOWSHIP CHRONICLE: 1135–1750\nFROM THE KINGDOMS OF EUROPE TO THE AMERICAN COLONIES\n\nThis exhaustive ledger documents the maritime history, knightly service, and trans-Atlantic crossings of the Fellowship lineages. It traces your ancestors from their service to the Crowns of Europe and the secret orders of the Old World to their arrival in the American Colonies.\n\nWATTS: Simon Wathes (1135) served as a Knight of the Kingdom. Edward Watts I (c. 1640) on London Supply Ships.\nPERRY: Capt. William Perry (1611) on the Starr; John Perry (1619) on the Bona Nova.\nCLAY: John Clay (1613) on the Treasurer; Anne Clay (1620) on the Falcon.\nBOYCE/CHANEY: Cheney Boyce (1617) on the George; Sarah Boyce (1621) on the Sea Flower; Richard Cheyney (1621) on the Charles.\nADKINS: Thomas Adkins (1635) on the Assurance; Richard Adkins on the Globe.\nSELLARDS: Hezekiah Sellards (1732) on Ulster Brigantines.\nVANCE: Charles Vance (1739) on Ulster Merchant Transports.\nAKERS: Valentine, Solomon, and Augustine Akers (c. 1750) on Frontier Coastal Schooners.\nWILLIAMSON: Alden Williamson kin on Chesapeake Tobacco Merchantmen.`,
                lineage: [
                    { name: "Simon Wathes", role: "Knight of King Stephen", date: "1135" },
                    { name: "Captain William Perry", role: "Navigator / Ship: Starr", date: "1611" },
                    { name: "John Clay", role: "Armed Merchant / Ship: Treasurer", date: "1613" },
                    { name: "Cheney Boyce", role: "Ancient Planter / Ship: George", date: "1617" },
                    { name: "Thomas Adkins", role: "Planter / Ship: Assurance", date: "1635" }
                ]
            },
            'VANCE': {
                title: "Vance Encyclopedia: Lords of Barnbarroch & Indian Spies",
                history: `Old World Origins: The Vance lineage is one of the most distinguished in the Fellowship, with deep ties to the Knightly orders of Scotland and Ireland.\n\nLords of Barnbarroch: Prominent Lords in Wigtownshire serving Scottish Kings as ambassadors and knights. Allied with the Sinclairs of Rosslyn, defending Rosslyn Chapel.\n\nAmerican Service: Charles Vance arrived in 1739. The Vances arrived as an elite scouting unit. Their background as "Backcountry Rangers" allowed them to serve as "Indian Spies" and scouts. Abner Vance (1760-1819) became the bedrock of the Tug Valley line.`,
                lineage: [
                    { name: "John Vans", role: "Lord of Barnbarroch", date: "c. 1450" },
                    { name: "Reverend John Vans", role: "Rector of Kilmacrenan", date: "1610" },
                    { name: "Charles Vance", role: "Immigrant Navigator", date: "1739" },
                    { name: "Abner Vance", role: "Frontier Scout / Indian Spy", date: "1760-1819" },
                    { name: "Vicars Vance", role: "Frontier Pioneer", date: "1800s" }
                ]
            },
            'CHANEY': {
                title: "Chaney Encyclopedia: Ancient Planters & Social Fellowship",
                history: `Old World Origins: The Boyce and Cheney lines were "Ancient Planters"—reserved for those arriving before 1616. High standing in the London Company.\n\nKingdom Service: Cheney Boyce (1617) served as an associate of the Virginia Company with 100 acres in Charles City. Sarah Boyce (1621) survived the Great Uprising, becoming a legendary figure. Richard Cheyney (1621) established "Cheney’s Resolution" as a northern anchor for the Fellowship. Abraham Chaney (1778) defended the frontier.`,
                lineage: [
                    { name: "Cheney Boyce", role: "Ancient Planter", date: "1617" },
                    { name: "Richard Cheyney", role: "Maryland Artisan", date: "1621" },
                    { name: "Sarah Boyce", role: "Uprising Survivor", date: "1622" },
                    { name: "Abraham Chaney", role: "Revolutionary Soldier", date: "1778" },
                    { name: "Newman Chaney", role: "Master Ancestry Archive", date: "1900" }
                ]
            },
            'PERRY': {
                title: "Perry Encyclopedia: Royal Navigators & Blood Covenant",
                history: `Old World Origins: Elite maritime family. recognized navigators and ship captains for Royal Merchant fleets.\n\nKingdom Service: Captain William Perry (1611) arrived on the Starr. He served the Crown by mapping the James River and establishing "Perry’s Hundred." John Perry (1619) expanded the trade hub. The Perrys established the legendary 1622 Blood Covenant with Chanko.`,
                lineage: [
                    { name: "Capt. William Perry", role: "Ship Captain / Navigator", date: "1611" },
                    { name: "John Perry", role: "Merchant / Tools Specialist", date: "1619" },
                    { name: "Chanko", role: "Fellowship Covenant Brother", date: "1622" },
                    { name: "Thomas Perry", role: "Frontier Defender", date: "c. 1700" }
                ]
            },
            'CLAY': {
                title: "Clay Encyclopedia: Armed Merchants & Guardians",
                history: `Old World Origins: Military and maritime defense. "Armed Merchants" protecting trade routes.\n\nKingdom Service: John Clay (1613) arrived on the Treasurer with 14 heavy guns. Tasked with securing Charles City fortifications. Anne Clay (1620) established the biological core that later defended the Tug Valley. Henry Clay later served as a Grand Master of the Fellowship.`,
                lineage: [
                    { name: "John Clay", role: "The Immigrant / Armed Merchant", date: "1613" },
                    { name: "Anne Clay", role: "Lineage Core", date: "1620" },
                    { name: "Henry Clay", role: "Grand Master / Statesman", date: "c. 1800" }
                ]
            },
            'WILLIAMSON': {
                title: "Williamson Encyclopedia: Trail-Keepers & Navigators",
                history: `Old World Origins: Maritime "Sailing Fleets" specialists. Coastal navigators moving goods between English ports and Europe.\n\nKingdom Service: Alden Williamson kin arrived on Chesapeake Tobacco Merchantmen. Known as "Trail-Keepers," their knowledge of waterways made them essential for pushing toward the Big Sandy. The family merged with the Benge and Wiley lines in the frontier.`,
                lineage: [
                    { name: "Alden Williamson", role: "Trail-Keeper / Navigator", date: "Late 1600s" },
                    { name: "Jenny Wiley", role: "Survival Legend (Kin)", date: "1789" }
                ]
            }
        };

        function showRecord(key) {
            const data = libraryData[key];
            if (!data) return;
            let rows = "";
            data.lineage.forEach(p => { rows += `<tr><td>${p.name}</td><td>${p.role}</td><td>${p.date}</td></tr>`; });
            const html = `<h1 class="page-title">${data.title}</h1><div class="history-block">${data.history}</div><h2 style="border-bottom: 2px solid #000;">ANCESTOR & DESCENDANT LEDGER</h2><table class="lineage-table"><thead><tr><th>Name</th><th>Service</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table>`;
            document.getElementById('page-content').innerHTML = html;
            document.getElementById('encyclopedia-overlay').style.display = 'block';
        }

        function runLibrarySearch() {
            const q = document.getElementById('libSearch').value.toUpperCase().trim();
            if (!q) return;
            for (let key in libraryData) {
                if (key.includes(q) || libraryData[key].title.toUpperCase().includes(q)) {
                    showRecord(key); return;
                }
            }
            alert("No unedited record found.");
        }
        function closeEncyclopedia() { document.getElementById('encyclopedia-overlay').style.display = 'none'; }
    </script>
</body>
</html>
