<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 35px; background: #111; width: 95%; max-width: 650px; text-align: center; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); border-radius: 12px; }
        h1 { letter-spacing: 5px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 15px; margin-bottom: 25px; }
        .search-area { margin-bottom: 30px; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1.1em; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 15px 30px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
        
        #output { text-align: left; background: #050505; padding: 25px; border-left: 5px solid #d4af37; border-radius: 4px; display: none; }
        .report-header { font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        .data-block { color: #ccc; font-family: 'Courier New', monospace; white-space: pre-wrap; font-size: 0.85em; line-height: 1.4; max-height: 450px; overflow-y: auto; background: #000; padding: 15px; border: 1px solid #222; }
        .label { color: #d4af37; font-weight: bold; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>Sovereign Archive</h1>
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Enter First or Last Name">
            <button onclick="queryArchive()">Query</button>
        </div>

        <div id="output">
            <div class="report-header">Heritage Records Unlocked</div>
            <span class="label" id="resTitle"></span>
            <div class="data-block" id="dataContent"></div>
        </div>
    </div>

    <script>
        async function queryArchive() {
            const searchName = document.getElementById('nameIn').value.trim();
            const output = document.getElementById('output');
            const content = document.getElementById('dataContent');
            const title = document.getElementById('resTitle');

            if (!searchName) return;
            output.style.display = 'block';
            content.innerText = "Scanning lineage for matches...";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const lines = text.split('\n');
                
                let resultsFound = false;
                let fullDisplay = "";

                // This loop checks every line for a match
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].toLowerCase().includes(searchName.toLowerCase())) {
                        resultsFound = true;
                        // Pull 30 lines of context for each match found
                        const start = Math.max(0, i - 25); 
                        const end = Math.min(lines.length, i + 5);
                        const snippet = lines.slice(start, end).join('\n');
                        
                        fullDisplay += `--- RECORD SEGMENT ---\n${snippet}\n\n`;
                        
                        // Limit to first 3 matches to keep the screen clean
                        if (fullDisplay.split('--- RECORD SEGMENT ---').length > 4) break;
                    }
                }

                if (resultsFound) {
                    title.innerText = "Displaying History for: " + searchName.toUpperCase();
                    content.innerText = fullDisplay;
                } else {
                    title.innerText = "No Records Found";
                    content.innerText = "The name '" + searchName + "' was not found. Try searching for a maiden name or an alternate spelling.";
                }
            } catch (err) {
                content.innerText = "System Error: Ensure Gedcom.txt is named correctly and uploaded to GitHub.";
            }
        }
    </script>
</body>
</html>
