<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    
    <script>
        // THE GATE KEEPER - ENSURES SPLASH WORKS EVERY TIME
        function playGateAction() {
            var splash = document.getElementById('splash');
            var ui = document.getElementById('main-ui');
            if (splash) {
                splash.style.opacity = '0';
                splash.style.pointerEvents = 'none';
                setTimeout(function() { 
                    splash.style.display = 'none'; 
                    if (ui) {
                        ui.style.display = 'block'; 
                        setTimeout(function() { 
                            ui.style.opacity = '1'; 
                            document.body.style.overflow = 'auto'; 
                        }, 50);
                    }
                }, 500);
            }
        }

        // THE MASTER DATA REPOSITORY (EVERY WORD PRESERVED)
        const archiveData = {
            'SHIPS': `<strong>ANCESTORS; SAILING SHIP TO THE AMERICAS</strong><br><br>
                      <ul>
                        <li><strong>1611: The Ship Starr</strong> - Carried Captain William Perry (Navigator) to the James River settlements.</li>
                        <li><strong>1613: The Ship Treasurer</strong> - Carried John Clay (The Immigrant), an "Ancient Planter."</li>
                        <li><strong>1617: The Ship George</strong> - Carried Cheney Boyce, neighbor to the Perry and Clay estates.</li>
                        <li><strong>1619: The Ship Bona Nova</strong> - Carried John Perry, brother of William.</li>
                        <li><strong>1620: The Ship Falcon</strong> - Carried Anne Clay to join her husband in the Virginia Fellowship.</li>
                        <li><strong>1621: The Ship Charles</strong> - Carried the associated kin of Richard Cheyney.</li>
                      </ul>`,
            
            'PERRY': `<strong>I. THE PERRY LINEAGE: THE NAVIGATORS & THE COVENANT</strong><br><br>
                      <strong>Domain: Trade, Diplomacy, and the Spirit of Adoption.</strong><br>
                      <ul>
                        <li><strong>1611 (Arrival):</strong> Captain William Perry arrives on the <strong>Starr</strong>. He maps the early James River settlements.</li>
                        <li><strong>1622 (Conflict):</strong> The Jamestown Uprising. The Perry household is saved by <strong>Chanko</strong>, the Native boy who warned the colony.</li>
                        <li><strong>1624 (Fellowship):</strong> William Perry petitions to adopt Chanko as his son, establishing the line's first <strong>Blood Covenant</strong>.</li>
                        <li><strong>1774 (Conflict):</strong> George Pearis (Perry) serves as a lieutenant in Lord Dunmore’s War.</li>
                        <li><strong>1780s (Blood):</strong> George Pearis marries <strong>Rebecca Clay</strong>, uniting the two powerful frontier lineages.</li>
                        <li><strong>1835 (Records):</strong> Robin Perry is documented on the Cherokee Census Roll (Grant Foreman Archive).</li>
                        <li><strong>Post-1930:</strong> Erma Perry Keener is born, merging the "Trader" line into the modern era.</li>
                      </ul>`,

            'CLAY': `<strong>II. THE CLAY LINEAGE: THE GUARDIANS & THE BLOOD PRICE</strong><br><br>
                     <strong>Domain: Physical Defense, Land Law, and the Masonic Shield.</strong><br>
                     <ul>
                        <li><strong>1613 (Arrival):</strong> John Clay arrives on the <strong>Treasurer</strong>. Recognized as an "Ancient Planter."</li>
                        <li><strong>1676 (Conflict):</strong> Charles Clay fights in <strong>Bacon’s Rebellion</strong>, moving the line toward the mountain frontier.</li>
                        <li><strong>1774 (Conflict):</strong> Mitchell Clay fights Chief Cornstalk at the Battle of Point Pleasant.</li>
                        <li><strong>1783 (Casualty):</strong> The <strong>Clover Bottom Massacre</strong>. Bartley and Tabitha Clay killed; Ezekiel Clay kidnapped and executed.</li>
                        <li><strong>1820s (Fellowship):</strong> Henry Clay serves as Grand Master of Masons in KY, using the Lodge for tribal sovereignty.</li>
                        <li><strong>1860s (Conflict):</strong> The Clay brothers serve in <strong>Stand Watie’s</strong> Cherokee Mounted Rifles.</li>
                        <li><strong>1864 (Casualty):</strong> Clay ancestors die in Texas defending Cherokee borders.</li>
                     </ul>`,

            'CHANEY': `<strong>III. THE CHANEY (CHENEY) LINEAGE: THE COVENANT SURVIVORS</strong><br><br>
                       <strong>Domain: Social Identity, Fortification, and Loyalty.</strong><br>
                       <ul>
                        <li><strong>1617 (Arrival):</strong> Cheney Boyce arrives on the <strong>George</strong>. Peer to William Perry.</li>
                        <li><strong>1622 (Kidnapping):</strong> Sarah Boyce kidnapped by Powhatan warriors; returns as a "Queen" in Native regalia.</li>
                        <li><strong>1778 (Conflict):</strong> Abraham Chaney drafted to guard <strong>Hatfield’s Fort</strong> on the New River.</li>
                        <li><strong>1800s (Fellowship):</strong> The "Fellowship Chaneys" (Social Chaneys) established in Pike County hollows.</li>
                        <li><strong>1900:</strong> Newman Chaney becomes steward of the family history.</li>
                        <li><strong>Josh Chaney (1978):</strong> Direct descendant and keeper of this Master Archive.</li>
                       </ul>`,

            'VANCE': `<strong>IV. THE VANCE LINEAGE: THE SCOUTS & THE SPIES</strong><br><br>
                      <strong>Domain: Woodcraft, Guerrilla Warfare, and Tribal Integration.</strong><br>
                      <ul>
                        <li><strong>1756 (Conflict):</strong> Ephraim Vance defends <strong>Fort Vause</strong> (Vance); fort destroyed by French/Shawnee forces.</li>
                        <li><strong>1760–1819 (Fellowship):</strong> Abner Vance, legendary <strong>"Indian Spy"</strong> (Scout) and master of the Warrior's Path.</li>
                        <li><strong>Blood:</strong> Line linked to the <strong>Cherokee Wolf Clan</strong>. Vance is the Anglicized version of Vann.</li>
                        <li><strong>1819 (Conflict):</strong> Abner Vance executed by the state; solidifies mountain Fellowship against Eastern law.</li>
                      </ul>`,

            'WILLIAMSON': `<strong>V. THE WILLIAMSON & WILEY LINEAGE: THE BLOOD COVENANT</strong><br><br>
                            <strong>Domain: Survival, Tribal Blood, and Oral Tradition.</strong><br>
                            <ul>
                                <li><strong>1774:</strong> Alden Williamson serves at the Battle of Point Pleasant.</li>
                                <li><strong>1789 (Casualty):</strong> The <strong>Walker’s Creek Raid</strong>. Jenny Wiley kidnapped; 4 children killed.</li>
                                <li><strong>1790 (Blood):</strong> Jenny Wiley held by <strong>Chief Bob Benge</strong>. Returns pregnant with Mary Jane Wiley.</li>
                                <li><strong>1800s:</strong> Mary Jane Wiley marries Richard Williamson, merging the Benge and Williamson lines.</li>
                            </ul>`,

            'SELLARDS': `<strong>THE SELLARDS FELLOWSHIP & THE WILEY LEGACY</strong><br><br>
                          <ul>
                            <li><strong>Hezekiah Sellards:</strong> Founder of the line and source of the Jenny Wiley saga.</li>
                            <li><strong>Captivity Ordeal:</strong> Jenny Sellards Wiley’s 11-month survival is the defining anchor of the line.</li>
                            <li><strong>Biological Fellowship:</strong> The merger of Sellards and Cherokee bloodlines through the Chief Benge era.</li>
                          </ul>`,

            'INDIAN_CHRONO': `<strong>THE MASTER CHRONICLE ARCHIVE: 1611–1930</strong><br><br>
                              This exhaustive ledger links arrival ships, military engagements, and Fellowship events.<br><br>
                              <strong>MASONIC UNIVERSAL FELLOWSHIP:</strong><br>
                              <ul>
                                <li><strong>Tecumseh (1813):</strong> Recognized the Masonic Fellowship at Fort Meigs to save prisoners.</li>
                                <li><strong>Stand Watie:</strong> Royal Arch Mason and General who protected tribal sovereignty.</li>
                                <li><strong>Ely S. Parker:</strong> Seneca Chief and Mason who drafted the Civil War surrender.</li>
                              </ul><br>
                              <strong>Archive Status: Complete. Heart on Fire.</strong>`,

            'INDIAN_LEGENDS': `<strong>INDIAN LEGENDS & TRIBAL TIES</strong><br><br>
                               Oral histories from the Perry, Sellards, and Vance lines regarding the hidden wisdom of the Cherokee and Shawnee nations.`
        };

        function openArchive(key) {
            document.getElementById('v-title').innerText = key.replace(/_/g, ' ') + " LEDGER";
            document.getElementById('v-body').innerHTML = archiveData[key];
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function trace(type) {
            let q = (type === 'indian') ? document.getElementById('indianSearch').value.toLowerCase().trim() : document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            let results = "";
            for (let key in archiveData) {
                if (archiveData[key].toLowerCase().includes(q)) {
                    results += "<div style='margin-bottom:20px; border-bottom:1px solid #ddd; padding-bottom:10px;'>" + archiveData[key] + "</div>";
                }
            }
            document.getElementById('v-title').innerText = "SEARCH RESULTS: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = results || "No specific record match found for '" + q + "'. Please check surname buttons for full chronologies.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>

    <style>
        html, body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; height: 100%; overflow: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; z-index:999998; background-color: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .splash-image { width: 95%; max-width: 1400px; height: auto; border: 2px solid #d4af37; box-shadow: 0 0 50px #000; pointer-events: none; }
        .gate-btn { margin-top: 25px; padding: 15px 45px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png'); color: #ffffff; border: 2px solid #d4af37; font-weight: 900; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; font-size: 1.2em; z-index: 999999; position: relative; }
        .gate-btn:hover { background: #ff0000; box-shadow: 0 0 30px #ff0000; }

        #main-ui { display:none; text-align: center; max-width: 800px; margin: 0 auto; opacity: 0; transition: opacity 0.6s ease; padding: 15px; overflow-y: auto; height: 100vh; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        
        .section-container { display: flex; flex-direction: column; gap: 30px; align-items: center; padding-bottom: 100px; }
        .archive-item { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .family-thumb { width: 100%; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        .search-group { width: 100%; max-width: 500px; margin: 10px 0; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; box-sizing: border-box; }
        .red-btn { padding: 15px 30px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png'); color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .video-panel { width: 100%; max-width: 500px; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 10px 0; box-shadow: 0 10px 30px #000; }

        /* THE CLEAN VAULT - WHITE BACKGROUND, BOLD BLACK TEXT */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999999; overflow-y:auto; padding: 20px; }
        .vault-content { background:#ffffff; border:6px solid #d4af37; padding:25px; border-radius:10px; text-align: left; max-width: 900px; margin: 20px auto; color: #000000; box-shadow: 0 0 50px #ff0000; }
        .vault-title-box { color: #ff0000; font-size: 1.8em; border-bottom: 3px solid #ff0000; margin-bottom: 20px; text-transform: uppercase; font-weight: 900; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="movie_splash.png" class="splash-image">
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="section-container">
            <div class="search-group"><input type="text" id="nameSearch" placeholder="SEARCH ANCESTRY..."><button class="red-btn" style="margin-top:10px;" onclick="trace('main')">SEARCH ARCHIVE</button></div>

            <div class="archive-item"><img src="ship_arrival.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SHIPS')">Ancestors; SailingShip to the Americas</button></div>

            <div class="archive-item">
                <h2 style="color:#ff0000; margin: 0;">INDIAN HERITAGE RESEARCH</h2>
                <div class="search-group"><input type="text" id="indianSearch" placeholder="SEARCH TRIBAL TIES..."><button class="red-btn" style="margin-top:10px;" onclick="trace('indian')">SEARCH TRIBAL RECORDS</button></div>
                <div style="border: 3px solid #d4af37; padding: 10px; background: rgba(0,0,0,0.7);"><img src="Indians_search.png" style="width:100%; height:auto;"></div>
                <button class="red-btn" style="margin-top:10px;" onclick="openArchive('INDIAN_LEGENDS')">INDIAN LEGENDS</button>
                <button class="red-btn" style="background: linear-gradient(135deg, #ff0000, #8b0000); border: 2px solid #ffffff; margin-top:10px;" onclick="openArchive('INDIAN_CHRONO')">GENERATE INDIAN CHRONOLOGICAL REPORT</button>
            </div>

            <div class="archive-item"><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
            <div class="archive-item"><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
            <div class="archive-item"><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
            <div class="archive-item"><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
            <div class="archive-item"><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
            <div class="archive-item"><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>

            <div class="video-panel"><div style="color:#ff0000; font-weight:bold; margin-bottom:10px;">THE STORY OF JENNY WILEY</div><iframe width="100%" height="300" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe></div>
            <div class="video-panel" style="border-color:#ff0000;"><div style="color:#ffffff; font-weight:bold; margin-bottom:10px;">LAST OF THE MOHICANS</div><iframe width="100%" height="200" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe></div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <div id="v-title" class="vault-title-box"></div>
            <div id="v-body" class="ledger-text"></div>
            <button class="red-btn" style="margin-top: 30px; width: 100%; border: 3px solid #000;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN TO ARCHIVE</button>
        </div></div>
    </div>
</body>
</html>
