<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* REBUILT SPLASH - LARGER IMAGE, SMALLER BUTTON */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:10000; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }

        .splash-art-frame { 
            width: 100%; 
            max-width: 1400px; 
            display: flex;
            justify-content: center;
            pointer-events: none; 
        }
        .splash-image { width: 100%; height: auto; display: block; }

        .gate-btn { 
            position: absolute; 
            bottom: 50px; 
            padding: 12px 30px; 
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), 
                        url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; 
            border: 2px solid #d4af37;
            font-weight: 900; border-radius: 6px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1em;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4); 
            text-shadow: 1px 1px #000;
            transition: all 0.2s ease-in-out;
            z-index: 10001; 
            pointer-events: auto;
        }
        .gate-btn:hover { background: #ff0000; box-shadow: 0 0 20px #ff0000; }

        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px;
            overflow-y: auto; height: 100vh;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; }
        
        .red-btn {
            padding: 15px 40px; 
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), 
                        url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 3px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        .video-panel { width: 100%; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 20px 0; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:11000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1000px; margin: 30px auto; color: #e0c097; }
        .chrono-text { font-size: 1.15em; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame">
            <img src="movie_splash.png" class="splash-image">
        </div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ERMA, ROLLO, ALDEN, JOSH...">
                    <button class="red-btn" onclick="trace('main')">SEARCH ANCESTRY REPORT</button>
                </div>

                <div class="video-panel">
                    <div style="color:#ff0000; font-weight:bold; margin-bottom:10px;
