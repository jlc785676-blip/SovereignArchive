<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMA PERRY ANCESTORS: MASTER VAULT</title> 
    <style>
        /* Widened the page for a more cinematic feel */
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 40px 20px; }
        
        .vault-container { 
            border: 2px solid #d4af37; 
            padding: 50px; 
            background: #111; 
            width: 100%; 
            max-width: 1100px; /* Increased width */
            text-align: center; 
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.25); 
            border-radius: 15px; 
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        h1 { letter-spacing: 6px; text-transform: uppercase; border-bottom: 2px solid #d4af37; padding-bottom: 20px; margin-bottom: 15px; font-size: 2.5em; color: #d4af37; }
        .subtitle { color: #888; font-style: italic; font-size: 1.1em; margin-bottom: 40px; letter-spacing: 2px; }
        
        .search-area { margin-bottom: 50px; display: flex; gap: 15px; justify-content: center; }
        input { padding: 20px; width: 70%; background: #000; border: 1px solid #444; color: #fff; border-radius: 10px; font-size: 1.2em; outline: none; transition: 0.3s; }
        input:focus { border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        
        button { padding: 20px 45px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; text-transform: uppercase; font-size: 1em; transition: 0.4s; }
        button:hover { background: #fff; box-shadow: 0 0 30px #d4af37; transform: translateY(-2px); }

        #output { text-align: left; }
        
        /* Heritage cards for the 30 ancestors */
        .ancestor-card { 
            background: #161616; 
            border-left: 4px solid #333; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 0 10px 10px 0; 
            transition: 0.3s;
            opacity: 0.85;
        }
        .ancestor-card:hover { border-left-color: #d4af37; background: #1c1c1c; opacity: 1; }

        /* Highlight card for the searched person */
        .target-card { 
            background: #222; 
            border: 1px solid #d4af37; 
            border-left: 10px solid #d4af37; 
            padding: 35px; 
            border-radius: 10px; 
            margin-top: 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
        }

        .label { color: #d4af37; font-size: 0.75em; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 8px; }
        .person-name { color: #fff; font-size: 1.3em; font-weight: bold; }
        .details { color: #aaa; font-size: 1em; margin-top: 8px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>ERMA PERRY ANCESTORS</h1> 
        <div class="subtitle">A Deep-Query Archive of the Chaney, Perry, & Vance Bloodlines</div>
        
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Search Ancestor Name (e.g., Oshel, Erma, Josh)">
            <button onclick="traceAncestry()">Unlock Lineage</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        async function traceAncestry() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center; color:#d4af37;'>Scanning 30 generations of history...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                
                let matchIdx = -1;
                for (let i = 0; i < records.length; i++) {
                    if (records[i].toLowerCase().includes(query) && records[i].includes('1 NAME')) {
                        matchIdx = i;
                        break;
                    }
                }

                if (matchIdx !== -1) {
                    let htmlData = '<div style="color:#666; text-align:center; margin-bottom:30px; letter-spacing:2px;">— PRECEDING ANCESTORS RECORDED IN ARCHIVE —</div>';
                    
                    // Pull 30 ancestors listed BEFORE the match
                    const start = Math.max(1, matchIdx - 30);
                    for (let j = start; j < matchIdx; j++) {
                        const name = records[j].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Ancestor";
                        const vital = records[j].match(/2 DATE (.*)/)?.[1] || "Date Not Listed";
                        const place = records[j].match(/2 PLAC (.*)/)?.[1] || "";
                        
                        htmlData += `
                            <div class="ancestor-card">
                                <span class="label">Lineage Record</span>
                                <span class="person-name">${name}</span>
                                <div class="details">${vital} ${place ? ' | ' + place : ''}</div>
                            </div>`;
                    }

                    // Display the Search Result
                    const targetName = records[matchIdx].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || query.toUpperCase();
                    const targetVital = records[matchIdx].match(/2 DATE (.*)/)?.[1] || "Date Protected";
                    const targetPlace = records[matchIdx].match(/2 PLAC (.*)/)?.[1] || "";
                    const targetNotes = [...records[matchIdx].matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('<br>');

                    htmlData += `
                        <div class="target-card">
                            <span class="label" style="color:#d4af37;">PRIMARY LINEAGE TARGET</span>
                            <span class="person-name" style="font-size:1.8em; color:#d4af37;">${targetName.toUpperCase()}</span>
                            <div class="details" style="color:#fff; font-size:1.2em;">${targetVital}</div>
                            <div class="details" style="color:#888;">${targetPlace}</div>
                            <div class="details" style="margin-top:20px; font-style:italic; border-top:1px solid #333; padding-top:15px;">${targetNotes}</div>
                        </div>`;

                    output.innerHTML = htmlData;
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    output.innerHTML = "<p style='text-align:center;'>No record found for '" + query + "'. Try a different name.</p>";
                }
            } catch (err) {
                output.innerHTML = "<p style='text-align:center;'>System Error: Check Gedcom.txt link.</p>";
            }
        }
    </script>
</body>
</html>
