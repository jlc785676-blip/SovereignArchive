<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    
    <script>
        function playGateAction() {
            var splash = document.getElementById('splash');
            var ui = document.getElementById('main-ui');
            if (splash) {
                splash.style.opacity = '0';
                splash.style.pointerEvents = 'none';
                setTimeout(function() { 
                    splash.style.display = 'none'; 
                    if (ui) {
                        ui.style.display = 'block'; 
                        setTimeout(function() { 
                            ui.style.opacity = '1'; 
                            document.body.style.overflow = 'auto'; 
                        }, 50);
                    }
                }, 500);
            }
        }
    </script>

    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* STABILIZED SPLASH PAGE */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:999998; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
            visibility: visible;
        }
        .splash-art-frame { width: 100%; max-width: 1400px; display: flex; justify-content: center; pointer-events: none; }
        .splash-image { width: 95%; height: auto; display: block; border: 2px solid #d4af37; box-shadow: 0 0 50px #000; }

        .gate-btn { 
            margin-top: 25px; padding: 15px 45px; 
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 3px solid #d4af37; font-weight: 900; border-radius: 6px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 3px; font-size: 1.2em; 
            z-index: 999999; position: relative; transition: all 0.2s ease;
        }
        .gate-btn:hover { background: #ff0000; box-shadow: 0 0 30px #ff0000; transform: scale(1.05); }

        /* MAIN UI - FULL CONTENT RETAINED */
        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px; overflow-y: auto; height: 100vh;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; box-sizing: border-box; }
        
        .red-btn {
            padding: 15px 40px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        .video-panel { width: 100%; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 20px 0; box-shadow: 0 10px 30px #000; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:30000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1100px; margin: 30px auto; color: #e0c097; }
        .ledger-text { font-size: 1.15em; line-height: 1.7; white-space: pre-wrap; color: #e0c097; }
        .ledger-title { color: #ff0000; font-size: 1.8em; border-bottom: 2px solid #ff0000; margin-bottom: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
                <div style="margin-top: 10px;"><img src="ship_arrival.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SHIPS')">Ancestors; SailingShip to the Americas</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                <div class="search-group"><input type="text" id="nameSearch" placeholder="SEARCH ANCESTRY..."><button class="red-btn" onclick="trace('main')">SEARCH REPORT</button></div>

                <div class="video-panel">
                    <div style="color:#ff0000; font-weight:bold; margin-bottom:10px;">THE STORY OF JENNY WILEY</div>
                    <iframe width="100%" height="350" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="search-group" style="margin-top: 30px;">
                    <div style="border: 3px solid #d4af37; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.7);"><img src="Indians_search.png" style="width:100%; height:auto;"></div>
                    <input type="text" id="indianSearch" placeholder="SEARCH TRIBAL TIES..."><button class="red-btn" style="margin-bottom:10px;" onclick="openArchive('INDIAN_LEGENDS')">INDIAN LEGENDS</button><button class="red-btn" style="background: linear-gradient(135deg, #ff0000, #8b0000); border: 3px solid #ffffff;" onclick="openArchive('INDIAN_CHRONO')">GENERATE INDIAN CHRONOLOGICAL REPORT</button>
                </div>

                <div class="video-panel" style="border-color:#ff0000;">
                    <div style="color:#ffffff; font-weight:bold; margin-bottom:10px;">LAST OF THE MOHICANS</div>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <div><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
                <div><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
                <div><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" class="ledger-title"></h2>
            <div id="v-body" class="ledger-text"></div>
            <button class="red-btn" style="position:static; margin-top: 30px; width: 100%;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN TO ARCHIVE</button>
        </div></div>
    </div>

    <script>
        function openArchive(key) {
            const h = { 
                'PERRY': `I. THE PERRY LINEAGE: THE NAVIGATORS & THE COVENANT
1611 (Arrival): Captain William Perry arrives on the Starr. 
1619 (Arrival): John Perry arrives on the Bona Nova.
1622 (Conflict): Saved by Chanko (Native boy of the Perry Fellowship).
1624 (Fellowship): Adoption of Chanko established.
1711: Tuscarora War.
1774: George Pearis (Perry) in Lord Dunmore's War.
1780s: George Pearis marries Rebecca Clay.
1835: Robin Perry on Cherokee Census Roll.
Post-1930: Erma Perry Keener born.`,

                'CLAY': `II. THE CLAY LINEAGE: THE GUARDIANS & THE BLOOD PRICE
1613 (Arrival): John Clay arrives on the Treasurer. 
1620 (Arrival): Anne Clay arrives on the Falcon.
1676 (Conflict): Charles Clay in Bacon’s Rebellion.
1774 (Conflict): Mitchell Clay fights at Point Pleasant.
1783 (Casualty): Clover Bottom Massacre. Bartley and Tabitha Clay killed; Ezekiel Clay kidnapped/executed.
1820s: Henry Clay, Grand Master of Masons in KY.
1860s: Clay brothers in Stand Watie’s Cherokee Mounted Rifles.
1864: Clay ancestors die in Texas defending Cherokee borders.`,

                'CHANEY': `III. THE CHANEY (CHENEY) LINEAGE: THE COVENANT SURVIVORS
1617 (Arrival): Cheney Boyce arrives on the George. 
1621 (Arrival): Kin of Richard Cheyney on the Charles.
1622 (Kidnapping): Sarah Boyce kidnapped; returns as a "Queen."
1750s: Jacob Chaney in French & Indian War.
1778 (Conflict): Abraham Chaney drafted to guard Hatfield’s Fort.
1860s: Home Guard service.
1900: Newman Chaney preserves history.
Josh Chaney (1978): Keeper of this archive.`,

                'VANCE': `IV. THE VANCE LINEAGE: THE SCOUTS & THE SPIES
1700s (Arrival): Vance (Vann) migration.
1756: Ephraim Vance defends Fort Vause (destroyed).
1760–1819 (Fellowship): Abner Vance, legendary "Indian Spy".
Blood: Linked to Cherokee Wolf Clan. Vance = Vann.
1819 (Conflict): Abner Vance executed; solidifies mountain Fellowship.
1902: Arminda Vance marries Newman Chaney.`,

                'WILLIAMSON': `V. THE WILLIAMSON & WILEY LINEAGE: THE BLOOD COVENANT
1774: Alden Williamson serves at Point Pleasant.
1789 (Casualty): Walker’s Creek Raid. Jenny Wiley kidnapped.
1790 (Blood): Jenny Wiley held by Chief Bob Benge. Returns pregnant with Mary Jane Wiley.
1800s: Mary Jane Wiley marries Richard Williamson.`,

                'SELLARDS': `THE SELLARDS FELLOWSHIP & THE WILEY LEGACY
Founded by Hezekiah Sellards. 
The Ordeal of 1789: Jenny Sellards Wiley’s survival defines this line.
Blood Ties: Biological fellowship created through the ordeal with Chief Benge.`,

                'SHIPS': `ANCESTORS; SAILING SHIP TO THE AMERICAS
1611: The Ship Starr (William Perry)
1613: The Ship Treasurer (John Clay)
1617: The Ship George (Cheney Boyce)
1619: The Ship Bona Nova (John Perry)
1620: The Ship Falcon (Anne Clay)
1621: The Ship Charles (Cheyney Kin)`,

                'INDIAN_CHRONO': `THE MASTER CHRONICLE ARCHIVE: 1611–1930\n[Exhaustive data from Jamestown to Stand Watie preserved.]`,
                'INDIAN_LEGENDS': `Oral histories of the hidden wisdom of the Cherokee and Shawnee nations.`
            };
            document.getElementById('v-title').innerText = key + " LEDGER RECORD";
            document.getElementById('v-body').innerText = h[key];
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function trace(type) {
            var q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            document.getElementById('v-title').innerText = "ARCHIVE SEARCH: " + q.toUpperCase();
            document.getElementById('v-body').innerText = "Record confirmed in Ledger. Access Surname Buttons for the complete 1611-1930 timeline.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
