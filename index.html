<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.8s ease;
        }

        .splash-art-frame { width: 90%; max-width: 1100px; border: 6px solid #d4af37; box-shadow: 0 0 60px #000; margin-bottom: 25px; }
        .splash-image { width: 100%; height: auto; display: block; }

        #main-ui { 
            display:none; text-align: center; min-height: 100vh; 
            padding-bottom: 120px; opacity: 0; transition: opacity 0.8s ease;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title {
            color: #ffffff; margin: 0; letter-spacing: 4px; font-size: 2.2em; text-transform: uppercase;
            text-shadow: -2px -2px 0 #ff0000, 2px -2px 0 #ff0000, -2px 2px 0 #ff0000, 2px 2px 0 #ff0000;
        }

        .wood-btn { 
            padding: 16px 36px; background: linear-gradient(#5d4037, #1a0f00); color: #fbe9e7; 
            border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em;
        }
        .red-btn {
            padding: 16px 30px; background: #ff0000; color: #ffffff; 
            border: 3px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 1.1em;
        }

        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: start; 
            max-width: 2400px; margin: 0 auto; gap: 40px; padding: 0 20px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 80px; } 
        .family-btn-group { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .family-thumb { width: 350px; border-radius: 4px; border: 4px solid #d4af37; object-fit: cover; background: #111; box-shadow: 0 15px 35px #000; }
        .perry-zoom { object-fit: contain !important; background-color: #000; }

        .central-container { display: flex; flex-direction: column; align-items: center; gap: 25px; } 
        .destiny-text { 
            color: #ff0000; font-size: 3.5em; font-weight: bold; letter-spacing: 8px; text-transform: uppercase; 
            text-shadow: -2px -2px 0 #ffffff, 2px -2px 0 #ffffff, -2px 2px 0 #ffffff, 2px 2px 0 #ffffff;
            line-height: 1.1; margin-bottom: 5px;
        }

        .search-group { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        input[type="text"] { padding: 15px; width: 100%; background: #000; color: #fff; border: 2px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000; overflow-y:auto; padding:20px; }
        .vault-content { background:#1a0f00; border:3px solid #d4af37; padding:50px; border-radius:10px; text-align: left; max-width: 900px; margin: 40px auto; color: #e0c097; line-height: 1.6; }
        .history-title { color: #ff0000; text-transform: uppercase; font-size: 2.2em; border-bottom: 2px solid #ff0000; margin-bottom: 20px; padding-bottom: 10px; text-shadow: 1px 1px 0 #fff; }
        
        /* SEARCH RESULT STYLING */
        .history-entry { background: rgba(255, 255, 255, 0.05); padding: 15px; margin-bottom: 15px; border-left: 4px solid #ff0000; }
        .entry-name { color: #fff; font-size: 1.4em; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="wood-btn" onclick="enterArchive()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div class="family-btn-group">
                    <img src="william_surname.jpg" class="family-thumb" style="height: 440px;">
                    <button class="wood-btn" onclick="openArchive('CHANEY')">CHANEY SURNAME HISTORY</button>
                </div>
                <div class="family-btn-group">
                    <img src="raymond_surname.jpeg" class="family-thumb" style="height: 440px;">
                    <button class="wood-btn" onclick="openArchive('VANCE')">VANCE SURNAME HISTORY</button>
                </div>
                <div class="family-btn-group">
                    <img src="Sellards_surname.jpg" class="family-thumb" style="height: 520px;">
                    <button class="wood-btn" onclick="openArchive('SELLARDS')">SELLARDS SURNAME HISTORY</button>
                </div>
            </div>

            <div class="central-container">
                <div class="destiny-text">CHOOSE YOUR<br>DESTINY</div>
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="Type Surname (Chaney, Vance, Clay...)">
                    <button class="red-btn" onclick="trace()">SEARCH ANCESTRY REPORT</button>
                </div>
                <div class="search-group">
                    <div class="indian-visual-frame"><img src="Indians_search.png" class="indian-img"></div>
                    <button class="wood-btn" onclick="openArchive('INDIAN')">INDIAN RESEARCH ANCESTRY NOTES</button>
                </div>
                <div class="search-group" style="margin-top: 40px;">
                    <div class="destiny-text" style="font-size: 2em;">THE STORY OF JENNY WILEY</div>
                    <iframe width="100%" height="400" src="https://www.youtube.com/embed/t6x7gy60CO8?rel=0" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <div class="family-btn-group">
                    <img src="Perry_surname2.jpeg" class="family-thumb perry-zoom" style="height: 440px;">
                    <button class="wood-btn" onclick="openArchive('PERRY')">PERRY SURNAME HISTORY</button>
                </div>
                <div class="family-btn-group">
                    <img src="henry_clay_surname.jpg" class="family-thumb" style="height: 440px;">
                    <button class="wood-btn" onclick="openArchive('CLAY')">CLAY SURNAME HISTORY</button>
                </div>
                <div class="family-btn-group">
                    <img src="Alden_Williamson_Surname.jpeg" class="family-thumb" style="height: 520px;">
                    <button class="wood-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON SURNAME HISTORY</button>
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <div id="v-title" class="history-title"></div>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 40px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        function enterArchive() {
            const splash = document.getElementById('splash');
            const main = document.getElementById('main-ui');
            splash.style.opacity = '0';
