<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER LIBRARY</title>
    
    <style>
        /* THE FOUNDATION - DARK WOOD & GOLD */
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; width: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* MOBILE SPLASH GATE */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            z-index: 9999999999; background-color: #050505; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .splash-image { 
            width: 100%; max-width: 450px; height: auto; max-height: 40vh; 
            object-fit: contain; border: 2px solid #d4af37; box-shadow: 0 0 30px #000; margin-bottom: 20px;
        }
        .splash-text { color: #e0c097; padding: 0 10px 20px 10px; font-size: 1em; max-width: 500px; line-height: 1.4; font-style: italic; font-weight: bold; }
        .pass-input { padding: 15px; width: 90%; max-width: 280px; background: #111; color: #fff; border: 2px solid #d4af37; border-radius: 8px; font-size: 1.2em; text-align: center; margin-bottom: 15px; outline: none; }
        .gate-btn { padding: 18px 0; width: 90%; max-width: 280px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); color: #ffffff; border: 3px solid #d4af37; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em; box-shadow: 0 0 25px #ff0000; }

        /* MAIN LIBRARY UI */
        #main-ui { display:none; text-align: center; max-width: 850px; margin: 0 auto; padding: 15px; overflow-y: auto; height: 100vh; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; font-size: 1.8em; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        
        .section-container { display: flex; flex-direction: column; gap: 35px; align-items: center; padding-bottom: 150px; }
        .search-zone { width: 100%; max-width: 550px; padding: 25px; background: rgba(20, 20, 20, 0.9); border: 2px solid #d4af37; border-radius: 12px; box-shadow: 0 10px 30px #000; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 2px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; box-sizing: border-box; }
        .red-btn { padding: 15px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%); color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1em; margin-top: 10px; }
        
        /* ENCYCLOPEDIA DISPLAY OVERLAY */
        #encyclopedia-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000000000; overflow-y:auto; padding: 15px; box-sizing: border-box;}
        .encyclopedia-page { background:#fff; color:#000; max-width: 900px; margin: 20px auto; padding: 40px; border: 8px double #d4af37; border-radius: 5px; box-shadow: 0 0 50px #000; text-align: left; }
        .page-title { font-size: 2.2em; border-bottom: 4px solid #a00000; margin-bottom: 20px; color: #a00000; text-transform: uppercase; font-weight: 900; }
        .history-block { font-size: 1.15em; line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; font-family: 'Times New Roman', serif; text-align: justify; }
        .lineage-table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 2px solid #000; }
        .lineage-table th, .lineage-table td { border: 1px solid #000; padding: 12px; text-align: left; font-size: 0.9em; }
        .lineage-table th { background: #eee; text-transform: uppercase; font-weight: 900; }
        
        .archive-item { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .family-thumb { width: 100%; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="movie_splash2.png" class="splash-image" alt="Bloodline Saga Gate">
        <div class="splash-text">Follow along with the saga of an amazing adventure and save, follow the bloodline.</div>
        <input type="text" id="gateKey" class="pass-input" placeholder="ENTER PASSWORD">
        <button class="gate-btn" onclick="verifyGate()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">MASTER CHRONICLE LIBRARY</h1></div>
        
        <div class="section-container">
            <div class="search-zone">
                <input type="text" id="libSearch" placeholder="SEARCH 800 YEARS OF HISTORY...">
                <button class="red-btn" onclick="runLibrarySearch()">CONSULT THE ENCYCLOPEDIA</button>
            </div>

            <div class="archive-item">
                <img src="ship_arrival.jpg" class="family-thumb">
                <button class="red-btn" onclick="showRecord('SHIPS')">II. THE SHIP CHRONICLE (1611–1750)</button>
            </div>

            <div class="archive-item"><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="showRecord('WATTS')">WATTS: THE 900-YEAR MILITARY LEGACY</button></div>
            <div class="archive-item"><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="showRecord('CLAY')">CLAY: ARMED MERCHANTS & KNIGHTS</button></div>
            <div class="archive-item"><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="showRecord('VANCE')">VANCE: LORDS OF BARNBARROCH</button></div>
            <div class="archive-item"><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="showRecord('CHANEY')">CHANEY: ANCIENT PLANTERS ARCHIVE</button></div>
            <div class="archive-item"><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="showRecord('PERRY')">PERRY: ROYAL NAVIGATOR LOGS</button></div>
            
            <div style="width:100%; max-width:500px; border:3px solid #d4af37; background:#111; padding:5px;">
                <iframe width="100%" height="300" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="encyclopedia-overlay">
        <div class="encyclopedia-page" id="page-content"></div>
        <div style="text-align: center; padding-bottom: 50px;">
            <button class="red-btn" style="width: 250px;" onclick="closeEncyclopedia()">RETURN TO LIBRARY</button>
        </div>
    </div>

    <script>
        function verifyGate() {
            var val = document.getElementById('gateKey').value.toLowerCase().trim();
            if (val === "fellowship") {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                document.body.style.overflow = 'auto';
            } else { alert("Incorrect Code."); }
        }

        // THE MASTER ENCYCLOPEDIA DATA - 800 YEAR ARCHIVE
        const libraryData = {
            'WATTS': {
                title: "Watts: Simon Wathes and the Hawkesdale Hall Legacy",
                history: `I. THE ANCIENT ROOTS: Simon Wathes (c. 1135)\n\nSimon Wathes was traditionally descended from a French soldier of fortune who accompanied King Stephen to England in 1135. As a professional soldier serving the Crown, Wathes established a footprint of military sovereignty that would define the lineage for nearly a millennium.\n\nHe founded the Watts family seat at Hawkesdale Hall, establishing a 900-year military legacy that was carried through the generations. In 1640, Edward Watts I arrived in the colonies via the London Supply Ships, serving as a soldier-landowner to defend the Rappahannock frontier in Stafford County, Virginia. The Watts family remained defenders of the frontier, bridging the gap between the knightly class of England and the backcountry rangers of Appalachia.`,
                lineage: [
                    { name: "Simon Wathes", role: "Soldier of Fortune (King Stephen)", date: "1135" },
                    { name: "Edward Watts I", role: "Rappahannock Frontier Defender", date: "1640" },
                    { name: "Edward Watts II", role: "Stafford County Pioneer", date: "c. 1680" },
                    { name: "Thomas Watts", role: "Descendant", date: "c. 1720" }
                ]
            },
            'CLAY': {
                title: "Clay: Coal Barons, Knights, and the Virginia Company",
                history: `I. THE ANCIENT ROOTS: Sir John Clay (b. 1558)\n\nSir John Clay was a "Coal Baron" of Wales who was reportedly knighted by Queen Elizabeth I in 1588 for his service to the Crown's industrial and maritime expansion. His descendants carried the Clay coat of arms—three trefoils between a chevron—into the holds of the Virginia Company's earliest fleets.\n\nJohn Clay ("The Immigrant") arrived in 1613 on the Treasurer, an armed merchantman carrying 14 heavy guns. John served as a soldier-planter under Capt. Samuel Argall and was officially designated an "Ancient Planter." This status gave the family primary authority in establishing early land grants. His wife, Anne Clay, joined the fortified estate in 1620 aboard the Falcon.`,
                lineage: [
                    { name: "Sir John Clay", role: "Knighted Coal Baron (Wales)", date: "1558" },
                    { name: "John Clay", role: "Ancient Planter / Treasurer", date: "1613" },
                    { name: "Anne Clay", role: "Matriarch / Falcon arrival", date: "1620" },
                    { name: "Charles Clay", role: "Frontier Soldier", date: "1638-1686" }
                ]
            },
            'VANCE': {
                title: "Vance: The Lords of Barnbarroch & Secret Scottish Fellowships",
                history: `I. THE ANCIENT ROOTS: The Lords of Barnbarroch\n\nThe Vance line (historically Vans) were prominent Lords in Wigtownshire, serving Scottish Kings as ambassadors and knights. They held a significant position in the political structure of the Old World, but their spiritual and defensive ties were even deeper.\n\nThey were traditional allies of the Sinclairs of Rosslyn, serving as protectors of the secret Scottish Fellowships. This background of hidden knowledge and elite scouting was preserved when Charles Vance arrived in 1739. Known as "Backcountry Rangers" in Ireland, the Vances were the primary "Indian Spies" of the Fellowship, mapping the Appalachian wilderness long before it was settled.`,
                lineage: [
                    { name: "John Vans", role: "Lord of Barnbarroch", date: "c. 1450" },
                    { name: "Charles Vance", role: "Immigrant Scouting Unit", date: "1739" },
                    { name: "Abner Vance", role: "Legendary Indian Spy", date: "1760-1819" }
                ]
            },
            'SHIPS': {
                title: "II. THE SHIP CHRONICLE: ARRIVALS OF THE FLEET (1611–1750)",
                history: `This ledger tracks the specific vessels, arrival years, and professional backgrounds of the Fellowship patriarchs who landed in the American Colonies.\n\n1611: Starr - Capt. William Perry (Navigator)\n1613: Treasurer - John Clay (Soldier-Planter)\n1617: George - Cheney Boyce (Virginia Co. Associate)\n1619: Bona Nova - John Perry (Agricultural Trade)\n1620: Falcon - Anne Clay (Matriarch)\n1621: Sea Flower - Sarah Boyce (Uprising Survivor)\n1621: Charles - Richard Cheyney (Land Surveyor)\n1635: Assurance - Thomas Adkins (Merchant-Planter)\n1732: Ulster Brigantines - Hezekiah Sellards (Weaver)\n1739: Ulster Merchant - Charles Vance (Backcountry Ranger)\n1750: Frontier Schooners - Valentine & Solomon Akers (Provers of Land)`,
                lineage: [
                    { name: "Captain William Perry", role: "Royal Merchant Navigator", date: "1611" },
                    { name: "John Clay", role: "Ancient Planter", date: "1613" },
                    { name: "Cheney Boyce", role: "Virginia Co. Soldier", date: "1617" },
                    { name: "Thomas Adkins", role: "Henrico Tobacco Planter", date: "1635" },
                    { name: "Valentine Akers", role: "Prover of Land", date: "1750" }
                ]
            }
        };

        function showRecord(key) {
            const data = libraryData[key];
            if (!data) return;
            let rows = "";
            data.lineage.forEach(p => { rows += `<tr><td>${p.name}</td><td>${p.role}</td><td>${p.date}</td></tr>`; });
            const html = `<h1 class="page-title">${data.title}</h1><div class="history-block">${data.history}</div><h2 style="border-bottom: 2px solid #000; margin-top:30px;">ENCYCLOPEDIA LINEAGE LEDGER</h2><table class="lineage-table"><thead><tr><th>Name</th><th>Service / Status</th><th>Era</th></tr></thead><tbody>${rows}</tbody></table>`;
            document.getElementById('page-content').innerHTML = html;
            document.getElementById('encyclopedia-overlay').style.display = 'block';
        }

        function runLibrarySearch() {
            const q = document.getElementById('libSearch').value.toUpperCase().trim();
            if (!q) return;
            for (let key in libraryData) {
                if (key.includes(q) || libraryData[key].title.toUpperCase().includes(q) || libraryData[key].history.toUpperCase().includes(q)) {
                    showRecord(key); return;
                }
            }
            alert("Record not found.");
        }
        function closeEncyclopedia() { document.getElementById('encyclopedia-overlay').style.display = 'none'; }
    </script>
</body>
</html>
