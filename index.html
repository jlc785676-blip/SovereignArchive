<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        /* BASE FORMATTING - PC OPTIMIZED */
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* SPLASH GATE FIX */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .splash-art-frame { width: 85%; max-width: 900px; border: 5px solid #d4af37; box-shadow: 0 0 50px #000; margin-bottom: 20px; }
        .splash-image { width: 100%; height: auto; display: block; }

        /* MAIN UI - SCALED FOR PC */
        #main-ui { 
            display:none; text-align: center; height: 100vh; 
            max-width: 1600px; margin: 0 auto; opacity: 0; transition: opacity 0.5s ease;
            overflow-y: auto; padding-bottom: 100px;
        }
        
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 20px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2em; letter-spacing: 3px; text-transform: uppercase; }

        .wood-btn { 
            padding: 12px 24px; background: linear-gradient(#5d4037, #1a0f00); color: #fbe9e7; 
            border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* SEARCH AREA - RESTORED SIZES */
        .search-group { width: 90%; max-width: 800px; margin: 0 auto 20px auto; }
        input[type="text"] { 
            padding: 15px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; 
            box-sizing: border-box;
        }
        .red-btn {
            padding: 12px 30px; background: #ff0000; color: #ffffff; margin-top: 10px;
            border: 2px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; font-size: 1em;
        }

        .archive-grid { 
            display: grid; grid-template-columns: 350px 1fr 350px; align-items: start; 
            gap: 20px; padding: 0 20px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 40px; } 
        .family-thumb { width: 100%; border: 3px solid #d4af37; box-shadow: 0 10px 20px #000; }
        .perry-zoom { object-fit: contain !important; background: #000; height: 400px; }

        /* VAULT */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000; overflow-y:auto; }
        .vault-content { background:#1a0f00; border:3px solid #d4af37; padding:40px; border-radius:10px; text-align: left; max-width: 850px; margin: 40px auto; color: #e0c097; }
        .history-entry { border-bottom: 1px solid #444; padding: 15px 0; }
        .entry-name { color: #ff0000; font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="wood-btn" onclick="enterArchive()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <img src="william_surname.jpg" class="family-thumb"><button class="wood-btn" onclick="openArchive('CHANEY')">CHANEY</button>
                <img src="raymond_surname.jpeg" class="family-thumb"><button class="wood-btn" onclick="openArchive('VANCE')">VANCE</button>
            </div>

            <div class="central-container">
                <div style="color:#ff0000; font-size: 3em; font-weight:bold; margin-bottom: 10px;">CHOOSE YOUR DESTINY</div>
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ANCESTRY BY NAME OR SURNAME">
                    <button class="red-btn" onclick="trace()">SEARCH ANCESTRY REPORT</button>
                </div>
                
                <div style="margin-top: 30px;">
                    <iframe width="100%" height="450" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <img src="Perry_surname2.jpeg" class="family-thumb perry-zoom"><button class="wood-btn" onclick="openArchive('PERRY')">PERRY</button>
