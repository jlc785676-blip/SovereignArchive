<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); text-align: center; }
        .header-fixed { position:sticky; top:0; width:100%; z-index:2000; background:#1a0f00; border-bottom:3px solid #3e2723; padding:15px 0; }
        .wood-btn { padding:15px; width:90%; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; border:2px solid #d4af37; font-weight:bold; border-radius:8px; margin-bottom:10px; cursor:pointer; }
        #main-display { margin-top: 40px; padding-bottom: 200px; }
        .seal { font-size: 3.5em; margin-bottom: 10px; }
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:3000; overflow-y:auto; padding:20px; box-sizing: border-box; }
        .vault-content { background:#111; border:2px solid #d4af37; padding:20px; border-radius:8px; text-align: left; }
        .v-img { max-width:100%; border:1px solid #d4af37; margin:10px 0; display:block; }
        .footer-fixed { position:fixed; bottom:0; width:100%; z-index:2000; background:#1a0f00; border-top:3px solid #3e2723; padding:10px 0; display:flex; flex-wrap:wrap; justify-content:center; gap:5px; }
        .nav-btn { background:#3e2723; color:#d4af37; border:1px solid #d4af37; padding:10px; font-size:10px; font-weight:bold; width:30%; border-radius:4px; }
        .history-block { margin-bottom:30px; border-bottom:1px solid #3e2723; padding-bottom:15px; }
        .book-section { border: 2px solid #d4af37; padding: 15px; background: #1a0f00; margin-bottom: 30px; }
        .ancestor-header { font-size:1.2em; color:#fff; border-left:4px solid #d4af37; padding-left:10px; margin-bottom:10px; text-transform: uppercase; }
        #splash-collage { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        .c-img { width: 100%; border: 1px solid #3e2723; border-radius: 4px; }
        a { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header-fixed">
        <input type="text" id="nameSearch" style="padding:15px; width:85%; background:#000; color:#fff; border:1px solid #d4af37;" placeholder="Execute Trace...">
        <div style="margin-top:10px;"><button class="wood-btn" onclick="trace()">EXECUTE DEEP TRACE</button></div>
    </div>

    <div id="main-display">
        <div class="seal">⚔️</div>
        <h1 style="color:#d4af37; letter-spacing: 5px;">THE SOVEREIGN ARCHIVE</h1>
        <p style="font-style: italic; color: #888;">"Blood remembers what the mind forgets."</p>
        <div id="splash-collage">
            <img src="ragnaron_viking_ship.jpeg" class="c-img" style="grid-column: span 2;">
            <img src="rollo_horse.jpeg" class="c-img">
            <img src="william_king_portrait4.jpg" class="c-img">
            <img src="jenny_wiley_portrait.jpg" class="c-img" style="grid-column: span 2;">
        </div>
    </div>

    <div id="vault-overlay"><div class="vault-content">
        <h2 id="v-title" style="color:#d4af37; border-bottom:1px solid #d4af37; padding-bottom:10px;"></h2>
        <div id="v-body"></div>
        <button class="wood-btn" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
    </div></div>

    <div class="footer-fixed">
        <button class="nav-btn" onclick="quick('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="quick('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="quick('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="quick('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="quick('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="quick('WILEY')">WILEY</button>
    </div>

    <script>
        let db = [];

        async function load() {
            const r = await fetch('Gedcom.txt?v=' + Date.now());
            const t = await r.text();
            db = t.split('0 @').filter(x => x.trim()).map(x => {
                const n = x.match(/1 NAME (.*)/);
                const notes = [...x.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: x.toLowerCase(), notes: notes };
            });
        }
        function quick(n) { document.getElementById('nameSearch').value = n; trace(); }
        function trace() {
            const q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = db.filter(x => x.raw.includes(q));
            let h = "";
            res.forEach(x => {
                let d = x.notes.replace(/IMAGE_REF: (.*?)(?=\n|$|\r)/g, (m, f) => `<img src="${f.trim()}" class="v-img">`);
                d = d.replace(/YOUTUBE_REF: (.*?)(?=\n|$|\r)/g, (m, id) => `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${id.trim()}" frameborder="0" allowfullscreen style="margin-top:10px;"></iframe>`);
                
                // This makes the Perry Link clickable
                d = d.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

                let isBook = x.name.includes("RESEARCH BOOK");
                let blockClass = isBook ? "book-section" : "history-block";
                h += `<div class="${blockClass}"><div class="ancestor-header">${x.name}</div><div style="white-space:pre-wrap;">${d}</div></div>`;
            });
            document.getElementById('v-title').innerText = "TRACE: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "No records found.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
        window.onload = load;
    </script>
</body>
</html>
