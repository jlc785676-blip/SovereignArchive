<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        /* LOCK SCROLLING UNTIL ENTRY */
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* SPLASH GATE - REBUILT TO PREVENT CRASH */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:10000; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
            visibility: visible;
        }

        .splash-art-frame { 
            width: 85%; max-width: 900px; border: 5px solid #d4af37; 
            box-shadow: 0 0 60px #000; margin-bottom: 30px; 
        }
        .splash-image { width: 100%; height: auto; display: block; }

        .gate-btn { 
            padding: 20px 50px; background: linear-gradient(#8b0000, #4a0000); color: #ffffff; 
            border: 3px solid #d4af37; font-weight: bold; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 3px; font-size: 1.3em;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); transition: transform 0.1s;
        }
        .gate-btn:active { transform: scale(0.95); background: #ff0000; }

        /* MAIN UI - SCALED FOR PC & MOBILE */
        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 30px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; text-shadow: 2px 2px #000; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        .search-group label { display: block; color: #fff; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        input[type="text"] { 
            padding: 18px; width: 100%; background: #000; color: #fff; 
            border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; 
            box-sizing: border-box; box-shadow: inset 0 0 10px #300;
        }

        .red-btn {
            padding: 15px 40px; background: #ff0000; color: #ffffff; margin-top: 15px;
            border: 2px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1.1em;
        }

        /* RESPONSIVE GRID */
        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        /* VAULT OVERLAY */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:11000; overflow-y:auto; padding: 20px; box-sizing: border-box; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1100px; margin: 30px auto; color: #e0c097; }
        .history-entry { border-bottom: 2px solid #d4af37; padding: 25px 0; }
        .entry-name { color: #ff0000; font-size: 1.8em; font-weight: bold; text-transform: uppercase; }
        .history-p { margin-bottom: 25px; line-height: 1.8; font-size: 1.2em; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                
                <div class="search-group">
                    <label>Master Ancestry Search</label>
                    <input type="text" id="nameSearch" placeholder="SEARCH ERMA, ROLLO, ALDEN, JOSH...">
                    <button class="red-btn" onclick="trace('main')">GENERATE REPORT</button>
                </div>

                <div class="search-group" style="margin-top: 50px;">
                    <div style="border: 3px solid #d4af37; padding: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.7);">
                        <img src="Indians_search.png" style="width:100%; height:auto;">
                    </div>
                    <label>Indigenous Research Search</label>
                    <input type="text" id="indianSearch" placeholder="SEARCH SHAWNEE, CHEROKEE, TREATY...">
                    <button class="gate-btn" style="width:100%; margin-top:15px;" onclick="trace('indian')">GENERATE INDIGENOUS REPORT</button>
                </div>
            </div>

            <div class="side-column">
                <div><img src="Perry_surname2.jpeg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
                <div><img src="henry_clay_surname.jpg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
                <div><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="gate-btn" style="width:100%; padding:15px; font-size:1em;" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#ff0000; border-bottom: 3px solid #ff0000; padding-bottom: 10px;"></h2>
            <div id="v-body"></div>
            <button class="gate-btn" style="width: 100%; margin-top: 30px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-09.mp3');

        function playGateAction() {
            clickSound.play().catch(() => {}); // Prevent browser block
            const splash = document.getElementById('splash');
            const ui = document.getElementById('main-ui');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                ui.style.display = 'block';
                setTimeout(() => { 
                    ui.style.opacity = '1'; 
                    document.body.style.overflow = 'auto'; // UNLOCK SCROLL
                }, 50);
            }, 500);
        }

        const ancestryRecords = [
            { name: "Erma Perry", info: "Matriarch of the Florida branch. Daughter of the Perry line; central navigator of the family's migration legacy. Mother to Joshua Lee Chaney. Her ancestry connects directly to the Isle of Wight colonial settlers and the 1700s Tug River pioneers." },
            { name: "Joshua Lee Chaney", info: "Born 1978. Technical Lead and Engineering student. Master architect of the Sovereign Archive. Son of Erma Perry & Oshel Chaney. Descendant of Norman knights and Revolutionary scouts." },
            { name: "Alden Williamson (1750-1816)", info: "Revolutionary War Scout and Tug River pioneer. He led search parties for Jenny Wiley and founded a lineage that settled the vast Kentucky wilderness. Known for establishing the foundation of the Tug Valley community." },
            { name: "Rollo (Duke of Normandy)", info: "Viking chieftain who founded Normandy. His DNA is the ancient root of the Vance lineage, moving from the Scandinavian fjords to France and eventually the American frontier." },
            { name: "John Clay (1613)", info: "The English Planter. Arrived at Jamestown on 'The Treasurer' in 1613. One of the foundation stones of English America." }
        ];

        const indianRecords = [
            { name: "Shawnee/Cherokee Pre-Masonry", info: "Detailed records of how the Shawnee and Cherokee nations met and negotiated with the Perry, Sellards, and Vance lines. Includes the secret pre-masonry connections and cultural exchanges that occurred before 19th-century history." },
            { name: "The Jenny Wiley Saga", info: "Full account of Jenny Sellards Wiley's 1789 capture. Taken by a raiding party of Shawnee and Cherokee warriors, her 11-month journey documented the tribal migration paths across Kentucky." }
        ];

        function trace(type) {
            let q = (type === 'main') ? document.getElementById('nameSearch').value.toLowerCase().trim() : document.getElementById('indianSearch').value.toLowerCase().trim();
            let records = (type === 'main') ? ancestryRecords : indianRecords;
            if (!q) return;
            const res = records.filter(r => r.name.toLowerCase().includes(q) || r.info.toLowerCase().includes(q));
            let html = "";
            res.forEach(r => { html += `<div class="history-entry"><div class="entry-name">${r.name}</div><div class="history-p">${r.info}</div></div>`; });
            document.getElementById('v-title').innerText = (type === 'main' ? "ANCESTRY REPORT: " : "INDIGENOUS MASTER REPORT: ") + q.toUpperCase();
            document.getElementById('v-body').innerHTML = html || "<p>No specific records found in this sector.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function openArchive(key) {
            const history = {
                'VANCE': "The Vance line begins with Rollo, the Viking Duke of Normandy. His descendants fought with William the Conqueror in 1066. The family migrated through Ulster, Ireland, before settling the Appalachian frontier as powerful border lords.",
                'CLAY': "John Clay arrived at Jamestown in 1613. The Clays were pioneers of Virginia and Kentucky, producing legendary statesmen and scouts who cleared the American wilderness.",
                'WILLIAMSON': "Alden Williamson (1750-1816) was a premier Revolutionary Scout. He led the search for Jenny Wiley and established the Tug River Valley settlements with his 14 children.",
                'PERRY': "The Perrys were colonial navigators and rebels of Virginia. From Philip Perry in 1599 to Erma Perry today, this line has been at the forefront of the American westward movement.",
                'CHANEY': "Descended from Norman knights, the Chaneys moved from Maryland into the technical heart of the Big Sandy. This is a line of builders and guardians of family history.",
                'SELLARDS': "Hezekiah Sellards founded a line of Big Sandy survivors. Most famously known for Jenny Wiley, whose capture and escape is a cornerstone of our frontier legacy."
            };
            document.getElementById('v-title').innerText = key + " HISTORY";
            document.getElementById('v-body').innerHTML = `<p class="history-p">${history[key]}</p>`;
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
