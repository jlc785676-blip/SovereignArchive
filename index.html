<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; min-height: 100%; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* SPLASH GATE - MOBILE READY */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.4s ease;
        }
        .splash-art-frame { width: 90%; max-width: 900px; border: 4px solid #d4af37; box-shadow: 0 0 40px #000; margin-bottom: 25px; }
        .splash-image { width: 100%; height: auto; display: block; }

        .gate-btn { 
            padding: 18px 40px; background: linear-gradient(#8b0000, #4a0000); color: #ffffff; 
            border: 3px solid #d4af37; font-weight: bold; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* MAIN UI - FLEXIBLE FOR ALL SCREENS */
        #main-ui { 
            display:none; text-align: center; max-width: 1200px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.5s ease; padding: 10px;
        }
        
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.95); border-bottom: 3px solid #ff0000; margin-bottom: 20px; }
        .main-title { color: #ffffff; margin: 0; font-size: 1.8em; letter-spacing: 2px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 800px; margin: 0 auto 25px auto; }
        input[type="text"] { 
            padding: 15px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #ff0000; border-radius: 4px; font-size: 18px; text-align: center; 
            box-sizing: border-box;
        }
        .red-btn {
            padding: 12px 30px; background: #ff0000; color: #ffffff; margin-top: 10px;
            border: 1px solid #ffffff; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; width: 100%; max-width: 300px;
        }

        /* RESPONSIVE GRID - SWITCHES TO 1 COLUMN ON MOBILE */
        .archive-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* Default to mobile stack */
            gap: 30px; 
        }

        /* PC VIEW: 3 COLUMNS */
        @media (min-width: 1000px) {
            .archive-grid { grid-template-columns: 300px 1fr 300px; }
            .main-title { font-size: 2.2em; }
            .red-btn { width: auto; }
        }
        
        .side-column { display: flex; flex-direction: column; gap: 30px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 350px; border: 3px solid #d4af37; box-shadow: 0 10px 20px #000; }
        
        .video-container { 
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; 
            max-width: 100%; border: 3px solid #d4af37; margin: 20px 0;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* VAULT FOR MOBILE */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:10000; overflow-y:auto; padding: 15px; box-sizing: border-box; }
        .vault-content { background:#1a0f00; border:3px solid #d4af37; padding:20px; border-radius:10px; text-align: left; max-width: 800px; margin: 20px auto; color: #e0c097; }
        .history-entry { border-bottom: 1px solid #d4af37; padding: 15px 0; }
        .entry-name { color: #ff0000; font-size: 1.4em; font-weight: bold; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateSound()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div style="width:100%">
                    <img src="william_surname.jpg" class="family-thumb">
                    <button class="gate-btn" style="width:100%; padding:10px; font-size:0.9em;" onclick="openArchive('CHANEY')">CHANEY HISTORY</button>
                </div>
                <div style="width:100%">
                    <img src="raymond_surname.jpeg" class="family-thumb">
                    <button class="gate-btn" style="width:100%; padding:10px; font-size:0.9em;" onclick="openArchive('VANCE')">VANCE HISTORY</button>
                </div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2em; text-shadow: 1px 1px 0 #fff;">CHOOSE YOUR DESTINY</h2>
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ANCESTOR NAME">
                    <button class="red-btn" onclick="trace()">SEARCH REPORT</button>
                </div>
                
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>
                <img src="jenny_wiley_portrait.jpg" class="family-thumb" style="margin-top:20px;">
            </div>

            <div class="side-column">
                <div style="width:100%">
                    <img src="Perry_surname2.jpeg" class="family-thumb">
                    <button class="gate-btn" style="width:100%; padding:10px; font-size:0.9em;" onclick="openArchive('PERRY')">PERRY HISTORY</button>
                </div>
                <div style="width:100%">
                    <img src="henry_clay_surname.jpg" class="family-thumb">
                    <button class="gate-btn" style="width:100%; padding:10px; font-size:0.9em;" onclick="openArchive('CLAY')">CLAY HISTORY</button>
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#ff0000; border-bottom: 2px solid #ff0000;"></h2>
            <div id="v-body"></div>
            <button class="gate-btn" style="width: 100%; margin-top: 20px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-09.mp3');

        function playGateSound() {
            clickSound.play().catch(() => {}); // Catch browser block
            enterArchive();
        }

        function enterArchive() {
            const splash = document.getElementById('splash');
            const ui = document.getElementById('main-ui');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                ui.style.display = 'block';
                setTimeout(() => { ui.style.opacity = '1'; document.body.style.overflow = 'auto'; }, 50);
            }, 400);
        }

        const ancestryRecords = [
            { name: "Joshua Lee Chaney", info: "Born 1978. Technical Lead. Descendant of Perry & Chaney lines." },
            { name: "Irma Perry Chaney", info: "Matriarch of the Florida branch. Key link to Perry navigation heritage." },
            { name: "Oshel Chaney", info: "Patriarch of the WV/KY branch. Rugged Appalachian history." },
            { name: "Alden Williamson", info: "Revolutionary War Scout. Founder of Tug River settlement." },
            { name: "Jenny Sellards Wiley", info: "Frontier survivor. Captured 1789. Daughter of Hezekiah Sellards." },
            { name: "Hezekiah Sellards", info: "Navigator of the Big Sandy. Frontier explorer." },
            { name: "Abner Vance", info: "Revolutionary soldier. Patriarch of Tug River Vances." },
            { name: "Henry Clay", info: "U.S. Statesman. Kin to the Kentucky Clay pioneers." }
        ];

        function trace() {
            const q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = ancestryRecords.filter(r => r.name.toLowerCase().includes(q) || r.info.toLowerCase().includes(q));
            let h = "";
            res.forEach(r => { h += `<div class="history-entry"><div class="entry-name">${r.name}</div><div style="font-size:1.1em;">${r.info}</div></div>`; });
            document.getElementById('v-title').innerText = "REPORT: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "No records found.";
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function openArchive(key) {
            const h = { 
                'CHANEY': "The Chaneys: From Norman knights to Ohio Valley pioneers.", 
                'VANCE': "The Vances: Scotch-Irish defenders of the Appalachian frontier.", 
                'PERRY': "The Perrys: Navigators and explorers of the 1700s frontier.", 
                'CLAY': "The Clays: Statesmen and pioneers who settled early Kentucky." 
            };
            document.getElementById('v-title').innerText = key + " HISTORY";
            document.getElementById('v-body').innerHTML = `<div style="font-size:1.2em;">${h[key]}</div>`;
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
