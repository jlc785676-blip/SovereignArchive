<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive: The Six Houses</title> 
    <style>
        body { background-color: #050505; color: #d4af37; font-family: 'Georgia', serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* Wide cinematic header */
        .header-section { 
            text-align: center; padding: 60px 20px; width: 100%; background: linear-gradient(to bottom, #111, #050505);
            border-bottom: 2px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.8em; letter-spacing: 8px; text-transform: uppercase; margin: 0; color: #d4af37; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .tagline { font-size: 1.1em; color: #888; font-style: italic; margin-top: 15px; letter-spacing: 2px; }

        /* Floating Search Query Bar */
        .search-container { 
            position: sticky; top: 0; z-index: 1000; width: 100%; background: rgba(5,5,5,0.95); 
            padding: 20px 0; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 15px;
        }
        input { padding: 15px 25px; width: 400px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 1.1em; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 15px 35px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #d4af37; }

        #output { width: 95%; max-width: 1100px; padding: 40px 0; }

        /* The Chronological Heritage Card */
        .heritage-node { 
            background: #0f0f0f; border: 1px solid #222; border-left: 5px solid #d4af37; 
            padding: 30px; margin-bottom: 25px; border-radius: 0 10px 10px 0; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6); position: relative;
        }
        .year-stamp { position: absolute; top: 15px; right: 20px; color: #d4af37; font-size: 0.9em; font-weight: bold; font-family: monospace; opacity: 0.6; }
        .surname-label { color: #888; font-size: 0.75em; text-transform: uppercase; letter-spacing: 3px; display: block; margin-bottom: 10px; }
        .person-name { font-size: 1.6em; color: #fff; font-weight: bold; letter-spacing: 1px; }
        .location { color: #d4af37; font-size: 1em; margin: 10px 0; font-style: italic; }
        .story-text { color: #bbb; font-size: 1.1em; line-height: 1.8; border-top: 1px solid #222; margin-top: 20px; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div class="tagline">The Unified Lineage of Perry, Adkins, Clay, Vance, Williamson, & Chaney</div>
    </div>

    <div class="search-container">
        <input type="text" id="nameIn" placeholder="Search Surname or Keyword (e.g. Clay, Indian, Templar)">
        <button onclick="unlockVault()">Search History</button>
    </div>

    <div id="output"></div>

    <script>
        async function unlockVault() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center; color:#d4af37; font-size:1.2em;'>Consulting the Master Records...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let results = [];

                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Ancestor";
                        const date = record.match(/2 DATE (.*)/)?.[1] || "Date Unknown";
                        const place = record.match(/2 PLAC (.*)/)?.[1] || "";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        // Extract year for chronological sorting
                        const yearMatch = date.match(/\d{4}/);
                        const sortYear = yearMatch ? parseInt(yearMatch[0]) : 9999;

                        results.push({ name, date, place, notes, sortYear });
                    }
                });

                // SORT BY YEAR (Oldest to Newest)
                results.sort((a, b) => a.sortYear - b.sortYear);

                if (results.length > 0) {
                    let html = `<div style="text-align:center; color:#555; margin-bottom:40px; letter-spacing:2px;">— ${results.length} Matches Found in Chronological Order —</div>`;
                    results.forEach(r => {
                        html += `
                            <div class="heritage-node">
                                <span class="year-stamp">${r.date}</span>
                                <span class="surname-tag">Sovereign Bloodline Record</span>
                                <span class="person-name">${r.name.toUpperCase()}</span>
                                <div class="location">${r.place}</div>
                                ${r.notes ? `<div class="story-text">${r.notes}</div>` : ''}
                            </div>`;
                    });
                    output.innerHTML = html;
                } else {
                    output.innerHTML = `<p style='text-align:center;'>No record found for "${query}". Ensure the data is in the Gedcom.txt file.</p>`;
                }
            } catch (err) { output.innerHTML = "<p style='text-align:center;'>System Error: Cannot find Gedcom.txt.</p>"; }
        }
    </script>
</body>
</html>
