<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* Splash Screen - Anchored and Corrected */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: opacity 1s ease;
        }

        .splash-overlay { 
            margin-bottom: 40px; /* Anchored to bottom row */
            display: flex; justify-content: center; align-items: center; z-index: 5001; gap: 30px; flex-wrap: wrap; 
            width: 100%; padding: 20px; box-sizing: border-box;
        }

        .counter-panel { background: rgba(0, 0, 0, 0.8); border: 2px solid #d4af37; padding: 12px 20px; border-radius: 8px; color: #d4af37; font-family: 'Courier New', monospace; font-size: 1.1em; font-weight: bold; box-shadow: 0 0 15px #000; }
        .signature-box { margin-bottom: 20px; text-align: center; color: #e0c097; font-style: italic; z-index: 5001; text-shadow: 2px 2px 4px #000; }

        /* Main Dashboard Organization */
        #main-ui { display:none; text-align: center; padding-top: 5px; }
        .header-box { padding: 10px; background: rgba(26, 15, 0, 0.9); border-bottom: 3px solid #3e2723; margin-bottom: 15px; }

        .control-row {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto 25px auto; gap: 40px; padding: 0 20px;
        }
        .music-panel-small { flex: 0 0 300px; background: #211510; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; }
        .search-panel-long { flex: 1; display: flex; flex-direction: column; }
        
        input[type="text"] { 
            padding: 20px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #d4af37; border-radius: 8px; font-size: 20px; box-sizing: border-box;
        }

        /* Surname Grid - Responsive Layout */
        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.8fr 1fr; align-items: start; 
            max-width: 1500px; margin: auto; gap: 30px; padding: 10px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 50px; }
        .family-btn-group { display: flex; align-items: center; gap: 25px; justify-content: center; }
        .family-thumb { width: 140px; height: 140px; border-radius: 8px; border: 3px solid #d4af37; object-fit: cover; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        
        .central-container { position: relative; margin-top: -120px; } /* Lifted higher */
        .destiny-caption { color: #d4af37; font-weight: bold; font-size: 2.2em; margin-bottom: 25px; text-shadow: 3px 3px 6px #000; text-transform: uppercase; letter-spacing: 3px; }

        .wood-btn { 
            padding:18px 35px; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:8px; cursor:pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em; min-width: 180px;
        }
        .wood-btn:hover { border-color: #fff; box-shadow: 0 0 20px #d4af37; }
        .central-portrait { border: 5px solid #d4af37; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }

        /* Mobile Wiring - Stacking and Rotation */
        @media (max-width: 900px) {
            #splash { background-position: center 25%; }
            .splash-overlay { margin-bottom: 60px; gap: 15px; flex-direction: column; }
            .control-row { flex-direction: column; gap: 20px; }
            .music-panel-small { width: 95%; flex: none; }
            .search-panel-long { width: 95%; flex: none; }
            .archive-grid { grid-template-columns: 1fr; gap: 40px; }
            .central-container { order: -1; margin-top: 10px; margin-bottom: 40px; }
            .destiny-caption { font-size: 1.6em; }
            .family-thumb { width: 120px; height: 120px; }
        }

        /* The Vault - High-Volume Data Display */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#0a0a0a; border:2px solid #d4af37; padding:40px; border-radius:10px; text-align: left; max-width: 1100px; margin: 40px auto; }
        .history-entry { border-bottom: 1px solid #333; padding: 30px 0; color: #fff; line-height: 2.0; font-size: 1.25em; white-space: pre-wrap; }
        .history-section-title { color: #d4af37; border-bottom: 1px solid #d4af37; margin-top: 40px; margin-bottom: 15px; padding-bottom: 5px; font-size: 1.6em; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay">
            <button class="wood-btn" style="font-size: 1.4em;" onclick="enterArchive()">ENTER THE SAGA</button>
            <div class="counter-panel">VISITORS: <span id="v-count">0</span></div>
        </div>
        <div class="signature-box">By Josh Chaney</div>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 2px; font-size: 2.2em;">THE SOVEREIGN ARCHIVE</h1>
        </div>

        <div class="control-row">
            <div class="music-panel-small">
                <iframe width="100%" height="150" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="search-panel-long">
                <input type="text" id="nameSearch" placeholder="Trace the bloodline history...">
                <button class="wood-btn" style="margin-top: 15px; align-self: flex-end;" onclick="trace()">TRACE FULL HISTORY</button>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-column">
                <div class="family-btn-group">
                    <img src="william_surname.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openFullChaney()">CHANEY</button>
                </div>
                <div class="family-btn-group">
                    <img src="raymond_surname.jpeg" class="family-thumb">
                    <button class="wood-btn" onclick="quick('VANCE')">VANCE</button>
                </div>
                <div class="family-btn-group">
                    <img src="sellards.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="quick('SELLARDS')">SELLARDS</button>
                </div>
            </div>

            <div class="central-container">
                <div class="destiny-caption">CHOOSE YOUR DESTINY</div>
                <img src="jenny_wiley_portrait.jpg" class="central-portrait">
            </div>

            <div class="side-column">
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="quick('PERRY')">PERRY</button>
                    <img src="Jenny_wiley_ surname.jpeg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="quick('CLAY')">CLAY</button>
                    <img src="clay.jpg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="quick('WILLIAMSON')">WILLIAMSON</button>
                    <img src="williamson.jpg" class="family-thumb">
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37; border-bottom: 2px solid #d4af37; padding-bottom: 15px;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 30px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        let db = [];
        function updateCounter() {
            let count = localStorage.getItem('visitorCount') || 15248;
            count = parseInt(count) + 1;
            localStorage.setItem('visitorCount', count);
            document.getElementById('v-count').innerText = count.toLocaleString();
        }
        window.onload = updateCounter;

        function enterArchive() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                load();
            }, 1000);
        }

        async function load() {
            try {
                const r = await fetch('Gedcom.txt?v=' + Date.now());
                const t = await r.text();
                db = t.split('0 @').filter(x => x.trim()).map(x => {
                    const n = x.match(/1 NAME (.*)/);
                    const notes = [...x.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                    return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: x.toLowerCase(), notes: notes };
                });
            } catch (e) { console.log("Archive syncing..."); }
        }

        function quick(n) { document.getElementById('nameSearch').value = n; trace(); }

        /* SPECIAL ENGINE FOR THE COMPLETE CHANEY ARCHIVE */
        function openFullChaney() {
            let title = "THE CHANEY ANCESTRY ARCHIVE";
            let body = `
                <div class="history-section-title">Section 1: Introduction & Purpose</div>
                <div class="history-entry">This document serves as the master genealogical archive of the Chaney family, consolidating all known family history information across multiple bloodlines including Chaney, Vance, Perry, Clay, Watts, Dyer, and Davis. Compiled for Joshua Chaney of Marysville, Ohio (April 2026).</div>
                
                <div class="history-section-title">Section 2: Four-Generation Pedigree Overview</div>
                <div class="history-entry"><strong>Generation 1:</strong> Joshua "Josh" Chaney (b. c. 1978).<br><strong>Generation 2:</strong> Oshel Chaney (Father) & Erma Perry (Mother).<br><strong>Generation 3:</strong> Newman Chaney & Arminda Vance (Paternal); Walter Lake Perry & Pansey Perry (Maternal).<br><strong>Generation 4:</strong> Leonard Chaney, John Hobert Vance, Lillie Lily Dyer, Ira Perry, Sarah Perry, Erie Elmer Watts, Thomas John Clay, Clara Davis.</div>

                <div class="history-section-title">Section 3: The Chaney Line</div>
                <div class="history-entry">The patrilineal line begins with Leonard Chaney (1895–1975), the foundation of the documented line. He was the great-grandfather of Joshua Chaney. Newman Chaney (d. 2017) was his son, who married Arminda Vance. Their son, Oshel Chaney (b. 1949), is the father of Joshua.</div>

                <div class="history-section-title">Section 6: The Clay Line & Yorkshire Lineage</div>
                <div class="history-entry">The Clay line potential connection traces back to Yorkshire, England. Migration follows: Yorkshire -> Colonial Virginia -> Appalachian regions (Kentucky/Ohio). This branch includes Thomas John Clay and Clara Davis (1887–1974).</div>

                <div class="history-section-title">Section 9: Indigenous Heritage</div>
                <div class="history-entry">Oral histories within the Perry and Vance lines include references to Indigenous heritage. Active research includes tribal records, Indian rolls, and DNA testing.</div>

                <div class="history-section-title">Section 11: Amos Keener — Military Records</div>
                <div class="history-entry">Amos Keener's military service and pension records are integral to the family history. This section tracks his enlistment, rank, and unit assignments as a "navigator" and life influence.</div>
            `;
            document.getElementById('v-title').innerText = title;
            document.getElementById('v-body').innerHTML = body;
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function trace() {
            const q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (q === 'chaney') { openFullChaney(); return; }
            if (!q) return;
            const res = db.filter(x => x.raw.includes(q));
            let h = "";
            res.forEach(x => {
                h += `<div class="history-entry"><h3 style="color:#d4af37; margin-top:0;">${x.name}</h3>${x.notes}</div>`;
            });
            document.getElementById('v-title').innerText = "ARCHIVE TRACE: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "Searching deep records...";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
