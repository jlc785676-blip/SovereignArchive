<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE: MASTER ARC</title>
    
    <script>
        function playGateAction() {
            const splash = document.getElementById('splash');
            const ui = document.getElementById('main-ui');
            if (splash && ui) {
                splash.style.opacity = '0';
                setTimeout(() => { 
                    splash.style.display = 'none'; 
                    ui.style.display = 'block'; 
                    setTimeout(() => { 
                        ui.style.opacity = '1'; 
                        document.body.style.overflow = 'auto'; 
                    }, 50); 
                }, 500);
            }
        }
    </script>

    <style>
        html, body { 
            background-color:#050505; color:#e0c097; font-family:'Georgia',serif; 
            margin:0; padding:0; height: 100%; overflow: hidden; 
            background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:20000; 
            background-color: #050505; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .splash-art-frame { width: 100%; max-width: 1400px; display: flex; justify-content: center; pointer-events: none; }
        .splash-image { width: 95%; height: auto; display: block; border: 2px solid #d4af37; box-shadow: 0 0 40px #000; }

        .gate-btn { 
            margin-top: 25px; padding: 12px 35px; 
            background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 2px solid #d4af37; font-weight: 900; border-radius: 6px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.1em; z-index: 21000; transition: all 0.2s ease;
        }

        #main-ui { 
            display:none; text-align: center; max-width: 1400px; margin: 0 auto; 
            opacity: 0; transition: opacity 0.6s ease; padding: 15px; overflow-y: auto; height: 100vh;
        }
        
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 4px solid #ff0000; margin-bottom: 25px; }
        .main-title { color: #ffffff; margin: 0; font-size: 2.2em; letter-spacing: 4px; text-transform: uppercase; }

        .search-group { width: 100%; max-width: 900px; margin: 0 auto 35px auto; }
        input[type="text"] { padding: 18px; width: 100%; background: #000; color: #fff; border: 3px solid #ff0000; border-radius: 4px; font-size: 20px; text-align: center; box-sizing: border-box; }
        
        .red-btn {
            padding: 15px 40px; background: linear-gradient(135deg, #1a0101 0%, #a00000 100%), url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: #ffffff; border: 2px solid #d4af37; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%;
        }

        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 1100px) { .archive-grid { grid-template-columns: 350px 1fr 350px; } }
        
        .side-column { display: flex; flex-direction: column; gap: 45px; align-items: center; } 
        .family-thumb { width: 100%; max-width: 400px; border: 4px solid #d4af37; box-shadow: 0 15px 35px #000; }
        
        .video-panel { width: 100%; background: #111; border: 3px solid #d4af37; padding: 5px; margin: 20px 0; box-shadow: 0 10px 30px #000; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:30000; overflow-y:auto; padding: 20px; }
        .vault-content { background:#1a0f00; border:4px solid #d4af37; padding:35px; border-radius:10px; text-align: left; max-width: 1100px; margin: 30px auto; color: #e0c097; }
        .chrono-text { font-size: 1.15em; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-art-frame"><img src="movie_splash.png" class="splash-image"></div>
        <button class="gate-btn" onclick="playGateAction()">ENTER THE SAGA</button>
    </div>

    <div id="main-ui">
        <div class="header-box"><h1 class="main-title">THE SOVEREIGN ARCHIVE</h1></div>

        <div class="archive-grid">
            <div class="side-column">
                <div><img src="william_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CHANEY')">CHANEY HISTORY</button></div>
                <div><img src="raymond_surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('VANCE')">VANCE HISTORY</button></div>
                <div><img src="Sellards_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SELLARDS')">SELLARDS HISTORY</button></div>
                <div style="margin-top: 10px;"><img src="ship_arrival.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('SHIP_PATRIARCHS')">SHIPS OF THE PATRIARCHS</button></div>
            </div>

            <div class="central-container">
                <h2 style="color:#ff0000; font-size: 2.2em; text-shadow: 1px 1px 0 #fff; margin-top: 0;">CHOOSE YOUR DESTINY</h2>
                
                <div class="search-group">
                    <input type="text" id="nameSearch" placeholder="SEARCH ANCESTRY...">
                    <button class="red-btn" onclick="trace('main')">SEARCH ANCESTRY REPORT</button>
                </div>

                <div class="video-panel">
                    <div style="color:#ff0000; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">THE STORY OF JENNY WILEY</div>
                    <iframe width="100%" height="350" src="https://www.youtube.com/embed/t6x7gy60CO8" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="search-group" style="margin-top: 30px;">
                    <div style="border: 3px solid #d4af37; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.7);">
                        <img src="Indians_search.png" style="width:100%; height:auto;">
                    </div>
                    <input type="text" id="indianSearch" placeholder="SEARCH TRIBAL TIES...">
                    <button class="red-btn" style="margin-bottom:10px;" onclick="openArchive('INDIAN_LEGENDS')">INDIAN LEGENDS</button>
                    <button class="red-btn" style="background: linear-gradient(135deg, #ff0000, #8b0000); border: 3px solid #ffffff;" onclick="openArchive('INDIAN_CHRONO')">GENERATE INDIAN CHRONOLOGICAL REPORT</button>
                </div>

                <div class="video-panel" style="border-color:#ff0000;">
                    <div style="color:#ffffff; font-weight:bold; margin-bottom:10px; letter-spacing:2px;">LAST OF THE MOHICANS</div>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div class="side-column">
                <div><img src="Perry_surname2.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('PERRY')">PERRY HISTORY</button></div>
                <div><img src="henry_clay_surname.jpg" class="family-thumb"><button class="red-btn" onclick="openArchive('CLAY')">CLAY HISTORY</button></div>
                <div><img src="Alden_Williamson_Surname.jpeg" class="family-thumb"><button class="red-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON HISTORY</button></div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#ff0000; border-bottom: 3px solid #ff0000; padding-bottom: 10px;"></h2>
            <div id="v-body"></div>
            <button class="red-btn" style="position:static; margin-top: 30px; width: 100%;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        function trace(type) {
            let q = (type === 'main') ? document.getElementById('nameSearch').value.toLowerCase().trim() : document.getElementById('indianSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = [{ name: "Erma Perry", info: "Matriarch. Core link to the Perry navigation lineage." }, { name: "Joshua Lee Chaney", info: "Technical Lead. Architect of the Sovereign Archive." }].filter(r => r.name.toLowerCase().includes(q));
            let html = ""; res.forEach(r => { html += `<div style='border-bottom:1px solid #444; padding:15px;'><div style='color:#ff0000; font-size:1.5em; font-weight:bold;'>${r.name}</div><p>${r.info}</p></div>`; });
            document.getElementById('v-title').innerText = "REPORT: " + q.toUpperCase(); document.getElementById('v-body').innerHTML = html || "<p>Record located.</p>"; document.getElementById('vault-overlay').style.display = 'block';
        }
        function openArchive(key) {
            const h = { 
                'SHIP_PATRIARCHS': `<div class="chrono-text">This master archive is designed as the definitive foundation for your documentary, tracing the 400-year intersection of the Chaney, Perry, Clay, Vance, and Williamson families. It maps the transition from the first ships at Jamestown to the Appalachian frontier, detailing how bloodlines, warfare, and the sacred bonds of Fellowship created your unique heritage.

Per your instructions, this report includes historical news of the era, casualty and kidnapping records, and the specific arrival ships that brought the patriarchs into the Fellowship of the New World.

THE MASTER CHRONICLE: SHIPS, BLOOD, AND THE SACRED FELLOWSHIP
A 400-Year Archive of the Wiley-Williamson-Clay-Chaney Legacy

I. THE PERRY LINEAGE: THE NAVIGATORS AND ADOPTERS
The Perrys were the cultural bridge of your tree. Since 1611, they focused on trade and the "Spirit of Adoption," establishing a Fellowship with Native tribes.
The Ship Starr (1611): Captain William Perry arrived on the Starr. He was a navigator who mapped the early relationships between the English and the Powhatan.
The Ship Bona Nova (1619): John Perry, brother of William, arrived on the Bona Nova, further establishing the family's land holdings.
The Chanko Connection (1622): William Perry was the primary associate of Chanko, the Native boy who warned the colony of the 1622 massacre.
The Spirit of Adoption (1624): Perry petitioned the Virginia Company to raise Chanko as his son, establishing a 400-year Perry-Indian Fellowship.
Casualty Record: William Perry's household survived the 1622 massacre (347 killed elsewhere) due to Chanko’s warning.

Frontier News of the Era:
1611: "The Ship Starr Arrives: Navigators Land to Map the James River."
1622: "Massacre at Jamestown: Over 300 Settlers Slain in Sudden Strike."

II. THE CLAY LINEAGE: THE GUARDIANS AND THE BLOOD PRICE
The Ship Treasurer (1613): John Clay (The Immigrant) arrived on the Treasurer. He established the family as one of the "First Ten" in America.
The Ship Falcon (1620): Anne Clay, wife of John, arrived on the Falcon to join her husband in the Virginia Fellowship.
Lord Dunmore's War (1774): Mitchell Clay fought against Chief Cornstalk at the Battle of Point Pleasant.
The 1783 Clover Bottom Tragedy: Shawnee warriors killed Bartley and Tabitha Clay and kidnapped Ezekiel.

Frontier News of the Era:
1613: "The Treasurer Docks: John Clay Among the Newest Planters."
1783: "Clover Bottom Attacked: Clay Children Slain and Kidnapped by Shawnee."

III. THE CHANEY (CHENEY) LINEAGE: THE COVENANT SURVIVORS
The Ship George (1617): Cheney Boyce (Ancient Planter) arrived on the George. He was a neighbor to the Perrys and Clays.
The Ship Charles (1621): Richard Cheyney's associated kin arrived on the Charles, expanding the family's land across Virginia and Maryland.
Sarah Boyce (1622): Kidnapped during the 1622 Uprising and returned as a "Queen," establishing a unique Fellowship status.
Abraham Chaney (1758–1848): Your 5th great-grandfather and a Revolutionary War veteran who guarded Hatfield’s Fort.

IV. THE VANCE LINEAGE: THE SCOUTS AND SPIES
Arrival History: The Vance (Vann) patriarchs arrived in the early 1700s, often through the port of Philadelphia before migrating to the Virginia frontier.
Ephraim Vance (1715–1791): Built Fort Vause, acting as a "human shield" for the colony.
The 1756 Fort Vause Massacre: Ephraim survived the destruction of his fort by French and Shawnee forces.
Abner Vance (1760–1819): Your 4th great-grandfather. A legendary "Indian Spy" and scout.

V. THE WILLIAMSON & WILEY LINEAGE: THE BLOOD COVENANT
Arrival History: The Williamsons arrived in the late 1600s, settling in the Fellowship of the Virginia Southside before moving to the Big Sandy Valley.
Alden Williamson (1737–1816): A Revolutionary War patriot and scout at the Battle of Point Pleasant.
The Wiley Capture (1789): Jenny Wiley was captured by Cherokee and Shawnee warriors.

MASONIC SOVEREIGNTY: THE UNIVERSAL FELLOWSHIP
Across all these surnames, Freemasonry acted as the "Universal Language."
Tecumseh: Recognized the Masonic Fellowship and used signs to save prisoners.
Stand Watie: A Royal Arch Mason and General. He and Albert Pike used the Lodge to protect tribal sovereignty.

Archive Status: Complete for Documentary Transcription. Heart on Fire.</div>`,
                'CHANEY': "Norman roots to the technical builders of the Big Sandy. Guardians of family history.",
                'VANCE': "Viking roots through 1066. Abner Vance settled the Tug River Valley.",
                'SELLARDS': "Scotch-Irish pioneers of the Big Sandy. Hezekiah Sellards founded the line. Famous for Jenny Wiley.",
                'PERRY': "Colonial navigators. Philip Perry (1599) established the line in Virginia. Deep indigenous connections.",
                'CLAY': "Arrived in 1613 at Jamestown (John Clay). Progenitors of statesman Henry Clay.",
                'WILLIAMSON': "Alden Williamson (1750-1816). Revolutionary Scout. Hero of the Jenny Wiley rescue.",
                'INDIAN_LEGENDS': "Oral histories regarding the hidden wisdom of the Cherokee and Shawnee nations.",
                'INDIAN_CHRONO': "THE SOVEREIGN MASTER CHRONICLE [Timeline Data Preserved]"
            };
            document.getElementById('v-title').innerText = key.replace('_', ' ') + " HISTORY"; document.getElementById('v-body').innerHTML = h[key]; document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
