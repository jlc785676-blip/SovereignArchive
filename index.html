<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMA PERRY ANCESTORS</title> 
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 30px; background: #111; width: 95%; max-width: 800px; text-align: center; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); border-radius: 12px; }
        h1 { letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 15px; margin-bottom: 25px; font-size: 1.6em; }
        .search-area { margin-bottom: 30px; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1.1em; }
        button { padding: 15px 30px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
        
        #output { text-align: left; max-height: 600px; overflow-y: auto; padding-right: 10px; }
        .ancestor-entry { background: #1a1a1a; border-left: 3px solid #444; padding: 12px; margin-bottom: 8px; border-radius: 0 4px 4px 0; font-size: 0.9em; }
        .target-entry { background: #222; border-left: 5px solid #d4af37; padding: 20px; border-radius: 0 6px 6px 0; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .tag { color: #888; font-size: 0.7em; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .name { color: #fff; font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>ERMA PERRY ANCESTORS</h1> 
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Enter Ancestor Name">
            <button onclick="queryLineage()">Trace 30</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        async function queryLineage() {
            const searchName = document.getElementById('nameIn').value.trim();
            const output = document.getElementById('output');
            if (!searchName) return;

            output.innerHTML = "<p style='color:#888;'>Consulting the Master Records...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                
                let matchIdx = -1;
                for (let i = 0; i < records.length; i++) {
                    if (records[i].toLowerCase().includes(searchName.toLowerCase()) && records[i].includes('1 NAME')) {
                        matchIdx = i;
                        break;
                    }
                }

                if (matchIdx !== -1) {
                    let html = '<div style="color:#d4af37; font-size:0.8em; margin-bottom:15px; text-transform:uppercase;">30 Records Found Prior to Match:</div>';
                    
                    const start = Math.max(1, matchIdx - 30);
                    for (let j = start; j < matchIdx; j++) {
                        const name = records[j].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Unknown Record";
                        const date = records[j].match(/2 DATE (.*)/)?.[1] || "Date Not Listed";
                        const place = records[j].match(/2 PLAC (.*)/)?.[1] || "";
                        
                        html += `<div class="ancestor-entry">
                                    <span class="name">${name}</span><br>
                                    <span style="color:#666;">${date} ${place ? ' | ' + place : ''}</span>
                                 </div>`;
                    }

                    const targetName = records[matchIdx].match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || searchName;
                    const targetDate = records[matchIdx].match(/2 DATE (.*)/)?.[1] || "Date Not Listed";
                    const targetPlace = records[matchIdx].match(/2 PLAC (.*)/)?.[1] || "";

                    html += `<div class="target-entry">
                                <span class="tag">Target Record Found:</span>
                                <span class="name" style="font-size:1.3em; color:#d4af37;">${targetName.toUpperCase()}</span><br>
                                <p style="margin:10px 0 0 0; color:#ccc;">${targetDate}<br>${targetPlace}</p>
                             </div>`;
                    
                    output.innerHTML = html;
                } else {
                    output.innerHTML = "No record found for '" + searchName + "'.";
                }
            } catch (err) {
                output.innerHTML = "Error: Ensure Gedcom.txt is present in your GitHub folder.";
            }
        }
    </script>
</body>
</html>
