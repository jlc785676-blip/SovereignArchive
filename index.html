<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Master Archive</title>
    <style>
        :root {
            --primary: #3e2723;
            --secondary: #5d4037;
            --accent: #c0b283;
            --bg: #f4f1ea;
            --white: #ffffff;
        }

        body { font-family: 'Segoe UI', serif; background-color: var(--bg); margin: 0; color: #333; line-height: 1.8; }
        
        /* THE CLEAN SPLASH PAGE */
        .splash-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--white);
            transition: opacity 0.5s ease;
        }
        .splash-card { padding: 40px; text-align: center; max-width: 500px; width: 90%; }
        h1.master-title { color: var(--primary); margin-bottom: 40px; font-size: 42px; letter-spacing: 3px; text-transform: uppercase; border-bottom: 3px solid var(--primary); padding-bottom: 10px;}
        
        input[type="password"] {
            width: 100%; padding: 20px; border: 2px solid var(--primary); border-radius: 4px;
            font-size: 24px; margin-bottom: 25px; box-sizing: border-box; text-align: center; background-color: #fafafa;
            outline: none;
        }
        
        .btn {
            background-color: var(--primary); color: #f4f1ea; padding: 18px 40px; border: none;
            border-radius: 4px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover { background-color: var(--secondary); letter-spacing: 2px; }

        /* MAIN ENCYCLOPEDIA CONTENT */
        #main-archive { display: none; padding: 40px; max-width: 1400px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 60px; }
        #archiveSearch {
            width: 80%; padding: 20px; font-size: 20px; border: 2px solid var(--accent); border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); outline: none; margin-top: 30px;
        }

        /* VIDEO SECTION: JENNY WILEY */
        .video-container { margin: 60px 0; background: var(--primary); padding: 40px; border-radius: 15px; color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .video-container h2 { border-bottom: 2px solid var(--accent); padding-bottom: 15px; font-size: 28px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; margin-top: 25px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; border: 3px solid var(--accent); }

        /* GRID SYSTEM & INTERACTIVE CARDS */
        .archive-grid { display: grid; grid-template-columns: 1fr; gap: 50px; }
        
        .profile-card { 
            background: var(--white); border: 1px solid #d7ccc8; border-radius: 12px; 
            overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.05); cursor: pointer;
            transition: transform 0.3s ease;
        }
        .profile-card:hover { transform: scale(1.01); }
        
        .card-image-box { width: 100%; height: 400px; overflow: hidden; position: relative; }
