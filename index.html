<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN ARCHIVE</title> 
    <style>
        body { background-color: #050505; color: #d4af37; font-family: 'Georgia', serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .header-section { text-align: center; padding: 60px 20px; width: 100%; background: #0a0a0a; border-bottom: 2px solid #d4af37; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        h1 { font-size: 2.8em; letter-spacing: 6px; text-transform: uppercase; margin: 0; }
        .search-container { position: sticky; top: 0; z-index: 1000; width: 100%; background: rgba(5,5,5,0.95); padding: 20px 0; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 15px; }
        input { padding: 15px 25px; width: 400px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 1.1em; outline: none; }
        button { padding: 15px 35px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #d4af37; }
        #output { width: 90%; max-width: 1100px; padding: 40px 0; }
        .heritage-node { background: #0f0f0f; border-left: 8px solid #d4af37; padding: 35px; margin-bottom: 25px; border-radius: 0 10px 10px 0; box-shadow: 10px 10px 30px rgba(0,0,0,0.6); }
        .name-banner { font-size: 1.8em; color: #fff; font-weight: bold; text-transform: uppercase; }
        .story-content { color: #ccc; font-size: 1.2em; line-height: 1.8; border-top: 1px solid #222; margin-top: 20px; padding-top: 15px; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header-section">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div style="color:#888; font-style:italic; margin-top:15px;">The Master Records of the Chaney, Perry, Vance, & Clay Bloodlines</div>
    </div>
    <div class="search-container">
        <input type="text" id="nameIn" placeholder="Search: Cornstalk, Indian, Vance, Clay...">
        <button onclick="smartSearch()">Search Vault</button>
    </div>
    <div id="output"></div>

    <script>
        async function smartSearch() {
            const query = document.getElementById('nameIn').value.trim().toLowerCase();
            const output = document.getElementById('output');
            if (!query) return;
            output.innerHTML = "<p style='text-align:center; color:#d4af37;'>Consulting the Master Ledger...</p>";
            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let html = "";
                let count = 0;
                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        count++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Historical Context";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        html += `<div class="heritage-node">
                                    <div class="name-banner">${name}</div>
                                    <div class="story-content">${notes || "Lineage context present in master file."}</div>
                                 </div>`;
                    }
                });
                output.innerHTML = count > 0 ? html : `<p style='text-align:center;'>No record for "${query}" found. Check spelling or ensure it is in Gedcom.txt.</p>`;
            } catch (err) { output.innerHTML = "Error: File Access Denied."; }
        }
    </script>
</body>
</html>
