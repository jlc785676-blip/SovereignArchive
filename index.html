<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { 
            background-color: #050505; 
            color: #e0c097; 
            font-family: 'Georgia', serif; 
            margin: 0; padding: 0; 
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* HEADER & SEARCH */
        .header-fixed { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-bottom: 3px solid #3e2723; 
            padding: 8px 0; box-shadow: 0 4px 15px #000;
        }
        .search-container { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        input { 
            padding: 12px; width: 88%; background: #000; border: 2px solid #5d4037; 
            color: #fff; border-radius: 6px; font-size: 16px; outline: none;
        }

        /* THE WOODEN PUSH BUTTONS */
        .wood-btn { 
            padding: 14px; width: 92%; 
            /* Wood Grain Texture + Glossy Overlay */
            background: linear-gradient(rgba(255,255,255,0.1), rgba(0,0,0,0.4)), 
                        url('https://www.transparenttextures.com/patterns/wood-pattern.png'),
                        #5d4037;
            color: #fbe9e7; border: 2px solid #211510; 
            font-weight: bold; cursor: pointer; text-transform: uppercase;
            border-radius: 8px; 
            box-shadow: 0 6px 0 #211510, 0 8px 15px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px #000;
            transition: all 0.1s;
            margin-bottom: 8px;
            display: block;
        }

        .wood-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #211510;
        }

        .indian-btn { background-color: #8b0000; border-color: #420000; }

        /* FOOTER BUTTONS */
        .footer-fixed { 
            position: fixed; bottom: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-top: 3px solid #3e2723; 
            padding: 10px 0; display: flex; flex-wrap: wrap; 
            justify-content: center; gap: 6px; 
        }

        .nav-btn { 
            background: linear-gradient(145deg, #5d4037, #3e2723); 
            color: #d4af37; border: 1px solid #211510; 
            padding: 12px 16px; font-size: 11px; font-weight: bold; 
            text-transform: uppercase; border-radius: 4px; 
            box-shadow: 0 4px 0 #000;
        }

        .nav-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }

        #content-wrapper { margin-top: 190px; margin-bottom: 160px; padding: 12px; }
        .tree-node { background: rgba(26, 15, 0, 0.95); border-left: 6px solid #d4af37; padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }

        #vault-overlay { 
            display:none; position: fixed; top: 5%; left: 5%; width: 90%; height: 85%; 
            background: #0c0c0c; border: 4px solid #5d4037; z-index: 3000; 
            overflow-y: auto; padding: 15px; background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }
    </style>
</head>
<body>

    <div class="header-fixed">
        <div class="search-container">
            <input type="text" id="nameSearch" placeholder="Trace Bloodline...">
            <button class="wood-btn" onclick="executeSearch('name')">EXECUTE TRACE</button>
            <input type="text" id="indianSearch" placeholder="Heritage Keywords...">
            <button class="wood-btn indian-btn" onclick="executeSearch('indian')">EXPLORE HERITAGE</button>
        </div>
    </div>

    <div id="content-wrapper"><div id="output-area"></div></div>

    <div id="vault-overlay">
        <h2 id="v-title" style="color:#d4af37; text-align:center; text-shadow: 2px 2px 4px #000;"></h2>
        <div id="v-body"></div>
        <button class="wood-btn" onclick="document.getElementById('vault-overlay').style.display='none'">CLOSE RECORD</button>
    </div>

    <div class="footer-fixed">
        <button class="nav-btn" onclick="openMaster('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="openMaster('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="openMaster('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="openMaster('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="buttonThump(); openMaster('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="openMaster('WILLIAMSON')">WILLIAMSON</button>
    </div>

    <audio id="mohicansPlayer" loop><source src="The Last of the Mohicans - Promontory (Main Theme).mp3" type="audio/mpeg"></audio>
    <audio id="woodThump" preload="auto"><source src="https://www.soundjay.com/buttons/sounds/button-14.mp3" type="audio/mpeg"></audio>

    <script>
        let db = [];
        const thump = document.getElementById('woodThump');
        const music = document.getElementById('mohicansPlayer');

        async function init() {
            const res = await fetch('Gedcom.txt?v=' + new Date().getTime());
            const data = await res.text();
            const items = data.split('0 @').filter(i => i.trim().length > 0);
            db = items.map(i => {
                const n = i.match(/1 NAME (.*)/);
                const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
            });
        }

        function buttonThump() {
            thump.currentTime = 0;
            thump.play().catch(e => console.log("Sound ready after first tap"));
        }

        function openMaster(s) {
            buttonThump();
            startMusic();
            const r = db.find(i => i.raw.includes("hist_" + s.toLowerCase() + "_full"));
            if (r) {
                document.getElementById('v-title').innerText = s + " MASTER CHRONOLOGY";
                document.getElementById('v-body').innerHTML = format(r.notes);
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }

        function executeSearch(m) {
            buttonThump();
            startMusic();
            const q = (m === 'name' ? document.getElementById('nameSearch') : document.getElementById('indianSearch')).value.toLowerCase();
            const results = db.filter(r => r.raw.includes(q));
            let h = "";
            results.forEach(r => { h += `<div class="tree-node"><div class="name-banner">${r.name}</div><div class="story-box">${format(r.notes)}</div></div>`; });
            document.getElementById('output-area').innerHTML = h || "<p style='text-align:center;'>Searching...</p>";
        }

        function startMusic() {
            if (music.paused) {
                music.volume = 0; music.play();
                let vol = 0;
                let fade = setInterval(() => { if (vol < 0.4) { vol += 0.02; music.volume = vol; } else { clearInterval(fade); } }, 400);
            }
        }

        function format(t) {
            let f = t.replace(/IMAGE_REF: (.*?)(?=\n|$|\r)/g, "<img src='$1' style='width:100%; border:2px solid #5d4037; margin:15px 0;'>");
            return f.replace(/(SECTION.*?|GENERATION.*?|HISTORY:|MOTTO:|I\.|II\.|III\.|IV\.|V\.|VI\.|Viking|Conqueror|Rollo|Ragnar)/g, "<strong>$1</strong>");
        }

        window.onload = init;
        document.addEventListener('click', () => { if(music.paused) startMusic(); }, { once: true });
    </script>
</body>
</html>
