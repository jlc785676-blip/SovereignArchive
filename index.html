<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { 
            background-color: #050505; color: #e0c097; font-family: 'Georgia', serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        .header-fixed { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-bottom: 3px solid #3e2723; padding: 10px 0;
        }

        /* GLOSSY WOOD BUTTONS */
        .wood-btn { 
            padding: 14px; width: 92%; 
            background: linear-gradient(rgba(255,255,255,0.15), rgba(0,0,0,0.5)), 
                        url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #5d4037;
            color: #fbe9e7; border: 2px solid #211510; font-weight: bold; 
            border-radius: 8px; box-shadow: 0 6px 0 #211510;
            text-shadow: 1px 1px 2px #000; transition: all 0.1s; margin-bottom: 8px;
        }
        .wood-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #211510; }

        .music-toggle-btn {
            background: linear-gradient(145deg, #2e7d32, #1b5e20);
            color: #fff; width: 92%; margin-bottom: 10px; border: 2px solid #0a2f0c;
        }

        #splash-collage {
            margin-top: 130px; margin-bottom: 190px; padding: 15px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .collage-img { width: 100%; border: 2px solid #5d4037; border-radius: 4px; box-shadow: 0 4px 10px #000; }
        .wide { grid-column: span 2; }

        #vault-overlay { 
            display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 5, 5, 0.99); z-index: 3000; overflow-y: auto; 
            padding: 20px; box-sizing: border-box;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }
        .vault-content { 
            max-width: 600px; margin: 40px auto; 
            background: #111; border: 3px solid #d4af37; padding: 20px; border-radius: 8px;
        }

        .footer-fixed { 
            position: fixed; bottom: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-top: 3px solid #3e2723; 
            padding: 8px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; 
        }
        .nav-btn { 
            background: linear-gradient(145deg, #5d4037, #3e2723); 
            color: #d4af37; border: 1px solid #211510; padding: 8px;
            font-size: 10px; font-weight: bold; border-radius: 4px; width: 30%;
        }

        .history-item { margin-bottom: 30px; }
        .history-item img { width: 100%; border: 1px solid #5d4037; margin: 15px 0; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header-fixed">
        <center>
            <input type="text" id="nameSearch" style="padding:12px; width:88%; background:#000; color:#fff; border:2px solid #5d4037; border-radius:6px; margin-bottom:8px;" placeholder="Trace Bloodline...">
            <button class="wood-btn" onclick="executeSearch()">EXECUTE TRACE</button>
        </center>
    </div>

    <div id="splash-collage">
        <img src="viking-ships-painting.jpg" class="collage-img wide">
        <img src="ROLLO TOO BIG FOR HORSE .jpeg" class="collage-img">
        <img src="William the Conqueror king portr.jpg" class="collage-img">
        <img src="Jenny Wiley.jpg" class="collage-img wide">
    </div>

    <div id="vault-overlay">
        <div class="vault-content">
            <h2 id="v-title" style="color:#d4af37; text-align:center; border-bottom:2px solid #d4af37; padding-bottom:10px;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" onclick="closeVault()">RETURN TO ARCHIVE</button>
        </div>
    </div>

    <div class="footer-fixed">
        <button id="musicBtn" class="wood-btn music-toggle-btn" onclick="toggleMohicans()">LAST OF THE MOHICANS: PLAY</button>
        
        <button class="nav-btn" onclick="openMaster('CHANEY')">CHANEY</button>
        <button class="nav-btn" onclick="openMaster('VANCE')">VANCE</button>
        <button class="nav-btn" onclick="openMaster('PERRY')">PERRY</button>
        <button class="nav-btn" onclick="openMaster('CLAY')">CLAY</button>
        <button class="nav-btn" onclick="openMaster('SELLARDS')">SELLARDS</button>
        <button class="nav-btn" onclick="openMaster('WILLIAMSON')">WILLIAMSON</button>
    </div>

    <audio id="mohicansPlayer" loop preload="auto">
        <source src="The Last of the Mohicans - Promontory (Main Theme).mp3" type="audio/mpeg">
    </audio>
    <audio id="woodThump"><source src="https://www.soundjay.com/buttons/sounds/button-14.mp3" type="audio/mpeg"></audio>

    <script>
        const thump = document.getElementById('woodThump');
        const music = document.getElementById('mohicansPlayer');
        const mBtn = document.getElementById('musicBtn');
        let db = [];

        async function init() {
            const res = await fetch('Gedcom.txt?v=' + new Date().getTime());
            const data = await res.text();
            const items = data.split('0 @').filter(i => i.trim().length > 0);
            db = items.map(i => {
                const n = i.match(/1 NAME (.*)/);
                const notes = [...i.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: i.toLowerCase(), notes: notes };
            });
        }

        function playThump() { thump.currentTime = 0; thump.play().catch(e=>{}); }

        // THE NEW MUSIC TOGGLE
        function toggleMohicans() {
            playThump();
            if (music.paused) {
                music.volume = 0.5;
                music.play();
                mBtn.innerText = "LAST OF THE MOHICANS: ON";
                mBtn.style.background = "linear-gradient(145deg, #1b5e20, #0a2f0c)";
            } else {
                music.pause();
                mBtn.innerText = "LAST OF THE MOHICANS: PLAY";
                mBtn.style.background = "linear-gradient(145deg, #2e7d32, #1b5e20)";
            }
        }

        function format(t) {
            let f = t.replace(/IMAGE_REF: (.*?)(?=\n|$|\r)/g, "<img src='$1'>");
            return f.replace(/(SECTION.*?|GENERATION.*?|HISTORY:|MOTTO:|I\.|II\.|III\.|IV\.|V\.|VI\.)/g, "<strong>$1</strong>");
        }

        function openMaster(s) {
            playThump();
            const r = db.find(i => i.raw.includes("hist_" + s.toLowerCase() + "_full"));
            if (r) {
                document.getElementById('v-title').innerText = s + " MASTER CHRONOLOGY";
                document.getElementById('v-body').innerHTML = format(r.notes);
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }

        function executeSearch() {
            playThump();
            const q = document.getElementById('nameSearch').value.toLowerCase();
            const results = db.filter(r => r.raw.includes(q));
            let h = "";
            results.forEach(r => {
                h += `<div class="history-item"><div style="font-size:1.2em; color:#fff; font-weight:bold;">${r.name}</div><div>${format(r.notes)}</div></div>`;
            });
            document.getElementById('v-title').innerText = "SEARCH RESULTS";
            document.getElementById('v-body').innerHTML = h || "<p>No records found.</p>";
            document.getElementById('vault-overlay').style.display = 'block';
        }

        function closeVault() { document.getElementById('vault-overlay').style.display = 'none'; }

        window.onload = init;
    </script>
</body>
</html>
