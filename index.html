<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMA PERRY ANCESTORS</title> 
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 35px; background: #111; width: 95%; max-width: 900px; text-align: center; box-shadow: 0 0 60px rgba(212, 175, 55, 0.3); border-radius: 12px; }
        h1 { letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 15px; margin-bottom: 10px; font-size: 2em; }
        .subtitle { color: #888; font-style: italic; font-size: 0.95em; margin-bottom: 30px; }
        .search-area { margin-bottom: 40px; display: flex; gap: 10px; justify-content: center; }
        input { padding: 18px; width: 65%; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 1.1em; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 18px 35px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        #output { text-align: left; max-height: 700px; overflow-y: auto; padding-right: 20px; }
        .result-card { background: #161616; border-left: 5px solid #d4af37; padding: 25px; border-radius: 4px; margin-bottom: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        .result-name { color: #fff; font-size: 1.4em; font-weight: bold; display: block; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .result-data { color: #ccc; font-size: 1.1em; line-height: 1.7; font-style: italic; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>ERMA PERRY ANCESTORS</h1> 
        <div class="subtitle">The Chaney, Perry, & Vance Integrated Heritage Search</div>
        <div class="search-area">
            <input type="text" id="nameIn" placeholder="Search: Indians, Cherokee, Shawnee, Cornstalk...">
            <button onclick="runQuery()">Search Archive</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        async function runQuery() {
            const query = document.getElementById('nameIn').value.trim();
            const output = document.getElementById('output');
            if (!query) return;

            output.innerHTML = "<p style='text-align:center; color:#d4af37;'>Scanning all bloodlines for matches...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                
                let htmlOutput = "";
                records.forEach(record => {
                    if (record.toLowerCase().includes(query.toLowerCase())) {
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Heritage Record";
                        const notes = [...record.matchAll(/[1-2] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        htmlOutput += `
                            <div class="result-card">
                                <span class="result-name">${name}</span>
                                <div class="result-data">${notes ? notes : "Direct family connection found in lineage data."}</div>
                            </div>`;
                    }
                });

                output.innerHTML = htmlOutput || `<p style='text-align:center;'>The term "${query}" was not found in Gedcom.txt.</p>`;
            } catch (err) {
                output.innerHTML = "<p style='text-align:center;'>Error: Ensure Gedcom.txt is named correctly in GitHub.</p>";
            }
        }
    </script>
</body>
</html>
