<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* THE FIXED SPLASH SCREEN */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; 
            background-position: center 5%; /* PUSHES PICTURE UP HIGHER */
            background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            transition: opacity 1s ease;
        }

        .splash-overlay { 
            display: flex; justify-content: center; align-items: center; z-index: 5001; 
            gap: 20px; flex-wrap: wrap; 
            padding: 20px 10px;
            background: rgba(0,0,0,0.85); /* Solid floor for the buttons */
            width: 100%; box-sizing: border-box;
            border-top: 2px solid #d4af37;
        }

        .counter-panel { 
            background: #111; border: 1px solid #d4af37; 
            padding: 10px 15px; border-radius: 4px; color: #d4af37; 
            font-family: 'Courier New', monospace; font-size: 1em; font-weight: bold; 
        }

        .signature-box { 
            background: #000; width: 100%; text-align: center; 
            padding: 8px 0; color: #d4af37; font-size: 0.8em; text-transform: uppercase;
            z-index: 5001; letter-spacing: 2px;
        }

        /* MAIN UI */
        #main-ui { display:none; text-align: center; padding-top: 5px; }
        .header-box { padding: 15px; background: rgba(26, 15, 0, 0.95); border-bottom: 3px solid #d4af37; margin-bottom: 20px; }

        .control-row {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1400px; margin: 0 auto 30px auto; gap: 40px; padding: 0 20px;
        }
        .music-panel-small { flex: 0 0 300px; background: #211510; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; box-shadow: 0 0 15px #000; }
        
        input[type="text"] { 
            padding: 20px; width: 100%; background: #000; color: #fff; 
            border: 2px solid #d4af37; border-radius: 8px; font-size: 20px; 
        }

        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.8fr 1fr; align-items: start; 
            max-width: 1600px; margin: auto; gap: 40px; padding: 10px;
        }
        
        .side-column { display: flex; flex-direction: column; gap: 60px; }
        .family-btn-group { display: flex; align-items: center; gap: 30px; justify-content: center; }
        .family-thumb { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #d4af37; object-fit: cover; box-shadow: 0 0 25px rgba(212,175,55,0.4); }
        
        .central-container { position: relative; margin-top: -140px; } 
        .destiny-caption { color: #d4af37; font-weight: bold; font-size: 2.5em; margin-bottom: 30px; text-shadow: 4px 4px 8px #000; text-transform: uppercase; letter-spacing: 4px; }

        .wood-btn { 
            padding:20px 40px; background:linear-gradient(#5d4037, #1a0f00); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:4px; cursor:pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em; min-width: 200px;
        }
        .wood-btn:hover { border-color: #fff; box-shadow: 0 0 20px #d4af37; }
        .central-portrait { border: 5px solid #d4af37; border-radius: 15px; width: 100%; max-width: 600px; box-shadow: 0 20px 50px #000; }

        /* THE VAULT OVERLAY */
        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#0a0a0a; border:3px solid #d4af37; padding:50px; border-radius:10px; text-align: left; max-width: 1200px; margin: 40px auto; color: #fff; }
        .history-entry { border-bottom: 1px solid #3e2723; padding: 35px 0; line-height: 2.2; font-size: 1.3em; white-space: pre-wrap; }
        .history-section-title { color: #d4af37; border-bottom: 2px solid #d4af37; margin-top: 50px; margin-bottom: 20px; padding-bottom: 10px; font-size: 1.8em; text-transform: uppercase; letter-spacing: 2px; }
        .famous-name { color: #d4af37; font-weight: bold; font-size: 1.4em; }

        @media (max-width: 900px) {
            #splash { background-position: center 0%; background-size: cover; }
            .splash-overlay { flex-direction: column; padding: 20px; }
            .archive-grid { grid-template-columns: 1fr; }
            .central-container { order: -1; margin-top: 10px; margin-bottom: 50px; }
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay">
            <button class="wood-btn" onclick="enterArchive()">ENTER THE SAGA</button>
            <div class="counter-panel">VISITORS: <span id="v-count">0</span></div>
        </div>
        <div class="signature-box">Amos Keener: Slow Speaking, Heart on Fire</div>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 3px;">THE SOVEREIGN ARCHIVE</h1>
        </div>

        <div class="control-row">
            <div class="music-panel-small">
                <iframe width="100%" height="150" src="https://www.youtube.com/embed/s3W6GSlZ0Vs" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="search-panel-long" style="flex: 1;">
                <input type="text" id="nameSearch" placeholder="Trace the bloodline history...">
                <button class="wood-btn" style="margin-top: 15px; width: 100%;" onclick="trace()">DEEP TRACE LINEAGE</button>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-column">
                <div class="family-btn-group">
                    <img src="william_surname.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('CHANEY')">CHANEY</button>
                </div>
                <div class="family-btn-group">
                    <img src="raymond_surname.jpeg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('VANCE')">VANCE</button>
                </div>
                <div class="family-btn-group">
                    <img src="sellards.jpg" class="family-thumb">
                    <button class="wood-btn" onclick="openArchive('SELLARDS')">SELLARDS</button>
                </div>
            </div>

            <div class="central-container">
                <div class="destiny-caption">CHOOSE YOUR DESTINY</div>
                <img src="jenny_wiley_portrait.jpg" class="central-portrait">
            </div>

            <div class="side-column">
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('PERRY')">PERRY</button>
                    <img src="Jenny_wiley_ surname.jpeg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('CLAY')">CLAY</button>
                    <img src="clay.jpg" class="family-thumb">
                </div>
                <div class="family-btn-group">
                    <button class="wood-btn" onclick="openArchive('WILLIAMSON')">WILLIAMSON</button>
                    <img src="williamson.jpg" class="family-thumb">
                </div>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37; border-bottom: 2px solid #d4af37; padding-bottom: 15px;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 40px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN TO ARCHIVE</button>
        </div></div>
    </div>

    <script>
        const familyData = {
            'CHANEY': {
                title: "CHANEY: THE VIKING & NORMAN SAGA",
                content: `
                <div class="history-section-title">THE NORTHMEN (800 AD - 1066)</div>
                <div class="history-entry"><span class="famous-name">Rollo of Normandy (Hrolf Ganger):</span> The Viking Chieftain who forced the French King to cede Normandy. This is where the Chaney steel begins.
                <span class="famous-name">William the Conqueror:</span> Descendant of Rollo. The Chaney (Chesney) knights rode with William during the invasion of England in 1066.
                <span class="famous-name">Robert de Quesnay:</span> A Templar knight of the Chaney bloodline who served in the Crusades, establishing the family's military nobility in Yorkshire.</div>
                
                <div class="history-section-title">FAMOUS LINEAGE</div>
                <div class="history-entry"><span class="famous-name">Lon Chaney:</span> "The Man of a Thousand Faces." A legendary titan of early cinema.
                <span class="famous-name">Leonard Chaney (1895–1975):</span> The anchor of the modern American line, whose resilience during the Depression preserved the family flame.</div>`
            },
            'VANCE': {
                title: "VANCE: CRUSADERS & PRESIDENTS",
                content: `
                <div class="history-section-title">THE CRUSADES & ROYALTY</div>
                <div class="history-entry"><span class="famous-name">Raymond Vance:</span> A legendary figure in the defense of Jerusalem. The Vance name was synonymous with frontier bravery even in the Holy Land.
                <span class="famous-name">Andrew Jackson:</span> Connected through the deep Scotch-Irish Vance networks.
                <span class="famous-name">Zebulon Vance:</span> The famous Governor of North Carolina during the Civil War, representing the political power of the clan.</div>`
            },
            'PERRY': {
                title: "PERRY: BACON'S REBELLION & INDIAN HERITAGE",
                content: `
                <div class="history-section-title">COLONIAL FIRE & ADOPTION</div>
                <div class="history-entry"><span class="famous-name">Bacon's Rebellion (1676):</span> The Perrys were deeply involved in the first rebellion against British rule in Virginia.
                <span class="famous-name">The Adopted Boy:</span> A pivotal family record of a Native American boy adopted into the Perry lineage, merging the bloodlines forever.
                <span class="famous-name">Commodore Matthew Perry:</span> The man who opened Japan, showing the Perry reach across the oceans.</div>`
            },
            'CLAY': {
                title: "CLAY: THE ALDEN CLAY & JENNY WILEY STORY",
                content: `
                <div class="history-section-title">THE BIG SANDY MASSACRE</div>
                <div class="history-entry"><span class="famous-name">Alden Clay:</span> A central figure in the Appalachian frontier struggle.
                <span class="famous-name">Jenny Wiley (née Sellards):</span> The legendary survivor of the 1789 massacre. The Clay family was part of the rescue and the survival story that defined the Big Sandy Valley.
                <span class="famous-name">Henry Clay:</span> "The Great Compromiser." A statesman of the bloodline who shaped American history.</div>`
            }
        };

        function updateCounter() {
            let count = localStorage.getItem('visitorCount') || 15248;
            count = parseInt(count) + 1;
            localStorage.setItem('visitorCount', count);
            document.getElementById('v-count').innerText = count.toLocaleString();
        }
        window.onload = updateCounter;

        function enterArchive() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 1000);
        }

        function openArchive(key) {
            const data = familyData[key];
            if (data) {
                document.getElementById('v-title').innerText = data.title;
                document.getElementById('v-body').innerHTML = data.content;
                document.getElementById('vault-overlay').style.display = 'block';
            }
        }

        function trace() {
            const q = document.getElementById('nameSearch').value.toUpperCase().trim();
            if (familyData[q]) { openArchive(q); }
            else { alert("Tracing further into the deep records... try CHANEY, VANCE, or PERRY."); }
        }
    </script>
</body>
</html>
