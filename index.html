<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { 
            background-color: #050505; color: #e0c097; font-family: 'Georgia', serif; 
            margin: 0; padding: 0; background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        .header-fixed { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-bottom: 3px solid #3e2723; padding: 8px 0;
        }

        /* HIGH-GLOSS WOOD BUTTONS */
        .wood-btn { 
            padding: 14px; width: 92%; 
            background: linear-gradient(rgba(255,255,255,0.15), rgba(0,0,0,0.5)), 
                        url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #5d4037;
            color: #fbe9e7; border: 2px solid #211510; font-weight: bold; 
            border-radius: 8px; box-shadow: 0 6px 0 #211510;
            text-shadow: 1px 1px 2px #000; transition: all 0.1s; margin-bottom: 8px;
        }
        .wood-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #211510; }

        /* THE HERITAGE COLLAGE SECTION */
        .collage-container {
            margin-top: 190px; padding: 10px; display: grid;
            grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .collage-img {
            width: 100%; border: 2px solid #5d4037; border-radius: 4px;
            box-shadow: 0 4px 8px #000;
        }
        .collage-img.wide { grid-column: span 2; }

        .footer-fixed { 
            position: fixed; bottom: 0; width: 100%; z-index: 2000; 
            background: #1a0f00; border-top: 3px solid #3e2723; 
            padding: 10px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; 
        }

        #vault-overlay { 
            display:none; position: fixed; top: 5%; left: 5%; width: 90%; height: 85%; 
            background: #0c0c0c; border: 4px solid #5d4037; z-index: 3000; 
            overflow-y: auto; padding: 15px; background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }
    </style>
</head>
<body>

    <div class="header-fixed">
        <center>
            <input type="text" id="nameSearch" style="padding:12px; width:88%; margin-bottom:8px;" placeholder="Trace Bloodline...">
            <button class="wood-btn" onclick="executeSearch('name')">EXECUTE TRACE</button>
        </center>
    </div>

    <div class="collage-container" id="heritage-collage">
        <img src="Jenny Wiley.jpg" class="collage-img" alt="Jenny Wiley Portrait">
        <img src="1000043784.jpg" class="collage-img" alt="Frontier Cabin">
        <img src="Jenny Wiley Grabe site.jpg" class="collage-img wide" alt="Jenny Wiley Grave">
    </div>

    <div id="content-wrapper" style="display:none;"><div id="output-area"></div></div>

    <div class="footer-fixed">
        <button class="wood-btn" style="width:30%; padding:8px;" onclick="openMaster('CHANEY')">CHANEY</button>
        <button class="wood-btn" style="width:30%; padding:8px;" onclick="openMaster('VANCE')">VANCE</button>
    </div>

    <audio id="mohicansPlayer" loop><source src="The Last of the Mohicans - Promontory (Main Theme).mp3" type="audio/mpeg"></audio>
    <audio id="woodThump"><source src="https://www.soundjay.com/buttons/sounds/button-14.mp3" type="audio/mpeg"></audio>

    <script>
        const thump = document.getElementById('woodThump');
        const music = document.getElementById('mohicansPlayer');

        function buttonThump() {
            thump.currentTime = 0;
            thump.play().catch(e => console.log("Sound ready"));
        }

        function openMaster(s) {
            buttonThump();
            if(music.paused) { music.volume = 0; music.play(); /* Fade logic here */ }
            // Overlay logic...
        }

        function executeSearch() {
            buttonThump();
            document.getElementById('heritage-collage').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
            // Search logic...
        }
    </script>
</body>
</html>
