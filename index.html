<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Master Archive</title>
    <style>
        body { font-family: 'Segoe UI', serif; background-color: #f4f1ea; margin: 0; padding: 0; }
        
        /* SIMPLE SPLASH PAGE */
        #splash {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            text-align: center;
        }
        .splash-card { max-width: 450px; width: 90%; }
        .splash-card img { 
            width: 100%; 
            border-radius: 8px; 
            border: 2px solid #3e2723; 
            margin-bottom: 20px; 
        }
        h1 { color: #3e2723; margin-bottom: 20px; }
        
        /* PLAIN CODE BOX */
        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #3e2723;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .btn {
            background-color: #3e2723;
            color: #fff;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* HIDDEN ARCHIVE CONTENT */
        #main-archive { display: none; padding: 40px; max-width: 1200px; margin: auto; }
