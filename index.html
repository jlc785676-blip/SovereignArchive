<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN HERITAGE ARCHIVE</title>
    <style>
        body { background-color: #0a0a0a; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 0; text-align: center; }
        
        .header-section { 
            text-align: center; 
            padding: 80px 20px; 
            width: 100%; 
            background: #0d0d0d; 
            border-bottom: 2px solid #d4af37; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 6px; font-size: 2.8em; margin: 0; }
        .tagline { color: #888; font-style: italic; margin-top: 15px; letter-spacing: 2px; font-size: 1.1em; }

        .search-container { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            width: 100%; 
            background: rgba(10, 10, 10, 0.95); 
            padding: 30px 0; 
            border-bottom: 1px solid #222; 
            display: flex; 
            justify-content: center; 
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        input { 
            padding: 18px 30px; 
            width: 550px; 
            background: #000; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 5px; 
            font-size: 1.2em; 
            outline: none; 
            transition: 0.3s;
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }

        button { 
            padding: 18px 45px; 
            background: #d4af37; 
            color: black; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 1.1em; 
            text-transform: uppercase; 
            transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 25px #d4af37; }

        #output-area { 
            width: 95%; 
            max-width: 1500px; 
            margin: 40px auto; 
            text-align: left; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tree-node { 
            background: rgba(20, 20, 20, 0.95); 
            border-left: 12px solid #d4af37; 
            padding: 45px; 
            margin-bottom: 35px; 
            border-radius: 0 15px 15px 0; 
            box-shadow: 15px 15px 45px rgba(0,0,0,0.8);
            width: 100%;
            box-sizing: border-box;
        }

        .name-banner { font-size: 2.2em; color: #fff; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .story-box { 
            color: #ccc; 
            font-size: 1.4em; 
            line-height: 2.0; 
            margin-top: 25px; 
            border-top: 1px solid #333; 
            padding-top: 25px; 
            font-style: italic; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>SOVEREIGN ARCHIVE</h1>
        <div class="tagline">Chaney • Perry • Vance • Wiley • Adkins • Williamson • Clay</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search Ancestors, 'Indians', 'Weaver', or 'Freemason'...">
        <button onclick="searchVault()">Unlock History</button>
    </div>

    <div id="output-area"></div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;

            output.innerHTML = "<p style='color:#d4af37; font-size:1.8em;'>Consulting the Master Bloodlines...</p>";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const records = text.split('0 @');
                let html = "";
                let count = 0;

                records.forEach(record => {
                    if (record.toLowerCase().includes(query)) {
                        count++;
                        const name = record.match(/1 NAME (.*)/)?.[1]?.replace(/\//g, '') || "Archived Ancestor";
                        const notes = [...record.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        html += `<div class="tree-node">
                                    <div class="name-banner">${name}</div>
                                    <div class="story-box">${notes}</div>
                                 </div>`;
                    }
                });

                output.innerHTML = count > 0 ? html : `<p style='font-size:1.5em;'>No records found for "${query}". Check Gedcom.txt.</p>`;
            } catch (err) { output.innerHTML = "Error: Gedcom.txt not found on server."; }
        }
    </script>
</body>
</html>
