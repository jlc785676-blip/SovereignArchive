<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Archive: The Master Record</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; text-align: center; padding: 20px; }
        .vault { border: 2px solid #d4af37; padding: 30px; background: #111; max-width: 850px; margin: auto; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); border-radius: 8px; }
        .input-group { margin: 15px auto; max-width: 400px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.8em; text-transform: uppercase; color: #888; }
        input { padding: 12px; width: 100%; background: #1a1a1a; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 4px; }
        button { padding: 15px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; border-radius: 4px; }
        .results-area { margin-top: 30px; text-align: left; display: none; }
        .card { background: #1a1a1a; border-left: 4px solid #d4af37; padding: 20px; margin-bottom: 15px; border-radius: 0 4px 4px 0; position: relative; }
        .age-tag { position: absolute; right: 15px; top: 15px; background: #d4af37; color: #000; font-size: 0.7em; padding: 2px 8px; font-weight: bold; border-radius: 3px; }
        .google-box { border: 1px solid #fff; padding: 20px; background: #000; border-radius: 4px; margin-top: 20px; text-align: center; }
        .btn-link { display: inline-block; padding: 12px 25px; background: #fff; color: #000; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 10px;}
    </style>
</head>
<body>
    <div class="vault">
        <h1>SOVEREIGN ARCHIVE</h1>
        <p><i>The Combined Chaney, Vance, & Perry Historical Record</i></p>
        
        <div class="input-group">
            <label>Name to Research</label>
            <input type="text" id="targetName" placeholder="e.g. Leonard Chaney">
        </div>
        <div class="input-group">
            <label>Your Birth Year (for timeline)</label>
            <input type="number" id="targetBirth" placeholder="e.g. 1978">
        </div>
        <button onclick="runDeepSearch()">Execute Master Search</button>

        <div id="display" class="results-area">
            <div id="familyMatch" class="card">
                <span id="matchAge" class="age-tag"></span>
                <span style="color:#d4af37; font-weight:bold; font-size:0.8em; text-transform:uppercase;">Archive Status: Verified Lineage</span>
                <h2 id="matchTitle" style="margin: 10px 0; color:#fff;"></h2>
                <p id="matchLineage" style="color:#ccc; font-style: italic;"></p>
                <p id="matchStory" style="color:#bbb; line-height: 1.5;"></p>
            </div>

            <div class="google-box">
                <h3 style="color:#fff; margin-top:0;">Global Record Handshake</h3>
                <p id="searchStatus" style="font-size:0.9em; color:#888; margin-bottom: 15px;"></p>
                <div id="linkContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const masterVault = {
            "josh chaney": { birth: 1978, line: "Son of Oshel Chaney & Erma Perry", story: "Current Steward of the Archive. Leading the 1970 Mustang restoration." },
            "oshel chaney": { birth: 1949, line: "Son of Newman Chaney & Arminda Vance", story: "Bridge between generations. Connected the Chaney and Perry lineages." },
            "erma perry": { birth: 1955, line: "Daughter of Walter Lake Perry & Pansey Perry", story: "Link to the Clay-Davis frontier records. Central matriarch." },
            "leonard chaney": { birth: 1897, line: "Husband of Lillie Dyer (1901-1982)", story: "WWI-era pioneer. Rooted the family in Ohio." },
            "john hobert vance": { birth: 1895, line: "Husband of Erie Elmer Watts (1907-2005)", story: "Appalachian frontier veteran. Key figure in the Vance migration history." }
        };

        function runDeepSearch() {
            const nameInput = document.getElementById('targetName').value.trim();
            const birthInput = parseInt(document.getElementById('targetBirth').value);
            const display = document.getElementById('display');
            const familyCard = document.getElementById('familyMatch');

            if (!nameInput) { alert("Please enter a name."); return; }
            display.style.display = 'block';

            const nameKey = nameInput.toLowerCase();

            // 1. Check Vault for Family
            if (masterVault[nameKey]) {
                const p = masterVault[nameKey];
                familyCard.style.display = 'block';
                document.getElementById('matchTitle').innerText = nameInput.toUpperCase();
                document.getElementById('matchLineage').innerText = p.line;
                document.getElementById('matchStory').innerText = p.story;
                
                if (birthInput) {
                    const diff = p.birth - birthInput;
                    document.getElementById('matchAge').innerText = diff > 0 ? diff + " Yrs After You" : Math.abs(diff) + " Yrs Before You";
                } else {
                    document.getElementById('matchAge').innerText = "Verified";
                }
            } else {
                familyCard.style.display = 'none';
            }

            // 2. Build Google Link
            const query = encodeURIComponent(`${nameInput} ${birthInput || ''} genealogy records`);
            document.getElementById('searchStatus').innerText = `Syncing external archives for ${nameInput}...`;
            document.getElementById('linkContainer').innerHTML = `
                <a href="https://www.google.com/search?q=${query}" target="_blank" class="btn-link">
                    OPEN GOOGLE RECORDS FOR ${nameInput.toUpperCase()}
                </a>
            `;
        }
    </script>
</body>
</html>
