<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOVEREIGN ARCHIVE</title>
    <style>
        body { background-color:#050505; color:#e0c097; font-family:'Georgia',serif; margin:0; padding:0; overflow-x: hidden; background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png'); }
        
        /* The Splash Screen */
        #splash { 
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:5000; 
            background-color: #050505;
            background-image: url('movie_splash.png'); 
            background-size: cover; background-position: center center; background-repeat: no-repeat;
            transition: opacity 1s ease;
        }

        /* The Interactive Overlay */
        .splash-overlay {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5001; gap: 15px;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 4px;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .signature-text {
            color: #e0c097; font-size: 1.1em; font-style: italic; letter-spacing: 1px;
            text-shadow: 1px 1px 5px #000;
        }

        .wood-btn { 
            padding:15px; background:linear-gradient(#5d4037, #211510); color:#fbe9e7; 
            border:2px solid #d4af37; font-weight:bold; border-radius:8px; cursor:pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 2px;
        }
        .wood-btn:hover { border-color: #fff; box-shadow: 0 0 15px #d4af37; }

        /* Main UI (Hidden initially) */
        #main-ui { display:none; text-align: center; padding-top: 20px; }
        .header-box { padding: 20px; background: rgba(26, 15, 0, 0.9); border-bottom: 3px solid #3e2723; margin-bottom: 20px; }
        
        .music-control { 
            background: #211510; border: 2px solid #d4af37; padding: 15px; 
            border-radius: 8px; margin: 15px auto; max-width: 400px;
        }

        .archive-grid { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; 
            max-width: 1000px; margin: auto; gap: 20px; padding: 20px;
        }
        .side-buttons { display: flex; flex-direction: column; gap: 25px; }
        .central-portrait { border: 4px solid #d4af37; border-radius: 10px; width: 100%; max-width: 400px; }

        #vault-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; overflow-y:auto; padding:20px; }
        .vault-content { background:#111; border:2px solid #d4af37; padding:35px; border-radius:8px; text-align: left; max-width: 900px; margin: auto; }
        
        input[type="text"] { padding:15px; width:60%; background:#000; color:#fff; border:1px solid #d4af37; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay">
            <div class="counter-box">VISITORS: <span id="v-count">0</span></div>
            <div class="signature-text">By Josh Chaney</div>
            <button class="wood-btn" style="font-size: 1.8em; padding: 20px 60px;" onclick="enterArchive()">ENTER THE SAGA</button>
        </div>
    </div>

    <div id="main-ui">
        <div class="header-box">
            <h1 style="color:#d4af37; margin:0; letter-spacing: 4px;">THE SOVEREIGN ARCHIVE</h1>
            <p style="color:#888; font-style: italic;">The bloodline of Erma Perry Keener</p>
            
            <div class="music-control">
                <iframe width="100%" height="160" src="https://www.youtube.com/embed/9tjdswqGGVg" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            
            <div style="margin-top:20px;">
                <input type="text" id="nameSearch" placeholder="Trace lineage...">
                <button class="wood-btn" onclick="trace()">TRACE</button>
            </div>
        </div>

        <div class="archive-grid">
            <div class="side-buttons">
                <button class="wood-btn" onclick="quick('CHANEY')">CHANEY</button>
                <button class="wood-btn" onclick="quick('VANCE')">VANCE</button>
            </div>
            <img src="jenny_wiley_portrait.jpg" class="central-portrait">
            <div class="side-buttons">
                <button class="wood-btn" onclick="quick('PERRY')">PERRY</button>
                <button class="wood-btn" onclick="quick('CLAY')">CLAY</button>
            </div>
        </div>

        <div id="vault-overlay"><div class="vault-content">
            <h2 id="v-title" style="color:#d4af37;"></h2>
            <div id="v-body"></div>
            <button class="wood-btn" style="width: 100%; margin-top: 20px;" onclick="document.getElementById('vault-overlay').style.display='none'">RETURN</button>
        </div></div>
    </div>

    <script>
        let db = [];

        // COMPUTER GENERATED VISITOR COUNT
        function updateCounter() {
            let count = localStorage.getItem('visitorCount');
            if (count === null) {
                count = 15248; // Starting at your preferred baseline
            } else {
                count = parseInt(count) + 1;
            }
            localStorage.setItem('visitorCount', count);
            document.getElementById('v-count').innerText = count.toLocaleString();
        }

        window.onload = updateCounter;

        function enterArchive() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                load();
            }, 1000);
        }

        async function load() {
            const r = await fetch('Gedcom.txt?v=' + Date.now());
            const t = await r.text();
            db = t.split('0 @').filter(x => x.trim()).map(x => {
                const n = x.match(/1 NAME (.*)/);
                const notes = [...x.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n');
                return { name: n ? n[1].replace(/\//g, '').trim() : "Record", raw: x.toLowerCase(), notes: notes };
            });
        }

        function quick(n) { document.getElementById('nameSearch').value = n; trace(); }

        function trace() {
            const q = document.getElementById('nameSearch').value.toLowerCase().trim();
            if (!q) return;
            const res = db.filter(x => x.raw.includes(q));
            let h = "";
            res.forEach(x => {
                h += `<div style="border: 1px solid #d4af37; padding: 25px; background: #0a0a0a; margin-bottom: 25px;"><div style="font-size:1.4em; color:#fff;">${x.name}</div><div style="white-space:pre-wrap;">${x.notes}</div></div>`;
            });
            document.getElementById('v-title').innerText = "DEEP TRACE: " + q.toUpperCase();
            document.getElementById('v-body').innerHTML = h || "No records found.";
            document.getElementById('vault-overlay').style.display = 'block';
        }
    </script>
</body>
</html>
