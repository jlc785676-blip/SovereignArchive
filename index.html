<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BLOODLINE ARCHIVE</title>
    <style>
        body { background-color: #050505; color: #e0c097; font-family: 'Georgia', serif; margin: 0; padding: 0; text-align: center; }
        
        /* Responsive Banner */
        .heritage-banner {
            width: 100%; min-height: 400px; padding: 40px 10px; box-sizing: border-box;
            background: linear-gradient(rgba(5,5,5,0.4), rgba(5,5,5,1)), url('1000043712.jpg'); 
            background-size: cover; background-position: center 20%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 5px; font-size: clamp(2em, 5vw, 3.5em); margin: 0; text-shadow: 3px 3px 15px #000; }
        .tagline { color: #fff; font-style: italic; margin-top: 15px; letter-spacing: 2px; font-size: clamp(1em, 3vw, 1.3em); text-shadow: 2px 2px 10px #000; max-width: 95%; line-height: 1.6; }

        /* Responsive Search Bar */
        .search-container { 
            position: sticky; top: 0; z-index: 1000; background: rgba(10,10,10,0.98); 
            padding: 20px 10px; border-bottom: 1px solid #333; 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; 
            backdrop-filter: blur(10px); 
        }
        input { 
            padding: 15px 20px; width: 100%; max-width: 450px; box-sizing: border-box;
            background: #000; border: 1px solid #555; color: #fff; border-radius: 5px; 
            font-size: 1.1em; outline: none; 
        }
        input:focus { border-color: #d4af37; }
        button { 
            padding: 15px 30px; width: 100%; max-width: 250px; box-sizing: border-box;
            background: #d4af37; color: #000; border: none; font-weight: bold; 
            cursor: pointer; border-radius: 5px; font-size: 1.1em; text-transform: uppercase; 
        }

        /* Content Area */
        #output-area { width: 95%; max-width: 1000px; margin: 40px auto; text-align: left; }
        
        /* Main Record Box */
        .tree-node { 
            background: #111; border-left: 8px solid #d4af37; padding: 25px; margin-bottom: 20px; 
            border-radius: 0 10px 10px 0; box-shadow: 5px 5px 20px rgba(0,0,0,0.8); 
            box-sizing: border-box;
        }
        .name-banner { font-size: clamp(1.8em, 4vw, 2.4em); color: #fff; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .story-box { color: #ccc; font-size: clamp(1.1em, 3vw, 1.3em); line-height: 1.8; white-space: pre-wrap; }
        .story-box strong { color: #d4af37; font-size: 1.05em; }

        /* Ancestors Section */
        .ancestor-section { margin-top: 30px; padding-top: 25px; border-top: 2px solid #333; }
        .ancestor-title { color: #d4af37; font-size: clamp(1.4em, 4vw, 1.8em); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-align: center; }
        
        /* Mobile Grid */
        .ancestor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .anc-node { background: #1a1a1a; border-left: 5px solid #888; padding: 20px; border-radius: 5px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .anc-name { font-size: 1.4em; color: #fff; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; }
        .anc-story { font-size: 1.05em; color: #bbb; line-height: 1.6; white-space: pre-wrap; }
        .anc-story strong { color: #d4af37; }
    </style>
</head>
<body>
    <div class="heritage-banner">
        <h1>THE BLOODLINE ARCHIVE</h1>
        <div class="tagline">Chaney • Perry • Vance • Dyer • Watts • Davis • Clay • Williamson • Adkins</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search Name (e.g., Irma, Pansy)...">
        <button onclick="searchVault()">Trace Bloodline</button>
    </div>

    <div id="output-area">
        <p style="text-align: center; font-size: 1.3em; font-style: italic; color: #888; margin-top: 40px; padding: 0 10px;">
            Enter an ancestor's name to map their records and lineage.
        </p>
    </div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;
            
            output.innerHTML = "<p style='color:#d4af37; font-size:1.5em; text-align:center;'>Tracing the Bloodline...</p>";
            
            try {
                const response = await fetch('Gedcom.txt?v=' + new Date().getTime());
                const text = await response.text();
                const rawItems = text.replace(/\r/g, '').split('0 @').filter(item => item.trim().length > 0);
                
                const database = rawItems.map(item => {
                    const nameMatch = item.match(/1 NAME (.*)/);
                    const cleanName = nameMatch ? nameMatch[1].replace(/\//g, '').trim() : "Unknown Record";
                    let notes = [...item.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                    return { name: cleanName, rawText: item, notes: notes };
                });

                const searchTerms = query.split(' ').filter(term => term.length > 0);

                // Smarter Search: Looks at the NAME, or looks inside the KEYWORDS line
                let primaryMatches = database.filter(record => {
                    return searchTerms.every(term => {
                        let nameMatch = record.name.toLowerCase().includes(term);
                        let keywordLine = record.notes.split('\n').find(line => line.toLowerCase().includes('keywords:'));
                        let keywordMatch = keywordLine ? keywordLine.toLowerCase().includes(term) : false;
                        return nameMatch || keywordMatch;
                    });
                });

                if (primaryMatches.length === 0) {
                    output.innerHTML = `<p style='font-size:1.4em; text-align:center; padding: 20px;'>No record found for "${query}". Check spelling.</p>`;
                    return;
                }

                let foundHtml = "";
                const highlightRegex = /(GENERATION 1 \(SUBJECT\):|GENERATION 1 \(SISTER\):|GENERATION 2 \(FATHER\):|GENERATION 2 \(MOTHER\):|GENERATION 3 \(PATERNAL GRANDFATHER\):|GENERATION 3 \(PATERNAL GRANDMOTHER\):|GENERATION 3 \(MATERNAL GRANDFATHER\):|GENERATION 3 \(MATERNAL GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDFATHER\):|GENERATION 4 \(GREAT-GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDPARENT FIGURE\):|GENERATION 4 \(GREAT-GRANDMOTHER FIGURE\):|FAMILY:|PARENTS:|HISTORY:|YORKSHIRE LINEAGE:|THE WEAVER:|DOCUMENTATION:|MILITARY RECORDS:|THE NAVIGATOR:)/g;

                primaryMatches.forEach(mainRecord => {
                    // Remove the Keywords line from the final display so it looks clean
                    let displayNotes = mainRecord.notes.replace(/Keywords:.*$/gm, '').trim();
                    let mainNotesHtml = displayNotes.replace(highlightRegex, "<strong>$1</strong>");
                    
                    foundHtml += `<div class="tree-node">
                                    <div class="name-banner">${mainRecord.name}</div>
                                    <div class="story-box">${mainNotesHtml}</div>
                                  </div>`;
                    
                    let ancestors = [];
                    let queue = [mainRecord];
                    let visited = new Set();
                    visited.add(mainRecord.name);

                    while(queue.length > 0) {
                        let current = queue.shift();
                        let parentMatch = current.notes.match(/PARENTS:\s*([^\n]+)/);
                        
                        if (parentMatch) {
                            let parentNames = parentMatch[1].split(',').map(n => n.trim());
                            parentNames.forEach(pName => {
                                let pRecord = database.find(r => r.name.toLowerCase() === pName.toLowerCase());
                                if (pRecord && !visited.has(pRecord.name)) {
                                    visited.add(pRecord.name);
                                    ancestors.push(pRecord);
                                    queue.push(pRecord);
                                }
                            });
                        }
                    }

                    if (ancestors.length > 0) {
                        foundHtml += `<div class="ancestor-section">
                                        <div class="ancestor-title">Ancestors of ${mainRecord.name}</div>
                                        <div class="ancestor-grid">`;
                        
                        ancestors.forEach(anc => {
                            let ancDisplayNotes = anc.notes.replace(/Keywords:.*$/gm, '').trim();
                            let ancNotesHtml = ancDisplayNotes.replace(highlightRegex, "<strong>$1</strong>");
                            foundHtml += `<div class="anc-node">
                                            <div class="anc-name">${anc.name}</div>
                                            <div class="anc-story">${ancNotesHtml}</div>
                                          </div>`;
                        });
                        
                        foundHtml += `</div></div>`;
                    }
                });
                
                output.innerHTML = foundHtml;
                
            } catch (err) { 
                output.innerHTML = "<p style='text-align:center; font-size:1.3em; color:red;'>Error connecting to Gedcom.txt.</p>"; 
            }
        }
    </script>
</body>
</html>
