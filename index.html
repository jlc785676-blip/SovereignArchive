<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CHANEY ANCESTRY ARCHIVE</title>
    <style>
        body { 
            background-color: #050505; 
            color: #e0c097; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
        }
        
        /* Your specifically uploaded image is set here */
        .heritage-banner {
            width: 100%;
            height: 600px;
            background: linear-gradient(rgba(5,5,5,0.3), rgba(5,5,5,1)), url('1000043712.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 8px; font-size: 3.5em; margin: 0; text-shadow: 3px 3px 15px #000; }
        .tagline { color: #fff; font-style: italic; margin-top: 15px; letter-spacing: 3px; font-size: 1.3em; text-shadow: 2px 2px 10px #000; }

        .search-container { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: rgba(10,10,10,0.98); 
            padding: 35px 0; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            backdrop-filter: blur(10px); 
        }
        
        input { 
            padding: 20px 30px; 
            width: 600px; 
            background: #000; 
            border: 1px solid #555; 
            color: #fff; 
            border-radius: 5px; 
            font-size: 1.3em; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        
        button { 
            padding: 20px 50px; 
            background: #d4af37; 
            color: #000; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 1.2em; 
            text-transform: uppercase; 
            transition: 0.3s; 
        }
        button:hover { background: #fff; box-shadow: 0 0 25px #d4af37; }

        #output-area { 
            width: 95%; 
            max-width: 1500px; 
            margin: 50px auto; 
            text-align: left; 
        }
        
        .tree-node { 
            background: #111; 
            border-left: 12px solid #d4af37; 
            padding: 45px; 
            margin-bottom: 40px; 
            border-radius: 0 15px 15px 0; 
            box-shadow: 10px 10px 40px rgba(0,0,0,0.9); 
        }
        
        .name-banner { 
            font-size: 2.6em; 
            color: #fff; 
            font-weight: bold; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .story-box { 
            color: #ccc; 
            font-size: 1.5em; 
            line-height: 2.0; 
            white-space: pre-wrap; 
        }
        
        .story-box strong { color: #d4af37; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="heritage-banner">
        <h1>THE CHANEY ARCHIVE</h1>
        <div class="tagline">Chaney • Vance • Perry • Clay • Watts • Dyer • Davis</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchIn" placeholder="Search Names, Dates, or History (e.g., Leonard, 1895, Military)...">
        <button onclick="searchVault()">Explore Archive</button>
    </div>

    <div id="output-area">
        <p style="text-align: center; font-size: 1.5em; font-style: italic; color: #888; margin-top: 50px;">
            Enter a family name, date, or topic to scan the complete four-generation pedigree overview.
        </p>
    </div>

    <script>
        async function searchVault() {
            const query = document.getElementById('searchIn').value.trim().toLowerCase();
            const output = document.getElementById('output-area');
            if (!query) return;
            
            output.innerHTML = "<p style='color:#d4af37; font-size:2em; text-align:center;'>Consulting the Living Document...</p>";
            
            try {
                // Fetch the master Gedcom file
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const items = text.split('0 @');
                let foundHtml = "";
                
                // Allow users to type multiple words and find them anywhere in the record
                const searchTerms = query.split(' ').filter(term => term.length > 0);

                items.forEach(item => {
                    const itemLower = item.toLowerCase();
                    const isMatch = searchTerms.every(term => itemLower.includes(term));
                    
                    if (isMatch && item.trim().length > 0) {
                        const nameMatch = item.match(/1 NAME (.*)/);
                        const name = nameMatch ? nameMatch[1].replace(/\//g, '') : "Archive Record";
                        
                        // Extract all lines starting with "2 NOTE" and join them with double line breaks
                        let notes = [...item.matchAll(/[1-3] NOTE (.*)/g)].map(m => m[1]).join('\n\n');
                        
                        // Highlight key headings from the archive text in Gold
                        notes = notes.replace(/(GENERATION 1:|GENERATION 2 \(FATHER\):|GENERATION 2 \(MOTHER\):|GENERATION 3 \(GRANDFATHER\):|GENERATION 3 \(GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDFATHER\):|GENERATION 4 \(GREAT-GRANDMOTHER\):|GENERATION 4 \(GREAT-GRANDPARENT FIGURE\):|GENERATION 4 \(GREAT-GRANDMOTHER FIGURE\):|FAMILY:|THE NAVIGATOR:|MILITARY RECORDS:|HISTORY:|YORKSHIRE LINEAGE:|THE WEAVER:|DOCUMENTATION:)/g, "<strong>$1</strong>");

                        foundHtml += `<div class="tree-node">
                                        <div class="name-banner">${name}</div>
                                        <div class="story-box">${notes}</div>
                                      </div>`;
                    }
                });
                
                output.innerHTML = foundHtml || `<p style='font-size:1.8em; text-align:center;'>No records found for "${query}".</p>`;
            } catch (err) { 
                output.innerHTML = "<p style='text-align:center; font-size:1.5em; color:red;'>Error connecting to Gedcom.txt. Ensure files are saved together.</p>"; 
            }
        }
    </script>
</body>
</html>
