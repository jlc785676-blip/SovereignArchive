<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Archive: Deep Query</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .vault-container { border: 2px solid #d4af37; padding: 30px; background: #111; width: 95%; max-width: 800px; text-align: center; box-shadow: 0 0 40px rgba(212, 175, 55, 0.15); border-radius: 12px; }
        h1 { letter-spacing: 5px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 10px; margin-bottom: 25px; }
        .search-area { margin-bottom: 20px; }
        input { padding: 15px; width: 60%; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        button { padding: 15px 25px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
        #output { margin-top: 20px; text-align: left; background: #050505; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; border: 1px solid #222; border-radius: 4px; display: none; white-space: pre-wrap; font-size: 0.85em; max-height: 500px; overflow-y: auto; }
        .label { color: #d4af37; font-family: 'Georgia', serif; font-size: 0.9em; margin-bottom: 10px; display: block; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h1>Sovereign Archive</h1>
        <div class="search-area">
            <input type="text" id="nameInput" placeholder="Enter Ancestor (e.g. Abraham Perry)">
            <button onclick="queryDeepLineage()">QUERY ARCHIVE</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        async function queryDeepLineage() {
            const nameInput = document.getElementById('nameInput').value.trim();
            const output = document.getElementById('output');
            if (!nameInput) return;

            output.style.display = 'block';
            output.innerHTML = "Accessing Gedcom.txt database...";

            try {
                const response = await fetch('Gedcom.txt');
                const text = await response.text();
                const lines = text.split('\n');
                
                let foundLine = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].toLowerCase().includes(nameInput.toLowerCase())) {
                        foundLine = i;
                        break;
                    }
                }

                if (foundLine !== -1) {
                    // Calculate the start point (30 lines before the match)
                    const startLine = Math.max(0, foundLine - 30);
                    const ancestorBlock = lines.slice(startLine, foundLine + 1).join('\n');
                    
                    output.innerHTML = `<span class="label">30-Line Historical Context:</span>\n${ancestorBlock}`;
                } else {
                    output.innerHTML = "No record matching '" + nameInput + "' found in the master file.";
                }
            } catch (error) {
                output.innerHTML = "Error: System could not reach Gedcom.txt. Check file naming on GitHub.";
            }
        }
    </script>
</body>
</html>
